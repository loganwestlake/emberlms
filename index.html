<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember LMS</title>
  <meta name="description" content="The modern standard for learning.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            ember: {
              bg: '#0A0A0A',
              surface: '#141414',
              amber: '#F59E0B',
              violet: '#8B5CF6',
            }
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    .transition-all {
      transition-property: all;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 200ms;
    }
    .input-glow:focus {
      outline: none;
      border-color: #8B5CF6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }
    body { -webkit-tap-highlight-color: transparent; }
    .grad-amber  { background: linear-gradient(135deg, #F59E0B, #EA580C); }
    .grad-violet { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
    .grad-teal   { background: linear-gradient(135deg, #14B8A6, #0891B2); }
    .grad-rose   { background: linear-gradient(135deg, #F43F5E, #DB2777); }
    .grad-blue   { background: linear-gradient(135deg, #3B82F6, #4F46E5); }
    .grad-emerald{ background: linear-gradient(135deg, #10B981, #059669); }
    .modal-overlay { backdrop-filter: blur(6px); }
  </style>
</head>
<body class="bg-[#0A0A0A] text-[#EDEDED] font-sans antialiased">
  <div id="app"></div>

  <script type="module">
    // ═══════════════════════════════════════════════════════════════════
    // ⚙️  CONFIG
    // ═══════════════════════════════════════════════════════════════════
    const BASE_PATH = '/emberlms';

    // ═══════════════════════════════════════════════════════════════════
    // 🔥 FIREBASE
    // ═══════════════════════════════════════════════════════════════════
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore,
      doc, getDoc, setDoc, addDoc, deleteDoc,
      collection, query, where, orderBy, onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHMgZklzO2Uu7v8Lm248DuU4QJ2RaCp44",
      authDomain: "ember-lms.firebaseapp.com",
      projectId: "ember-lms",
      storageBucket: "ember-lms.firebasestorage.app",
      messagingSenderId: "198763545245",
      appId: "1:198763545245:web:58b4d76df1181600fd0a74"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const secondaryApp = initializeApp(firebaseConfig, "Secondary");
    const secondaryAuth = getAuth(secondaryApp);

    // ═══════════════════════════════════════════════════════════════════
    // 🧭 ROUTER
    // ═══════════════════════════════════════════════════════════════════
    const RESERVED = ['onboard', 'login', 'signup', 'api', 'assets'];
    const GRADIENTS = ['grad-amber', 'grad-violet', 'grad-teal', 'grad-rose', 'grad-blue', 'grad-emerald'];

    function getAppSegments() {
      let pathname = decodeURIComponent(window.location.pathname);
      if (BASE_PATH && pathname.startsWith(BASE_PATH)) {
        pathname = pathname.slice(BASE_PATH.length);
      }
      return pathname.split('/').filter(Boolean);
    }

    function buildUrl(relative = '/') {
      const clean = relative.startsWith('/') ? relative : '/' + relative;
      const joined = (BASE_PATH + clean).replace(/\/+/g, '/');
      const trimmed = joined.replace(/\/$/, '');
      return trimmed || '/';
    }

    function navigate(path) { window.location.href = buildUrl(path); }

    function parseRoute() {
      const savedPath = sessionStorage.getItem('ember_redirect_path');
      if (savedPath) {
        sessionStorage.removeItem('ember_redirect_path');
        try { window.history.replaceState(null, '', savedPath); } catch (e) {}
      }

      const segments = getAppSegments();

      if (segments.length === 0) return { type: 'landing', tenant: null, segments: [] };

      const first = segments[0];
      if (RESERVED.includes(first)) {
        return { type: first, tenant: null, segments: segments.slice(1) };
      }
      return { type: 'tenant', tenant: first, segments: segments.slice(1) };
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🎨 UI HELPERS
    // ═══════════════════════════════════════════════════════════════════
    const appEl = document.getElementById('app');

    function refreshIcons() { if (window.lucide) window.lucide.createIcons(); }
    function render(html) { appEl.innerHTML = html; refreshIcons(); }

    function slugify(str) {
      return String(str || '')
        .toLowerCase()
        .replace(/[^a-z0-9-]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
    }

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function pickGradient(seed) {
      const s = String(seed || '');
      let h = 0;
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
      return GRADIENTS[Math.abs(h) % GRADIENTS.length];
    }

    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🔐 AUTH STATE
    // ═══════════════════════════════════════════════════════════════════
    let currentUser = null;
    let authReady = false;

    // Active Firestore unsubscribe handles (so we don't double-subscribe)
    let courseUnsub = null;
    function clearSubscriptions() {
      if (courseUnsub) { courseUnsub(); courseUnsub = null; }
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🧩 DATA HELPERS
    // ═══════════════════════════════════════════════════════════════════
    async function getTenant(slug) {
      const snap = await getDoc(doc(db, 'tenants', slug));
      return snap.exists() ? { id: snap.id, ...snap.data() } : null;
    }

    async function getRoleInTenant(slug, uid) {
      if (!uid) return null;
      try {
        const t = await getDoc(doc(db, 'tenants', slug, 'users', uid));
        if (t.exists()) return { role: 'teacher', data: t.data() };

        const s = await getDoc(doc(db, 'tenants', slug, 'students', uid));
        if (s.exists()) return { role: 'student', data: s.data() };
      } catch (err) {
        console.error('Role lookup failed:', err);
      }
      return null;
    }

    async function createCourse(slug, { title, code, gradient }) {
      const coursesRef = collection(db, 'tenants', slug, 'courses');
      const docRef = await addDoc(coursesRef, {
        title,
        code: code || title,
        gradient: gradient || pickGradient(title),
        ownerUid: currentUser.uid,
        published: true,
        createdAt: serverTimestamp()
      });
      return docRef.id;
    }

    async function deleteCourse(slug, courseId) {
      await deleteDoc(doc(db, 'tenants', slug, 'courses', courseId));
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ VIEWS
    // ═══════════════════════════════════════════════════════════════════
    function viewLoading() {
      render(`
        <div class="min-h-screen flex items-center justify-center text-gray-500">
          <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
        </div>
      `);
    }

    function viewLanding() {
      render(`
        <div class="min-h-screen flex items-center justify-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
          <div class="text-center z-10 px-6">
            <h1 class="font-serif text-6xl mb-4">
              <span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span>
            </h1>
            <p class="text-gray-500 text-lg mb-10">The modern standard for learning.</p>
            <a href="${buildUrl('/onboard')}"
               class="inline-block px-6 py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:brightness-110 transition-all">
              Create a School
            </a>
          </div>
        </div>
      `);
    }

    // ── Onboard ─────────────────────────────────────────────────────
    function viewOnboard() {
      if (!currentUser) {
        render(`
          <div class="min-h-screen flex items-center justify-center px-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
            <div class="max-w-md w-full text-center z-10">
              <h1 class="font-serif text-4xl text-white mb-3">Create your school</h1>
              <p class="text-gray-500 mb-8">Sign in with Google to get started.</p>
              <button id="google-signin-btn"
                class="w-full flex items-center justify-center gap-3 bg-white text-gray-900 font-medium py-3 px-4 rounded-lg hover:bg-gray-100 transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
              </button>
              <p class="text-xs text-gray-600 mt-6">
                <a href="${buildUrl('/')}" class="hover:text-gray-400">← Back</a>
              </p>
            </div>
          </div>
        `);
        document.getElementById('google-signin-btn').addEventListener('click', handleGoogleSignIn);
        return;
      }

      render(`
        <div class="min-h-screen flex items-center justify-center px-6 relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
          <div class="max-w-md w-full z-10">
            <h1 class="font-serif text-4xl text-white mb-3">Create your school</h1>
            <p class="text-gray-500 mb-8">Give your school a name and a URL.</p>

            <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">School Name</label>
            <input id="school-name" type="text" placeholder="Example High School" autocomplete="off"
              class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />

            <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">School URL</label>
            <div class="flex items-center bg-white/[0.03] border border-white/10 rounded-lg mb-4 focus-within:border-[#8B5CF6] transition-all">
              <span class="text-gray-500 text-sm pl-4 select-none">/${escapeHtml(BASE_PATH.replace(/^\//, ''))}/</span>
              <input id="school-slug" type="text" placeholder="example" autocomplete="off"
                class="flex-1 bg-transparent px-2 py-3 text-white focus:outline-none" />
            </div>

            <p id="onboard-error" class="text-red-400 text-sm mb-4 hidden"></p>

            <button id="onboard-submit"
              class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:brightness-110 transition-all disabled:opacity-60 disabled:cursor-not-allowed">
              Create School
            </button>

            <p class="text-xs text-gray-600 mt-6 text-center">
              Signed in as ${escapeHtml(currentUser.email || '')} ·
              <button id="signout-btn" class="hover:text-gray-400">Sign out</button>
            </p>
          </div>
        </div>
      `);

      const nameInput = document.getElementById('school-name');
      const slugInput = document.getElementById('school-slug');
      nameInput.addEventListener('input', () => {
        if (!slugInput.dataset.touched) slugInput.value = slugify(nameInput.value);
      });
      slugInput.addEventListener('input', () => { slugInput.dataset.touched = '1'; });

      document.getElementById('onboard-submit').addEventListener('click', createSchool);
      document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));
    }

    async function createSchool() {
      const name = document.getElementById('school-name').value.trim();
      const slug = document.getElementById('school-slug').value.trim().toLowerCase();
      const errorEl = document.getElementById('onboard-error');
      const btn = document.getElementById('onboard-submit');

      const showError = (msg) => { errorEl.textContent = msg; errorEl.classList.remove('hidden'); };
      errorEl.classList.add('hidden');

      if (!name) return showError('Please enter a school name.');
      if (!/^[a-z0-9-]{3,30}$/.test(slug)) return showError('URL must be 3–30 characters: lowercase letters, numbers, hyphens.');
      if (RESERVED.includes(slug)) return showError('That URL is reserved. Try another.');

      btn.disabled = true;
      btn.textContent = 'Creating…';

      try {
        const existing = await getDoc(doc(db, 'tenants', slug));
        if (existing.exists()) {
          btn.disabled = false;
          btn.textContent = 'Create School';
          return showError('That URL is already taken. Try another.');
        }

        await setDoc(doc(db, 'tenants', slug), {
          name, slug,
          ownerUid: currentUser.uid,
          createdAt: serverTimestamp()
        });

        await setDoc(doc(db, 'tenants', slug, 'users', currentUser.uid), {
          role: 'teacher',
          email: currentUser.email,
          displayName: currentUser.displayName,
          photoURL: currentUser.photoURL,
          createdAt: serverTimestamp()
        });

        navigate('/' + slug);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Create School';
        showError('Something went wrong: ' + err.message);
      }
    }

    // ── Tenant ──────────────────────────────────────────────────────
    async function viewTenant(slug, subSegments) {
      viewLoading();

      const tenant = await getTenant(slug);
      if (!tenant) return viewTenantNotFound(slug);

      if (!currentUser) return viewTenantLogin(slug, tenant);

      const roleInfo = await getRoleInTenant(slug, currentUser.uid);
      if (!roleInfo) return viewNoAccess(slug, tenant);

      const sub = subSegments[0] || 'dashboard';

      if (sub === 'course' && subSegments[1]) {
        return viewCourseDetail(slug, tenant, roleInfo, subSegments[1]);
      }

      if (sub === 'dashboard' || subSegments.length === 0) {
        return viewDashboard(slug, tenant, roleInfo);
      }

      return viewNotFound();
    }

    function viewTenantNotFound(slug) {
      render(`
        <div class="min-h-screen flex items-center justify-center text-center px-6">
          <div>
            <h1 class="font-serif text-3xl text-white mb-2">School not found</h1>
            <p class="text-gray-500">No school exists at <span class="text-[#F59E0B]">/${escapeHtml(slug)}</span></p>
            <a href="${buildUrl('/')}" class="inline-block mt-6 text-sm text-[#F59E0B] hover:underline">← Back to Ember LMS</a>
          </div>
        </div>
      `);
    }

    function viewNoAccess(slug, tenant) {
      render(`
        <div class="min-h-screen flex items-center justify-center text-center px-6">
          <div class="max-w-md">
            <h1 class="font-serif text-3xl text-white mb-2">${escapeHtml(tenant.name)}</h1>
            <p class="text-gray-500 mb-8">You don't have access to this school yet. Contact your teacher to be enrolled.</p>
            <button id="signout-nx" class="px-5 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">
              Sign out
            </button>
          </div>
        </div>
      `);
      document.getElementById('signout-nx').addEventListener('click', () => signOut(auth));
    }

    function viewTenantLogin(slug, tenant) {
      render(`
        <div class="min-h-screen flex">
          <div class="hidden lg:flex w-1/2 bg-[#050505] relative overflow-hidden border-r border-white/[0.08]">
            <div class="absolute bottom-0 left-0 w-[600px] h-[600px] rounded-full bg-[#F59E0B]/10 blur-[120px] pointer-events-none"></div>
            <div class="relative z-10 flex flex-col justify-end p-16">
              <p class="text-xs text-[#F59E0B] uppercase tracking-widest mb-4">Welcome</p>
              <h1 class="font-serif text-5xl text-white leading-tight mb-4">${escapeHtml(tenant.name)}</h1>
              <p class="text-gray-500 text-base max-w-md">Sign in to access your courses, assignments, and grades.</p>
            </div>
          </div>

          <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12 bg-[#0A0A0A]">
            <div class="max-w-sm w-full">
              <div class="lg:hidden mb-8">
                <h1 class="font-serif text-3xl text-white mb-1">${escapeHtml(tenant.name)}</h1>
                <p class="text-gray-500 text-sm">Sign in to continue</p>
              </div>

              <div class="hidden lg:block mb-8">
                <h2 class="font-serif text-3xl text-white mb-1">Welcome back</h2>
                <p class="text-gray-500 text-sm">Sign in to continue</p>
              </div>

              <button id="tenant-google-btn"
                class="w-full flex items-center justify-center gap-3 bg-white text-gray-900 font-medium py-3 px-4 rounded-lg hover:bg-gray-100 transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue as Teacher
              </button>

              <div class="flex items-center gap-4 my-6">
                <div class="flex-1 h-px bg-white/[0.08]"></div>
                <span class="text-xs text-gray-500 uppercase tracking-wider">or</span>
                <div class="flex-1 h-px bg-white/[0.08]"></div>
              </div>

              <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Username</label>
              <input id="student-username" type="text" autocomplete="username"
                class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />

              <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Password</label>
              <input id="student-password" type="password" autocomplete="current-password"
                class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />

              <p id="login-error" class="text-red-400 text-sm mb-4 hidden"></p>

              <button id="student-login-btn"
                class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:brightness-110 transition-all disabled:opacity-60">
                Sign in as Student
              </button>

              <p class="text-xs text-gray-600 mt-6 text-center">
                <a href="${buildUrl('/')}" class="hover:text-gray-400">← Back to Ember LMS</a>
              </p>
            </div>
          </div>
        </div>
      `);

      document.getElementById('tenant-google-btn').addEventListener('click', handleGoogleSignIn);
      document.getElementById('student-login-btn').addEventListener('click', () => studentLogin(slug));
      document.getElementById('student-password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') studentLogin(slug);
      });
    }

    async function studentLogin(slug) {
      const username = document.getElementById('student-username').value.trim().toLowerCase();
      const password = document.getElementById('student-password').value;
      const errorEl = document.getElementById('login-error');
      const btn = document.getElementById('student-login-btn');

      const showError = (msg) => { errorEl.textContent = msg; errorEl.classList.remove('hidden'); };
      errorEl.classList.add('hidden');

      if (!username || !password) return showError('Enter both username and password.');
      if (!/^[a-z0-9_]{3,20}$/.test(username)) return showError('Invalid username format.');

      const email = `${username}@${slug}.emberlms.local`;

      btn.disabled = true;
      btn.textContent = 'Signing in…';

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Sign in as Student';
        if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(err.code)) {
          showError('Invalid username or password.');
        } else {
          showError('Sign-in failed. Try again.');
        }
      }
    }

    // ── Dashboard ───────────────────────────────────────────────────
    function viewDashboard(slug, tenant, roleInfo) {
      const isTeacher = roleInfo.role === 'teacher';

      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'dashboard')}

          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>

            <header class="p-8 pb-4 flex justify-between items-center z-10 relative">
              <div>
                <h2 class="font-serif text-3xl text-white mb-1">Dashboard</h2>
                <p class="text-xs text-gray-500 tracking-wider uppercase font-medium">${escapeHtml(tenant.name)}</p>
              </div>
              ${isTeacher ? `
                <button id="add-course-btn"
                  class="px-5 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:brightness-110 transition-all flex items-center gap-2">
                  <i data-lucide="plus" class="w-4 h-4"></i> New Course
                </button>
              ` : ''}
            </header>

            <div id="course-grid-container" class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-20 text-gray-500">
                  <i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i>
                </div>
              </div>
            </div>
          </main>
        </div>
      `);

      if (isTeacher) {
        document.getElementById('add-course-btn').addEventListener('click', () => openCourseModal(slug));
      }

      subscribeToCourses(slug, isTeacher);
    }

    function subscribeToCourses(slug, isTeacher) {
      clearSubscriptions();

      const coursesRef = collection(db, 'tenants', slug, 'courses');
      const q = query(coursesRef, orderBy('createdAt', 'desc'));

      courseUnsub = onSnapshot(q, (snapshot) => {
        const grid = document.getElementById('course-grid');
        if (!grid) return;

        if (snapshot.empty) {
          grid.innerHTML = `
            <div class="col-span-full text-center py-20 border border-dashed border-white/10 rounded-xl">
              <i data-lucide="book-open" class="w-10 h-10 mx-auto mb-4 text-gray-600"></i>
              <p class="text-lg text-white font-serif mb-1">No courses yet</p>
              <p class="text-sm text-gray-500">${isTeacher ? 'Click "New Course" to create your first one.' : 'You are not enrolled in any courses yet.'}</p>
            </div>`;
          refreshIcons();
          return;
        }

        grid.innerHTML = snapshot.docs.map((d) => renderCourseCard(slug, d.id, d.data(), isTeacher)).join('');
        refreshIcons();

        // Wire up per-card actions
        grid.querySelectorAll('[data-action="delete"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            e.preventDefault();
            const courseId = btn.dataset.id;
            const title = btn.dataset.title;
            if (confirm(`Delete "${title}"? This cannot be undone.`)) {
              deleteCourse(slug, courseId).catch(err => alert('Failed to delete: ' + err.message));
            }
          });
        });

        // Card click navigation
        grid.querySelectorAll('[data-course-link]').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('[data-action]')) return;
            navigate(`/${slug}/course/${card.dataset.courseLink}`);
          });
        });
      }, (err) => {
        console.error('Course subscription error:', err);
        const grid = document.getElementById('course-grid');
        if (grid) grid.innerHTML = `<div class="col-span-full text-red-400 text-sm p-6">Failed to load courses: ${escapeHtml(err.message)}</div>`;
      });
    }

    function renderCourseCard(slug, id, course, isTeacher) {
      const grad = course.gradient || pickGradient(course.title);
      const code = course.code || course.title || '';
      const created = formatDate(course.createdAt);

      return `
        <div data-course-link="${id}"
          class="bg-[#141414] border border-white/[0.08] rounded-xl overflow-hidden cursor-pointer hover:-translate-y-1 hover:border-white/20 transition-all group flex flex-col">
          <div class="${grad} h-24 relative">
            ${isTeacher ? `
              <button data-action="delete" data-id="${id}" data-title="${escapeHtml(course.title || '')}"
                class="absolute top-2 right-2 p-1.5 bg-black/30 hover:bg-red-500/80 rounded text-white/80 hover:text-white opacity-0 group-hover:opacity-100 transition-all">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            ` : ''}
          </div>
          <div class="p-5 flex-1 flex flex-col">
            <p class="text-xs text-gray-500 mb-1 truncate">${escapeHtml(code)}</p>
            <h4 class="font-serif text-lg text-white mb-1 truncate">${escapeHtml(course.title || 'Untitled')}</h4>
            <p class="text-xs text-gray-500 truncate mb-4">Created ${escapeHtml(created)}</p>
            <div class="mt-auto flex gap-4 text-gray-500">
              <i data-lucide="megaphone" class="w-4 h-4 hover:text-[#F59E0B] transition-colors"></i>
              <i data-lucide="file-text" class="w-4 h-4 hover:text-[#F59E0B] transition-colors"></i>
              <i data-lucide="message-square" class="w-4 h-4 hover:text-[#F59E0B] transition-colors"></i>
              <i data-lucide="folder" class="w-4 h-4 hover:text-[#F59E0B] transition-colors"></i>
            </div>
          </div>
        </div>
      `;
    }

    // ── Course Modal ────────────────────────────────────────────────
    function openCourseModal(slug) {
      const overlay = document.createElement('div');
      overlay.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      overlay.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
          <h3 class="font-serif text-2xl text-white mb-1">New Course</h3>
          <p class="text-gray-500 text-sm mb-6">Create a course for your students.</p>

          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Course Name</label>
          <input id="course-title" type="text" placeholder="English 1" autocomplete="off"
            class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />

          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Course Code <span class="text-gray-600 normal-case tracking-normal">(optional)</span></label>
          <input id="course-code" type="text" placeholder="01 - English 1 - Santiago" autocomplete="off"
            class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />

          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Color</label>
          <div id="gradient-picker" class="grid grid-cols-6 gap-2 mb-6">
            ${GRADIENTS.map((g, i) => `
              <button type="button" data-grad="${g}"
                class="${g} h-9 rounded-lg border-2 ${i === 0 ? 'border-white' : 'border-transparent'} hover:border-white/50 transition-all"></button>
            `).join('')}
          </div>

          <p id="course-error" class="text-red-400 text-sm mb-4 hidden"></p>

          <div class="flex gap-3">
            <button id="course-cancel"
              class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">
              Cancel
            </button>
            <button id="course-create"
              class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60">
              Create
            </button>
          </div>
        </div>
      `;

      document.body.appendChild(overlay);

      let selectedGradient = GRADIENTS[0];
      overlay.querySelectorAll('[data-grad]').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedGradient = btn.dataset.grad;
          overlay.querySelectorAll('[data-grad]').forEach(b => b.classList.replace('border-white', 'border-transparent'));
          btn.classList.replace('border-transparent', 'border-white');
        });
      });

      const close = () => overlay.remove();

      overlay.querySelector('#course-cancel').addEventListener('click', close);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
      overlay.querySelector('#course-title').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') overlay.querySelector('#course-create').click();
      });

      overlay.querySelector('#course-create').addEventListener('click', async () => {
        const title = overlay.querySelector('#course-title').value.trim();
        const code = overlay.querySelector('#course-code').value.trim();
        const errorEl = overlay.querySelector('#course-error');
        const btn = overlay.querySelector('#course-create');

        errorEl.classList.add('hidden');
        if (!title) {
          errorEl.textContent = 'Please enter a course name.';
          errorEl.classList.remove('hidden');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating…';

        try {
          await createCourse(slug, { title, code, gradient: selectedGradient });
          close();
        } catch (err) {
          console.error(err);
          btn.disabled = false;
          btn.textContent = 'Create';
          errorEl.textContent = 'Failed: ' + err.message;
          errorEl.classList.remove('hidden');
        }
      });

      setTimeout(() => overlay.querySelector('#course-title').focus(), 50);
    }

    // ── Course Detail ───────────────────────────────────────────────
    async function viewCourseDetail(slug, tenant, roleInfo, courseId) {
      viewLoading();

      const courseSnap = await getDoc(doc(db, 'tenants', slug, 'courses', courseId));
      if (!courseSnap.exists()) return viewNotFound();

      const course = { id: courseSnap.id, ...courseSnap.data() };
      const grad = course.gradient || pickGradient(course.title);

      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'course')}

          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>

            <header class="p-8 pb-4 z-10 relative">
              <a href="${buildUrl('/' + slug)}" class="text-xs text-gray-500 hover:text-[#F59E0B] transition-colors inline-flex items-center gap-1 mb-3">
                <i data-lucide="arrow-left" class="w-3 h-3"></i> Back to Dashboard
              </a>
              <div class="flex items-center gap-4">
                <div class="${grad} w-12 h-12 rounded-xl shrink-0"></div>
                <div>
                  <p class="text-xs text-gray-500 mb-0.5">${escapeHtml(course.code || '')}</p>
                  <h2 class="font-serif text-3xl text-white">${escapeHtml(course.title || 'Untitled')}</h2>
                </div>
              </div>
            </header>

            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div class="max-w-3xl border border-dashed border-white/10 rounded-xl p-10 text-center">
                <i data-lucide="layers" class="w-10 h-10 text-[#F59E0B] mx-auto mb-4"></i>
                <h3 class="font-serif text-xl text-white mb-2">Course home</h3>
                <p class="text-gray-500 text-sm">Modules, pages, assignments, and quizzes arrive in Phase 4.</p>
              </div>
            </div>
          </main>
        </div>
      `);
    }

    // ── Shared Sidebar ──────────────────────────────────────────────
    function renderSidebar(slug, tenant, roleInfo, active) {
      const isTeacher = roleInfo.role === 'teacher';
      const name = currentUser.displayName || roleInfo.data.displayName || currentUser.email || 'User';

      const item = (href, icon, label, key, soon = false) => {
        const isActive = active === key;
        if (soon) {
          return `
            <span class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600">
              <i data-lucide="${icon}" class="w-4 h-4"></i> ${label}
              <span class="ml-auto text-[10px]">Soon</span>
            </span>`;
        }
        return `
          <a href="${buildUrl(href)}"
            class="flex items-center gap-3 px-3 py-2 text-sm ${isActive ? 'text-white bg-white/[0.05] border-l-2 border-[#F59E0B] rounded-r' : 'text-gray-400 hover:text-white hover:bg-white/[0.03] border-l-2 border-transparent rounded-r'} transition-all">
            <i data-lucide="${icon}" class="w-4 h-4 ${isActive ? 'text-[#F59E0B]' : ''}"></i> ${label}
          </a>`;
      };

      return `
        <aside class="w-64 bg-[#050505] border-r border-white/[0.08] p-6 flex flex-col h-screen shrink-0">
          <h1 class="font-serif text-xl mb-8">
            <span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span>
          </h1>

          <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-2">School</div>
          <p class="text-white text-sm mb-8 truncate">${escapeHtml(tenant.name)}</p>

          <nav class="space-y-1">
            ${item('/' + slug, 'layout-dashboard', 'Dashboard', 'dashboard')}
            ${item('/' + slug + '/courses', 'book-open', 'Courses', 'courses', true)}
            ${isTeacher ? item('/' + slug + '/students', 'users', 'Students', 'students', true) : ''}
          </nav>

          <div class="mt-auto pt-6 border-t border-white/[0.08]">
            <div class="flex items-center gap-3 mb-3">
              ${currentUser.photoURL
                ? `<img src="${currentUser.photoURL}" class="w-8 h-8 rounded-full border border-white/20" alt="">`
                : `<div class="w-8 h-8 rounded-full bg-white/10"></div>`}
              <div class="flex-1 min-w-0">
                <p class="text-sm text-white truncate">${escapeHtml(name)}</p>
                <p class="text-xs text-gray-500 truncate">${isTeacher ? 'Teacher' : 'Student'}</p>
              </div>
            </div>
            <button data-signout class="w-full text-left text-xs text-gray-400 hover:text-red-400 transition-colors flex items-center gap-2">
              <i data-lucide="log-out" class="w-3 h-3"></i> Sign Out
            </button>
          </div>
        </aside>
      `;
    }

    // Global signout listener (attached after render)
    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-signout]')) {
        signOut(auth);
      }
    });

    function viewNotFound() {
      render(`
        <div class="min-h-screen flex items-center justify-center text-center px-6">
          <div>
            <h1 class="font-serif text-3xl text-white mb-2">404</h1>
            <p class="text-gray-500">Page not found.</p>
            <a href="${buildUrl('/')}" class="inline-block mt-6 text-sm text-[#F59E0B] hover:underline">← Back to Ember LMS</a>
          </div>
        </div>
      `);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🔑 AUTH ACTIONS
    // ═══════════════════════════════════════════════════════════════════
    async function handleGoogleSignIn() {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error('Google sign-in error:', err);
        if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
        alert('Sign-in failed: ' + err.message);
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🚀 RENDER LOOP
    // ═══════════════════════════════════════════════════════════════════
    async function renderRoute() {
      if (!authReady) return;

      // Clean up any active listeners from the previous view
      clearSubscriptions();

      const route = parseRoute();

      try {
        switch (route.type) {
          case 'landing': viewLanding(); break;
          case 'onboard': viewOnboard(); break;
          case 'tenant':  await viewTenant(route.tenant, route.segments); break;
          default:        viewNotFound();
        }
      } catch (err) {
        console.error('Route render failed:', err);
        render(`<div class="min-h-screen flex items-center justify-center text-red-400 p-6 text-center">Error:<br>${escapeHtml(err.message)}</div>`);
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🏁 BOOT
    // ═══════════════════════════════════════════════════════════════════
    viewLoading();

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      authReady = true;
      renderRoute();
    });
  </script>
</body>
</html>
