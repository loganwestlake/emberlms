<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember LMS</title>
  <meta name="description" content="The modern standard for learning.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind (Play CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            ember: {
              bg: '#0A0A0A',
              surface: '#141414',
              amber: '#F59E0B',
              violet: '#8B5CF6',
            }
          }
        }
      }
    }
  </script>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- HTML Sanitization (used in later phases) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#0A0A0A] text-[#EDEDED] font-sans antialiased">
  <div id="app"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
