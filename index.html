<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember LMS</title>
  <meta name="description" content="The modern standard for learning.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            ember: {
              bg: '#0A0A0A',
              surface: '#141414',
              amber: '#F59E0B',
              violet: '#8B5CF6',
            }
          }
        }
      }
    }
  </script>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- HTML Sanitization (used in later phases) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

  <style>
    /* Dark scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* Smooth transitions */
    .transition-all {
      transition-property: all;
      transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      transition-duration: 200ms;
    }

    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#0A0A0A] text-[#EDEDED] font-sans antialiased">
  <div id="app"></div>

  <script type="module">
    // ═══════════════════════════════════════════════════════════════════
    // ⚙️  APP CONFIGURATION
    // ═══════════════════════════════════════════════════════════════════
    //
    // BASE_PATH tells the router where the app lives.
    //
    //   Deploying to github.io/repo/emberlms/  →  '/repo/emberlms'
    //   Deploying to github.io/emberlms/       →  '/emberlms'
    //   Deploying to a custom domain (root)    →  ''
    //
    // If you're testing locally with Live Server or `npx serve`, use ''.
    //
    const BASE_PATH = '/emberlms';

    // ═══════════════════════════════════════════════════════════════════
    // 🔥 FIREBASE
    // ═══════════════════════════════════════════════════════════════════
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHMgZklzO2Uu7v8Lm248DuU4QJ2RaCp44",
      authDomain: "ember-lms.firebaseapp.com",
      projectId: "ember-lms",
      storageBucket: "ember-lms.firebasestorage.app",
      messagingSenderId: "198763545245",
      appId: "1:198763545245:web:58b4d76df1181600fd0a74"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Secondary app — ONLY used for creating/resetting student accounts.
    // Prevents Firebase from logging the teacher out when a student is created.
    const secondaryApp = initializeApp(firebaseConfig, "Secondary");
    const secondaryAuth = getAuth(secondaryApp);

    // ═══════════════════════════════════════════════════════════════════
    // 🧭 ROUTER
    // ═══════════════════════════════════════════════════════════════════
    const RESERVED = ['onboard', 'login', 'signup', 'api'];

    /**
     * Strips the BASE_PATH from the current URL and returns the remaining
     * path segments. Handles trailing slashes and encoded characters.
     */
    function getAppSegments() {
      let pathname = decodeURIComponent(window.location.pathname);

      // Remove the base path prefix if it exists
      if (BASE_PATH && pathname.startsWith(BASE_PATH)) {
        pathname = pathname.slice(BASE_PATH.length);
      }

      return pathname.split('/').filter(Boolean);
    }

    /**
     * Builds a full app URL given a relative path.
     * e.g. buildUrl('/example') → '/repo/emberlms/example'
     */
    function buildUrl(relative = '/') {
      const clean = relative.startsWith('/') ? relative : '/' + relative;
      return (BASE_PATH + clean).replace(/\/+/g, '/').replace(/\/$/, '') || '/';
    }

    /**
     * Parses the current URL and returns a route object.
     */
    function parseRoute() {
      // 1. If 404.html sent us here, restore the original URL path
      const savedPath = sessionStorage.getItem('ember_redirect_path');
      if (savedPath) {
        sessionStorage.removeItem('ember_redirect_path');
        window.history.replaceState(null, '', savedPath);
      }

      // 2. Extract app segments (base path stripped)
      const segments = getAppSegments();

      // 3. Route based on first segment
      if (segments.length === 0) {
        return { type: 'landing', tenant: null, segments: [] };
      }

      const first = segments[0];

      if (RESERVED.includes(first)) {
        return { type: first, tenant: null, segments: segments.slice(1) };
      }

      return { type: 'tenant', tenant: first, segments: segments.slice(1) };
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🎨 UI HELPERS
    // ═══════════════════════════════════════════════════════════════════
    const appEl = document.getElementById('app');

    function refreshIcons() {
      if (window.lucide) window.lucide.createIcons();
    }

    function render(html) {
      appEl.innerHTML = html;
      refreshIcons();
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ VIEWS
    // ═══════════════════════════════════════════════════════════════════
    function viewLanding() {
      render(`
        <div class="min-h-screen flex items-center justify-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
          <div class="text-center z-10 px-6">
            <h1 class="font-serif text-6xl mb-4">
              <span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span>
            </h1>
            <p class="text-gray-500 text-lg mb-10">The modern standard for learning.</p>
            <button class="px-6 py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:brightness-110 transition-all">
              Create a School
            </button>
          </div>
        </div>
      `);
    }

    async function viewTenant(slug) {
      render(`<div class="min-h-screen flex items-center justify-center text-gray-500">Checking tenant…</div>`);

      try {
        const snap = await getDoc(doc(db, 'tenants', slug));

        if (!snap.exists()) {
          render(`
            <div class="min-h-screen flex items-center justify-center text-center px-6">
              <div>
                <h1 class="font-serif text-3xl text-white mb-2">School not found</h1>
                <p class="text-gray-500">No school exists at <span class="text-[#F59E0B]">/${slug}</span></p>
                <a href="${buildUrl('/')}" class="inline-block mt-6 text-sm text-[#F59E0B] hover:underline">← Back to Ember LMS</a>
              </div>
            </div>
          `);
          return;
        }

        const tenant = snap.data();

        render(`
          <div class="min-h-screen flex items-center justify-center text-center px-6">
            <div>
              <p class="text-xs text-gray-500 tracking-wider uppercase mb-2">You are visiting</p>
              <h1 class="font-serif text-4xl text-white mb-2">${tenant.name || slug}</h1>
              <p class="text-gray-500 text-sm">Tenant slug: <span class="text-[#F59E0B]">/${slug}</span></p>
              <p class="text-gray-600 text-sm mt-8">🔐 Login UI arrives in Phase 2</p>
            </div>
          </div>
        `);
      } catch (err) {
        console.error(err);
        render(`<div class="min-h-screen flex items-center justify-center text-red-400 p-6 text-center">Error loading tenant:<br>${err.message}</div>`);
      }
    }

    function viewNotFound() {
      render(`
        <div class="min-h-screen flex items-center justify-center text-center px-6">
          <div>
            <h1 class="font-serif text-3xl text-white mb-2">404</h1>
            <p class="text-gray-500">Page not found.</p>
            <a href="${buildUrl('/')}" class="inline-block mt-6 text-sm text-[#F59E0B] hover:underline">← Back to Ember LMS</a>
          </div>
        </div>
      `);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🚀 MAIN
    // ═══════════════════════════════════════════════════════════════════
    async function main() {
      const route = parseRoute();

      switch (route.type) {
        case 'landing':
          viewLanding();
          break;
        case 'tenant':
          await viewTenant(route.tenant);
          break;
        default:
          viewNotFound();
      }
    }

    main();
  </script>
</body>
</html>
