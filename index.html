<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ember LMS</title>
  <meta name="description" content="The modern standard for learning.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter','sans-serif'], serif: ['Playfair Display','serif'] },
          colors: { ember: { bg:'#0A0A0A', surface:'#141414', amber:'#F59E0B', violet:'#8B5CF6' } }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4,0,0.2,1); transition-duration: 200ms; }
    .input-glow:focus { outline: none; border-color: #8B5CF6; box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
    body { -webkit-tap-highlight-color: transparent; }
    .grad-amber  { background: linear-gradient(135deg, #F59E0B, #EA580C); }
    .grad-violet { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
    .grad-teal   { background: linear-gradient(135deg, #14B8A6, #0891B2); }
    .grad-rose   { background: linear-gradient(135deg, #F43F5E, #DB2777); }
    .grad-blue   { background: linear-gradient(135deg, #3B82F6, #4F46E5); }
    .grad-emerald{ background: linear-gradient(135deg, #10B981, #059669); }
    .modal-overlay { backdrop-filter: blur(6px); }

    .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; padding: 8px 0 !important; }
    .ql-container.ql-snow { border: none !important; font-family: Inter, sans-serif !important; font-size: 14px !important; }
    .ql-editor { color: #EDEDED !important; min-height: 200px; padding: 16px 0 !important; line-height: 1.7; }
    .ql-editor.ql-blank::before { color: #555 !important; font-style: normal !important; }
    .ql-snow .ql-stroke { stroke: #888 !important; }
    .ql-snow .ql-fill { fill: #888 !important; }
    .ql-snow .ql-picker { color: #888 !important; }
    .ql-snow .ql-picker-options { background: #141414 !important; border-color: rgba(255,255,255,0.08) !important; }
    .ql-snow .ql-picker-item { color: #888 !important; }
    .ql-snow .ql-active .ql-stroke, .ql-snow .ql-active .ql-fill { stroke: #F59E0B !important; fill: #F59E0B !important; }
    .ql-snow .ql-active .ql-picker-label { color: #F59E0B !important; }
    .ql-snow .ql-tooltip { background: #141414 !important; border-color: rgba(255,255,255,0.08) !important; color: #EDEDED !important; }
    .ql-snow .ql-tooltip input[type=text] { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; color: #EDEDED !important; }
    .ql-snow .ql-tooltip a { color: #F59E0B !important; }

    .prose-ember h1 { font-family: 'Playfair Display', serif; font-size: 1.75rem; color: #fff; margin: 1rem 0 0.5rem; }
    .prose-ember h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #fff; margin: 1rem 0 0.5rem; }
    .prose-ember h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: #fff; margin: 0.75rem 0 0.4rem; }
    .prose-ember p { margin: 0.5rem 0; line-height: 1.75; color: #D4D4D4; }
    .prose-ember a { color: #F59E0B; text-decoration: underline; }
    .prose-ember ul, .prose-ember ol { margin: 0.5rem 0; padding-left: 1.5rem; color: #D4D4D4; }
    .prose-ember li { margin: 0.25rem 0; }
    .prose-ember blockquote { border-left: 3px solid #F59E0B; padding-left: 1rem; margin: 0.75rem 0; color: #A3A3A3; font-style: italic; }
    .prose-ember code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; color: #F59E0B; }
    .prose-ember img { max-width: 100%; border-radius: 8px; margin: 1rem 0; }
  </style>
</head>
<body class="bg-[#0A0A0A] text-[#EDEDED] font-sans antialiased">
  <div id="app"></div>

  <script type="module">
    // ═══════════════════════════════════════════════════════════════════
    const BASE_PATH = '/emberlms';
    const RESERVED = ['login','signup','picker','onboard','api','assets','district'];
    const GRADIENTS = ['grad-amber','grad-violet','grad-teal','grad-rose','grad-blue','grad-emerald'];
    const ITEM_TYPES = [
      { type:'page',       label:'Page',       icon:'file-text',      desc:'Rich text content' },
      { type:'assignment', label:'Assignment', icon:'clipboard-list', desc:'Collect student work' },
      { type:'link',       label:'Link',       icon:'link',           desc:'External resource' },
      { type:'quiz',       label:'Quiz',       icon:'check-square',   desc:'Auto-graded questions' },
    ];

    // ═══════════════════════════════════════════════════════════════════
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signOut, onAuthStateChanged, sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
      collection, collectionGroup, query, where, orderBy, limit,
      onSnapshot, getDocs, serverTimestamp, arrayUnion, arrayRemove
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHMgZklzO2Uu7v8Lm248DuU4QJ2RaCp44",
      authDomain: "ember-lms.firebaseapp.com",
      projectId: "ember-lms",
      storageBucket: "ember-lms.firebasestorage.app",
      messagingSenderId: "198763545245",
      appId: "1:198763545245:web:58b4d76df1181600fd0a74"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const secondaryApp = initializeApp(firebaseConfig, "Secondary");
    const secondaryAuth = getAuth(secondaryApp);

    // ═══════════════════════════════════════════════════════════════════
    function getAppSegments() {
      let p = decodeURIComponent(window.location.pathname);
      if (BASE_PATH && p.startsWith(BASE_PATH)) p = p.slice(BASE_PATH.length);
      return p.split('/').filter(Boolean);
    }
    function buildUrl(rel = '/') {
      const c = rel.startsWith('/') ? rel : '/' + rel;
      const j = (BASE_PATH + c).replace(/\/+/g, '/').replace(/\/$/, '');
      return j || '/';
    }
    function navigate(path) { window.location.href = buildUrl(path); }
    function parseRoute() {
      const sp = sessionStorage.getItem('ember_redirect_path');
      if (sp) { sessionStorage.removeItem('ember_redirect_path'); try { window.history.replaceState(null, '', sp); } catch(e){} }
      const segs = getAppSegments();
      if (segs.length === 0) return { type:'landing', tenant:null, segments:[] };
      const first = segs[0];
      if (RESERVED.includes(first)) return { type: first, tenant:null, segments: segs.slice(1) };
      return { type: 'tenant', tenant: first, segments: segs.slice(1) };
    }

    // ═══════════════════════════════════════════════════════════════════
    const appEl = document.getElementById('app');
    function refreshIcons() { if (window.lucide) window.lucide.createIcons(); }
    function render(html) { appEl.innerHTML = html; refreshIcons(); }
    function slugify(s) { return String(s||'').toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''); }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function pickGradient(seed) {
      const s = String(seed||''); let h = 0;
      for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))|0;
      return GRADIENTS[Math.abs(h) % GRADIENTS.length];
    }
    function formatDate(ts) { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
    function formatDateTime(ts) { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
    function toDateInput(ts) { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); if (isNaN(d)) return ''; const pad = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    function sanitize(html) { return window.DOMPurify ? DOMPurify.sanitize(html || '') : (html || ''); }
    function genPassword() { const w = ['ember','flame','glow','spark','warm','light','sun','dusk','ash','coal','pine','river']; return w[Math.floor(Math.random()*w.length)] + Math.floor(Math.random()*9000 + 1000); }
    function genCode() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let o = ''; for (let i=0;i<6;i++) o += c[Math.floor(Math.random()*c.length)]; return o; }
    function genUsername(first, last, existing = []) {
      const base = (slugify(first + (last ? last[0] : '')) || 'student').replace(/-/g,'_').slice(0,18);
      let c = base, i = 1;
      while (existing.includes(c)) { c = base + i; i++; }
      return c;
    }
    function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

    // ═══════════════════════════════════════════════════════════════════
    let currentUser = null;
    let authReady = false;
    let unsubs = [];
    let viewAsStudent = sessionStorage.getItem('ember_view_as_student') === '1';
    let signupWizard = null;
    let suppressAuthRouting = false;
    function clearSubs() { unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; }
    function setViewAsStudent(val) {
      viewAsStudent = val;
      sessionStorage.setItem('ember_view_as_student', val ? '1' : '0');
      renderRoute();
    }

    // ═══════════════════════════════════════════════════════════════════
    async function getTenant(slug) { const s = await getDoc(doc(db, 'tenants', slug)); return s.exists() ? { id: s.id, ...s.data() } : null; }
    async function getRoleInTenant(slug, uid) {
      if (!uid) return null;
      try {
        const t = await getDoc(doc(db, 'tenants', slug, 'users', uid));
        if (t.exists()) return { role: t.data().role === 'admin' ? 'admin' : 'teacher', data: t.data() };
        const s = await getDoc(doc(db, 'tenants', slug, 'students', uid));
        if (s.exists()) return { role: 'student', data: s.data() };
      } catch(e) { console.error(e); }
      return null;
    }
    async function searchSchools(q) {
      const schools = [];
      const snap = await getDocs(query(collection(db, 'tenants'), where('type', '==', 'school')));
      const ql = q.toLowerCase();
      snap.forEach(d => {
        const s = d.data();
        if (!ql || s.name.toLowerCase().includes(ql) || d.id.includes(ql)) {
          schools.push({ slug: d.id, name: s.name, districtId: s.districtId || null });
        }
      });
      return schools.slice(0, 20);
    }
    async function maybeMigrateTenant(tenantSnap, userDocId, userDocData) {
      const data = tenantSnap.data();
      const updates = {};
      if (!data.type) updates.type = 'school';
      if (!data.joinCode) updates.joinCode = genCode();
      if (Object.keys(updates).length) { try { await updateDoc(tenantSnap.ref, updates); } catch(e) {} }
      if (data.ownerUid === userDocId && userDocData.role !== 'admin') {
        try { await updateDoc(doc(db, 'tenants', tenantSnap.id, 'users', userDocId), { role: 'admin' }); } catch(e) {}
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    async function resolveDestinationForUser(user) {
      if (!user) return '/signup';

      // 1. District admin? (uid-based)
      try {
        const dSnap = await getDocs(query(collection(db, 'districts'), where('adminUids', 'array-contains', user.uid), limit(1)));
        if (!dSnap.empty) return `/district/${dSnap.docs[0].id}`;
      } catch(e) { console.warn('district lookup failed', e); }

      // 2. Teacher/admin in any tenant? (uid-based via collection group)
      try {
        const tSnap = await getDocs(query(collectionGroup(db, 'users'), where('userId', '==', user.uid), limit(2)));
        // fallback: try email match if userId field isn't set
        if (!tSnap.empty) {
          const first = tSnap.docs[0];
          const tenantRef = first.ref.parent.parent;
          const tenantSnap = await getDoc(tenantRef);
          if (tenantSnap.exists()) await maybeMigrateTenant(tenantSnap, first.id, first.data());
          return `/${tenantRef.id}`;
        }
        if (user.email) {
          const byEmail = await getDocs(query(collectionGroup(db, 'users'), where('email', '==', user.email), limit(2)));
          if (!byEmail.empty) {
            const first = byEmail.docs[0];
            const tenantRef = first.ref.parent.parent;
            const tenantSnap = await getDoc(tenantRef);
            if (tenantSnap.exists()) await maybeMigrateTenant(tenantSnap, first.id, first.data());
            return `/${tenantRef.id}`;
          }
        }
      } catch(e) { console.warn('teacher lookup failed', e); }

      // 3. Student in any tenant? (email match)
      if (user.email) {
        try {
          const sSnap = await getDocs(query(collectionGroup(db, 'students'), where('email', '==', user.email), limit(1)));
          if (!sSnap.empty) {
            const first = sSnap.docs[0];
            const tenantRef = first.ref.parent.parent;
            const status = first.data().status;
            if (status === 'approved') return `/${tenantRef.id}`;
            if (status === 'pending')  return `/${tenantRef.id}/pending`;
            return `/${tenantRef.id}/rejected`;
          }
        } catch(e) { console.warn('student lookup failed', e); }
      }

      return '/signup';
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ VIEW: LANDING
    // ═══════════════════════════════════════════════════════════════════
    function viewLanding() {
      render(`
        <div class="min-h-screen relative overflow-hidden">
          <nav class="relative z-20 max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
            <div class="font-serif text-xl"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></div>
            <div class="flex items-center gap-3 text-sm">
              <a href="${buildUrl('/login')}" class="px-4 py-2 text-gray-300 hover:text-white transition-all">Sign in</a>
              <a href="${buildUrl('/signup')}" class="px-4 py-2 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg hover:brightness-110 transition-all">Get started</a>
            </div>
          </nav>
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[700px] rounded-full bg-[#F59E0B]/10 blur-[160px] pointer-events-none"></div>
          <div class="absolute top-40 right-0 w-[500px] h-[500px] rounded-full bg-[#8B5CF6]/10 blur-[140px] pointer-events-none"></div>
          <section class="relative z-10 max-w-5xl mx-auto px-6 pt-16 pb-24 text-center">
            <p class="text-xs text-[#F59E0B] uppercase tracking-[0.3em] mb-6">Built for teachers</p>
            <h1 class="font-serif text-6xl md:text-7xl text-white leading-[1.05] mb-6">Teaching,<br><span class="italic text-[#F59E0B]">refined.</span></h1>
            <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto mb-10 leading-relaxed">A modern learning platform for schools, districts, and independent teachers.</p>
            <div class="flex flex-wrap items-center justify-center gap-4">
              <a href="${buildUrl('/signup')}" class="px-6 py-3.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_25px_rgba(245,158,11,0.25)] hover:shadow-[0_0_40px_rgba(245,158,11,0.45)] hover:brightness-110 transition-all">Get started — free</a>
              <a href="${buildUrl('/login')}" class="px-6 py-3.5 bg-white/[0.04] border border-white/10 text-white font-medium rounded-lg hover:bg-white/[0.08] transition-all">Sign in</a>
            </div>
          </section>
          <footer class="relative z-10 border-t border-white/[0.06] py-8">
            <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-gray-600">
              <div class="font-serif"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></div>
              <div>© ${new Date().getFullYear()} Ember LMS</div>
            </div>
          </footer>
        </div>`);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ VIEW: LOGIN (staff: Google + email/password; student: school+username+password)
    // ═══════════════════════════════════════════════════════════════════
    function viewLogin() {
      const params = new URLSearchParams(window.location.search);
      let mode = params.get('as') === 'student' ? 'student' : 'staff';
      let preselected = null;

      const renderLogin = () => {
        render(`
          <div class="min-h-screen flex">
            <div class="hidden lg:flex w-1/2 bg-[#050505] relative overflow-hidden border-r border-white/[0.08]">
              <div class="absolute bottom-0 left-0 w-[600px] h-[600px] rounded-full bg-[#F59E0B]/10 blur-[120px] pointer-events-none"></div>
              <div class="absolute top-0 right-0 w-[400px] h-[400px] rounded-full bg-[#8B5CF6]/10 blur-[120px] pointer-events-none"></div>
              <div class="relative z-10 flex flex-col justify-between p-16 w-full">
                <a href="${buildUrl('/')}" class="font-serif text-2xl"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></a>
                <div>
                  <p class="text-xs text-[#F59E0B] uppercase tracking-widest mb-4">Welcome back</p>
                  <h1 class="font-serif text-5xl text-white leading-tight mb-4">Teaching,<br><span class="italic text-[#F59E0B]">refined.</span></h1>
                  <p class="text-gray-500 text-base max-w-md">Sign in to your school, district, or personal classroom.</p>
                </div>
                <div class="text-xs text-gray-700">© ${new Date().getFullYear()} Ember LMS</div>
              </div>
            </div>
            <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12 bg-[#0A0A0A] overflow-y-auto">
              <div class="max-w-sm w-full py-8">
                <div class="lg:hidden mb-8 text-center">
                  <a href="${buildUrl('/')}" class="font-serif text-2xl"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></a>
                </div>
                <h2 class="font-serif text-3xl text-white mb-1">Sign in</h2>
                <p class="text-gray-500 text-sm mb-6">Choose how you'd like to sign in.</p>

                <div class="grid grid-cols-2 gap-2 p-1 bg-white/[0.03] border border-white/[0.08] rounded-lg mb-6">
                  <button data-mode="staff" class="py-2 text-sm rounded-md transition-all ${mode==='staff' ? 'bg-white/[0.08] text-white font-medium' : 'text-gray-400 hover:text-white'}">Staff</button>
                  <button data-mode="student" class="py-2 text-sm rounded-md transition-all ${mode==='student' ? 'bg-white/[0.08] text-white font-medium' : 'text-gray-400 hover:text-white'}">Student</button>
                </div>

                <div id="login-body"></div>

                <p class="text-xs text-gray-600 mt-8 text-center">
                  Don't have an account? <a href="${buildUrl('/signup')}" class="text-[#F59E0B] hover:underline">Sign up</a>
                </p>
              </div>
            </div>
          </div>`);

        document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
          mode = b.dataset.mode;
          const url = new URL(window.location.href);
          url.searchParams.set('as', mode);
          window.history.replaceState(null, '', url.toString());
          renderLogin();
        }));

        const body = document.getElementById('login-body');

        // ── STAFF (Google + email/password) ──
        if (mode === 'staff') {
          body.innerHTML = `
            <button id="google-signin-btn" class="w-full flex items-center justify-center gap-3 bg-white text-gray-900 font-medium py-3 px-4 rounded-lg hover:bg-gray-100 transition-all">
              <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
              Continue with Google
            </button>

            <div class="flex items-center gap-4 my-6">
              <div class="flex-1 h-px bg-white/[0.08]"></div>
              <span class="text-xs text-gray-500 uppercase tracking-wider">or</span>
              <div class="flex-1 h-px bg-white/[0.08]"></div>
            </div>

            <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Email</label>
            <input id="staff-email" type="email" autocomplete="email" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />

            <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Password</label>
            <input id="staff-password" type="password" autocomplete="current-password" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-3 transition-all" />

            <div class="flex justify-end mb-4">
              <button id="staff-forgot" type="button" class="text-xs text-gray-500 hover:text-[#F59E0B] transition-colors">Forgot password?</button>
            </div>

            <p id="login-error" class="text-red-400 text-sm mb-4 hidden"></p>

            <button id="staff-login-btn" class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:brightness-110 transition-all disabled:opacity-60">Sign In</button>`;

          document.getElementById('google-signin-btn').addEventListener('click', handleStaffGoogleSignIn);

          const submit = async () => {
            const err = document.getElementById('login-error');
            const btn = document.getElementById('staff-login-btn');
            const showErr = m => { err.textContent = m; err.classList.remove('hidden'); };
            err.classList.add('hidden');
            const email = document.getElementById('staff-email').value.trim();
            const password = document.getElementById('staff-password').value;
            if (!email || !password) return showErr('Enter email and password.');
            if (!isValidEmail(email)) return showErr('Enter a valid email address.');
            btn.disabled = true; btn.textContent = 'Signing in…';
            try {
              suppressAuthRouting = true;
              const cred = await signInWithEmailAndPassword(auth, email, password);
              const dest = await resolveDestinationForUser(cred.user);
              suppressAuthRouting = false;
              navigate(dest);
            } catch (e) {
              suppressAuthRouting = false;
              console.error(e); btn.disabled = false; btn.textContent = 'Sign In';
              if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code)) showErr('Invalid email or password.');
              else showErr('Sign-in failed. Try again.');
            }
          };
          document.getElementById('staff-login-btn').addEventListener('click', submit);
          document.getElementById('staff-password').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

          document.getElementById('staff-forgot').addEventListener('click', async () => {
            const email = document.getElementById('staff-email').value.trim();
            if (!isValidEmail(email)) { alert('Enter your email above first, then click "Forgot password?".'); return; }
            try { await sendPasswordResetEmail(auth, email); alert('Reset email sent to ' + email); }
            catch (e) { alert('Failed: ' + e.message); }
          });
          return;
        }

        // ── STUDENT (school + username + password) ──
        body.innerHTML = `
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Your School</label>
          <div class="relative mb-4">
            <input id="school-search" type="text" placeholder="Search by name or code" autocomplete="off" value="${preselected ? escapeHtml(preselected.name) : ''}"
              class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" />
            <div id="school-results" class="absolute z-30 left-0 right-0 mt-1 bg-[#141414] border border-white/[0.08] rounded-lg overflow-hidden hidden max-h-64 overflow-y-auto shadow-2xl"></div>
          </div>
          ${preselected ? `
            <div class="mb-4 p-3 bg-[#F59E0B]/10 border border-[#F59E0B]/20 rounded-lg flex items-center gap-2">
              <i data-lucide="check-circle-2" class="w-4 h-4 text-[#F59E0B] shrink-0"></i>
              <span class="text-sm text-white">${escapeHtml(preselected.name)}</span>
              <button id="clear-school" class="ml-auto text-xs text-[#F59E0B] hover:underline">Change</button>
            </div>` : ''}
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Username</label>
          <input id="student-username" type="text" autocomplete="username" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Password</label>
          <input id="student-password" type="password" autocomplete="current-password" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />
          <p id="login-error" class="text-red-400 text-sm mb-4 hidden"></p>
          <button id="student-login-btn" class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:brightness-110 transition-all disabled:opacity-60">Sign In</button>`;

        const searchEl = document.getElementById('school-search');
        const resultsEl = document.getElementById('school-results');
        let st;
        searchEl.addEventListener('input', () => {
          clearTimeout(st);
          const q = searchEl.value.trim();
          preselected = null;
          if (q.length < 2) { resultsEl.classList.add('hidden'); return; }
          st = setTimeout(async () => {
            try {
              const results = await searchSchools(q);
              if (!results.length) resultsEl.innerHTML = `<div class="p-4 text-sm text-gray-500">No schools found.</div>`;
              else resultsEl.innerHTML = results.map(s => `
                <button type="button" data-slug="${escapeHtml(s.slug)}" data-name="${escapeHtml(s.name)}"
                  class="w-full text-left px-4 py-3 hover:bg-white/[0.05] border-b border-white/[0.04] last:border-0 transition-all">
                  <div class="text-sm text-white">${escapeHtml(s.name)}</div>
                  <div class="text-xs text-gray-500 font-mono">/${escapeHtml(s.slug)}</div>
                </button>`).join('');
              resultsEl.classList.remove('hidden');
              resultsEl.querySelectorAll('[data-slug]').forEach(b => b.addEventListener('click', () => {
                preselected = { slug: b.dataset.slug, name: b.dataset.name };
                renderLogin();
              }));
            } catch(e) { console.error(e); }
          }, 200);
        });

        const clearBtn = document.getElementById('clear-school');
        if (clearBtn) clearBtn.addEventListener('click', () => { preselected = null; renderLogin(); });

        const login = async () => {
          const err = document.getElementById('login-error');
          const btn = document.getElementById('student-login-btn');
          const showErr = m => { err.textContent = m; err.classList.remove('hidden'); };
          err.classList.add('hidden');
          if (!preselected) return showErr('Please select your school.');
          const u = document.getElementById('student-username').value.trim().toLowerCase();
          const p = document.getElementById('student-password').value;
          if (!u || !p) return showErr('Enter both username and password.');
          if (!/^[a-z0-9_]{3,20}$/.test(u)) return showErr('Invalid username format.');
          btn.disabled = true; btn.textContent = 'Signing in…';
          try {
            await signInWithEmailAndPassword(auth, `${u}@${preselected.slug}.emberlms.local`, p);
          } catch (e) {
            console.error(e); btn.disabled = false; btn.textContent = 'Sign In';
            if (['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code)) showErr('Invalid username or password.');
            else showErr('Sign-in failed. Try again.');
          }
        };
        document.getElementById('student-login-btn').addEventListener('click', login);
        document.getElementById('student-password').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
      };

      renderLogin();
    }

    async function handleStaffGoogleSignIn() {
      try {
        suppressAuthRouting = true;
        const cred = await signInWithPopup(auth, new GoogleAuthProvider());
        const dest = await resolveDestinationForUser(cred.user);
        suppressAuthRouting = false;
        navigate(dest);
      } catch (e) {
        suppressAuthRouting = false;
        console.error(e);
        if (['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)) return;
        alert('Sign-in failed: ' + e.message);
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ VIEW: SIGNUP
    // ═══════════════════════════════════════════════════════════════════
    function viewSignup() {
      if (!signupWizard) signupWizard = { role: null, mode: null, step: 'role', data: {} };
      renderWizard();
    }

    // Renders a Google + email/password auth block. onAuthed(user) fires after successful auth.
    function renderAuthBlock(container, { submitLabel = 'Continue', onAuthed }) {
      container.innerHTML = `
        <button data-google-btn class="w-full flex items-center justify-center gap-3 bg-white text-gray-900 font-medium py-3 px-4 rounded-lg hover:bg-gray-100 transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>

        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-white/[0.08]"></div>
          <span class="text-xs text-gray-500 uppercase tracking-wider">or</span>
          <div class="flex-1 h-px bg-white/[0.08]"></div>
        </div>

        <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Email</label>
        <input data-email type="email" autocomplete="email" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />

        <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Password</label>
        <input data-pass type="password" autocomplete="new-password" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />

        <p data-err class="text-red-400 text-sm mb-4 hidden"></p>

        <button data-submit class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:brightness-110 transition-all disabled:opacity-60">${escapeHtml(submitLabel)}</button>`;

      const errEl = container.querySelector('[data-err]');
      const btn = container.querySelector('[data-submit]');
      const emailEl = container.querySelector('[data-email]');
      const passEl = container.querySelector('[data-pass]');
      const showErr = m => { errEl.textContent = m; errEl.classList.remove('hidden'); };

      container.querySelector('[data-google-btn]').addEventListener('click', async () => {
        try {
          suppressAuthRouting = true;
          const cred = await signInWithPopup(auth, new GoogleAuthProvider());
          suppressAuthRouting = false;
          onAuthed(cred.user);
        } catch (e) {
          suppressAuthRouting = false;
          if (['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)) return;
          showErr('Google sign-in failed: ' + e.message);
        }
      });

      const submit = async () => {
        errEl.classList.add('hidden');
        const email = emailEl.value.trim();
        const password = passEl.value;
        if (!isValidEmail(email)) return showErr('Enter a valid email address.');
        if (password.length < 6) return showErr('Password must be at least 6 characters.');
        btn.disabled = true; btn.textContent = 'Creating account…';
        try {
          if (auth.currentUser) { try { await signOut(auth); } catch(e) {} }
          suppressAuthRouting = true;
          const cred = await createUserWithEmailAndPassword(auth, email, password);
          suppressAuthRouting = false;
          onAuthed(cred.user);
        } catch (e) {
          suppressAuthRouting = false;
          console.error(e); btn.disabled = false; btn.textContent = submitLabel;
          if (e.code === 'auth/email-already-in-use') showErr('That email is already in use. Try signing in instead.');
          else if (e.code === 'auth/weak-password') showErr('Password is too weak. Use at least 6 characters.');
          else showErr('Failed: ' + (e.message || e.code));
        }
      };
      btn.addEventListener('click', submit);
      passEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    }

    function renderWizard() {

      if (w.step === 'role') {
        render(shell(`

              <div class="w-12 h-12 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center shrink-0"><i data-lucide="graduation-cap" class="w-6 h-6 text-[#F59E0B]"></i></div>

              <div class="w-12 h-12 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center shrink-0"><i data-lucide="building-2" class="w-6 h-6 text-[#F59E0B]"></i></div>

        const input = document.getElementById('wz-joincode');
        input.addEventListener('input', () => { input.value = input.value.toUpperCase().slice(0, 6); });

          <button id="wz-next" class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg hover:brightness-110 transition-all">Continue</button>
        `));
        document.querySelector('[data-back]').addEventListener('click', () => { w.step = 'teacher-mode'; renderWizard(); });
        const nameEl = document.getElementById('wz-name');
        const slugEl = document.getElementById('wz-slug');
        nameEl.addEventListener('input', () => { if (!slugEl.dataset.touched) slugEl.value = slugify(nameEl.value); });
        slugEl.addEventListener('input', () => { slugEl.dataset.touched = '1'; });
        setTimeout(() => nameEl.focus(), 50);
        document.getElementById('wz-next').addEventListener('click', async () => {
          const name = nameEl.value.trim();
          const slug = slugEl.value.trim().toLowerCase();
          const err = document.getElementById('wz-error');
          const btn = document.getElementById('wz-next');
          err.classList.add('hidden');
          if (!name) { err.textContent = 'Enter a name.'; err.classList.remove('hidden'); return; }
          if (!/^[a-z0-9-]{3,30}$/.test(slug)) { err.textContent = 'URL must be 3–30 chars: lowercase, numbers, hyphens.'; err.classList.remove('hidden'); return; }
          if (RESERVED.includes(slug)) { err.textContent = 'That URL is reserved.'; err.classList.remove('hidden'); return; }
          btn.disabled = true; btn.textContent = 'Checking…';
          try {
            const ex = await getDoc(doc(db, 'tenants', slug));
            if (ex.exists()) { btn.disabled = false; btn.textContent = 'Continue'; err.textContent = 'That URL is taken.'; err.classList.remove('hidden'); return; }
            w.data.tenantName = name;
            w.data.tenantSlug = slug;
            w.step = 'teacher-auth';
            renderWizard();
          } catch (e) {
            console.error(e); btn.disabled = false; btn.textContent = 'Continue';
            err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden');
          }
        });
        refreshIcons();
        return;
      }

      // ── TEACHER AUTH (shared step for both join + personal) ──
      if (w.step === 'teacher-auth') {
        const isJoin = w.mode === 'join';
        render(shell(`
          ${backBtn()}
          <h2 class="font-serif text-3xl text-white mb-1">${authReady && currentUser ? 'Confirm your account' : 'Sign in to continue'}</h2>
          <p class="text-gray-500 text-sm mb-6">
            ${isJoin
              ? `Joining <span class="text-white">${escapeHtml(w.data.schoolName || '')}</span>`
              : `Creating <span class="text-white">${escapeHtml(w.data.tenantName || '')}</span>`}
          </p>
          <div id="wz-auth"></div>
        `));
        document.querySelector('[data-back]').addEventListener('click', () => {
          w.step = isJoin ? 'teacher-join' : 'teacher-personal-name';
          renderWizard();
        });

        // If already signed in (e.g., came back), skip the auth UI
        if (currentUser) {
          const block = document.getElementById('wz-auth');
          block.innerHTML = `
            <div class="p-4 bg-white/[0.03] border border-white/[0.08] rounded-lg mb-4">
              <p class="text-xs text-gray-500 mb-1">Signed in as</p>
              <p class="text-sm text-white">${escapeHtml(currentUser.email || currentUser.displayName || '')}</p>
            </div>
            <p id="wz-error" class="text-red-400 text-sm mb-4 hidden"></p>
            <button id="wz-finish" class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60">Finish</button>
          `;
          document.getElementById('wz-finish').addEventListener('click', () => finalizeTeacherSignup(w));
          refreshIcons();
          return;
        }

        const block = document.getElementById('wz-auth');
        renderAuthBlock(block, {
          submitLabel: 'Create Account',
          onAuthed: (user) => finalizeTeacherSignup(w, user)
        });
        refreshIcons();
        return;
      }

      // ── STUDENT SCHOOL ──
      if (w.step === 'student-school') {
        render(shell(`
          ${backBtn()}
          <h2 class="font-serif text-3xl text-white mb-1">Find your school</h2>
          <p class="text-gray-500 text-sm mb-8">Search by name or URL.</p>
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Your School</label>
          <div class="relative mb-4">
            <input id="wz-school-search" type="text" placeholder="Start typing…" autocomplete="off" value="${w.data.school ? escapeHtml(w.data.school.name) : ''}"
              class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" />
            <div id="wz-school-results" class="absolute z-30 left-0 right-0 mt-1 bg-[#141414] border border-white/[0.08] rounded-lg overflow-hidden hidden max-h-64 overflow-y-auto shadow-2xl"></div>
          </div>
          ${w.data.school ? `
            <div class="mb-4 p-3 bg-[#F59E0B]/10 border border-[#F59E0B]/20 rounded-lg flex items-center gap-2">
              <i data-lucide="check-circle-2" class="w-4 h-4 text-[#F59E0B] shrink-0"></i>
              <span class="text-sm text-white">${escapeHtml(w.data.school.name)}</span>
            </div>` : ''}
          <button id="wz-school-next" class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60" ${w.data.school ? '' : 'disabled'}>Continue</button>
        `));
        document.querySelector('[data-back]').addEventListener('click', () => { w.step = 'role'; renderWizard(); });
        const searchEl = document.getElementById('wz-school-search');
        const resultsEl = document.getElementById('wz-school-results');
        let t;
        searchEl.addEventListener('input', () => {
          clearTimeout(t);
          const q = searchEl.value.trim();
          w.data.school = null;
          if (q.length < 2) { resultsEl.classList.add('hidden'); return; }
          t = setTimeout(async () => {
            try {
              const results = await searchSchools(q);
              if (!results.length) resultsEl.innerHTML = `<div class="p-4 text-sm text-gray-500">No schools found.</div>`;
              else resultsEl.innerHTML = results.map(s => `
                <button type="button" data-slug="${escapeHtml(s.slug)}" data-name="${escapeHtml(s.name)}"
                  class="w-full text-left px-4 py-3 hover:bg-white/[0.05] border-b border-white/[0.04] last:border-0 transition-all">
                  <div class="text-sm text-white">${escapeHtml(s.name)}</div>
                  <div class="text-xs text-gray-500 font-mono">/${escapeHtml(s.slug)}</div>
                </button>`).join('');
              resultsEl.classList.remove('hidden');
              resultsEl.querySelectorAll('[data-slug]').forEach(b => b.addEventListener('click', () => {
                w.data.school = { slug: b.dataset.slug, name: b.dataset.name };
                renderWizard();
              }));
            } catch(e) { console.error(e); }
          }, 200);
        });
        const next = document.getElementById('wz-school-next');
        if (next) next.addEventListener('click', () => {
          if (!w.data.school) return;
          w.step = 'student-form';
          renderWizard();
        });
        refreshIcons();
        return;
      }

      // ── STUDENT FORM ──
      if (w.step === 'student-form') {
        const school = w.data.school;
        render(shell(`
          ${backBtn()}
          <h2 class="font-serif text-3xl text-white mb-1">Create your login</h2>
          <p class="text-gray-500 text-sm mb-6">Joining <span class="text-white">${escapeHtml(school.name)}</span></p>
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">First Name</label><input id="wz-first" type="text" autocomplete="off" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /></div>
            <div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Last Name</label><input id="wz-last" type="text" autocomplete="off" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /></div>
          </div>
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Username</label>
          <input id="wz-user" type="text" autocomplete="off" placeholder="auto-generated" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all font-mono text-sm" />
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Password</label>
          <input id="wz-pass" type="password" autocomplete="new-password" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />
          <p id="wz-error" class="text-red-400 text-sm mb-4 hidden"></p>
          <button id="wz-submit" class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60">Create Account</button>
          <p class="text-xs text-gray-500 mt-4 leading-relaxed text-center">Your teacher will need to approve your account before you can access courses.</p>
        `));
        document.querySelector('[data-back]').addEventListener('click', () => { w.step = 'student-school'; renderWizard(); });
        const firstEl = document.getElementById('wz-first');
        const lastEl = document.getElementById('wz-last');
        const userEl = document.getElementById('wz-user');
        const passEl = document.getElementById('wz-pass');
        const updateUser = async () => {
          if (userEl.dataset.touched) return;
          const f = firstEl.value.trim(); const l = lastEl.value.trim();
          if (!f) return;
          let existing = [];
          try {
            const snap = await getDocs(collection(db, 'tenants', school.slug, 'students'));
            existing = snap.docs.map(d => d.data().username);
          } catch(e) {}
          userEl.value = genUsername(f, l, existing);
        };
        firstEl.addEventListener('input', updateUser);
        lastEl.addEventListener('input', updateUser);
        userEl.addEventListener('input', () => { userEl.dataset.touched = '1'; });
        setTimeout(() => firstEl.focus(), 50);
        document.getElementById('wz-submit').addEventListener('click', async () => {
          const first = firstEl.value.trim();
          const last = lastEl.value.trim();
          const username = userEl.value.trim().toLowerCase();
          const password = passEl.value;
          const err = document.getElementById('wz-error');
          const btn = document.getElementById('wz-submit');
          err.classList.add('hidden');
          if (!first) { err.textContent = 'Enter your first name.'; err.classList.remove('hidden'); return; }
          if (!/^[a-z0-9_]{3,20}$/.test(username)) { err.textContent = 'Username must be 3–20 chars: lowercase, numbers, underscores.'; err.classList.remove('hidden'); return; }
          if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.classList.remove('hidden'); return; }
          btn.disabled = true; btn.textContent = 'Creating account…';
          try {
            if (auth.currentUser) { await signOut(auth); }
            suppressAuthRouting = true;
            const fakeEmail = `${username}@${school.slug}.emberlms.local`;
            const cred = await createUserWithEmailAndPassword(auth, fakeEmail, password);
            const uid = cred.user.uid;
            await setDoc(doc(db, 'tenants', school.slug, 'students', uid), {
              username, firstName: first, lastName: last,
              displayName: `${first} ${last}`.trim(),
              email: fakeEmail, role: 'student', status: 'pending',
              enrolledCourseIds: [], createdAt: serverTimestamp()
            });
            suppressAuthRouting = false;
            navigate(`/${school.slug}/pending`);
          } catch (e) {
            suppressAuthRouting = false;
            console.error(e); btn.disabled = false; btn.textContent = 'Create Account';
            if (e.code === 'auth/email-already-in-use') err.textContent = 'That username is already taken at this school.';
            else err.textContent = 'Failed: ' + (e.message || e.code);
            err.classList.remove('hidden');
          }
        });
        refreshIcons();
        return;
      }

      signupWizard = { role: null, mode: null, step: 'role', data: {} };
      renderWizard();
    }

    // Executes the final writes for teacher signup once auth is confirmed
    async function finalizeTeacherSignup(w, user = null) {
      const u = user || currentUser;
      if (!u) { alert('Not signed in. Please retry.'); signupWizard = null; renderWizard(); return; }

      const btn = document.getElementById('wz-finish');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

      try {
        if (w.mode === 'join') {
          const slug = w.data.schoolSlug;
          const existing = await getDoc(doc(db, 'tenants', slug, 'users', u.uid));
          if (!existing.exists()) {
            await setDoc(doc(db, 'tenants', slug, 'users', u.uid), {
              userId: u.uid,
              role: 'teacher',
              email: u.email || '',
              displayName: u.displayName || (u.email ? u.email.split('@')[0] : 'Teacher'),
              photoURL: u.photoURL || null,
              createdAt: serverTimestamp()
            });
          }
          signupWizard = null;
          navigate('/' + slug);
        } else {
          const slug = w.data.tenantSlug;
          const name = w.data.tenantName;
          const ex = await getDoc(doc(db, 'tenants', slug));
          if (ex.exists()) {
            alert('That URL was taken by someone else while you were signing up. Try a different one.');
            signupWizard.data.tenantSlug = null;
            signupWizard.step = 'teacher-personal-name';
            renderWizard();
            return;
          }
          await setDoc(doc(db, 'tenants', slug), {
            type: 'personal', name, slug, ownerUid: u.uid, createdAt: serverTimestamp()
          });
          await setDoc(doc(db, 'tenants', slug, 'users', u.uid), {
            userId: u.uid,
            role: 'admin',
            email: u.email || '',
            displayName: u.displayName || (u.email ? u.email.split('@')[0] : 'Teacher'),
            photoURL: u.photoURL || null,
            createdAt: serverTimestamp()
          });
          signupWizard = null;
          navigate('/' + slug);
        }
      } catch (e) {
        console.error(e);
        const errEl = document.getElementById('wz-error');
        if (errEl) { errEl.textContent = 'Failed to save: ' + (e.message || e.code); errEl.classList.remove('hidden'); }
        if (btn) { btn.disabled = false; btn.textContent = 'Finish'; }
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    async function viewTenant(slug, segs) {
      render(`<div class="min-h-screen flex items-center justify-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></div>`);
      const tenant = await getTenant(slug);
      if (!tenant) return viewTenantNotFound(slug);

      if (!currentUser) { navigate('/login?school=' + slug + '&as=student'); return; }

      const roleInfo = await getRoleInTenant(slug, currentUser.uid);
      if (roleInfo && roleInfo.role === 'student') {
        if (roleInfo.data.status === 'pending') return viewPending(slug, tenant);
        if (roleInfo.data.status === 'rejected') return viewRejected(slug, tenant);
      }
      if (!roleInfo) return viewNoAccess(slug, tenant);

      const sub = segs[0] || 'dashboard';
      if (sub === 'pending') return viewPending(slug, tenant);
      if (sub === 'admin') return viewAdminStub(slug, tenant, roleInfo);
      if (sub === 'students') return viewStudents(slug, tenant, roleInfo);
      if (sub === 'course' && segs[1]) {
        if (segs[2] === 'roster') return viewCourseRoster(slug, tenant, roleInfo, segs[1]);
        if (segs[2] === 'item' && segs[3] && segs[4]) return viewItem(slug, tenant, roleInfo, segs[1], segs[3], segs[4]);
        return viewCourse(slug, tenant, roleInfo, segs[1]);
      }
      return viewDashboard(slug, tenant, roleInfo);
    }
