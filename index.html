              <div class="flex items-center gap-3">
                ${tenant.joinCode ? `<div class="hidden md:flex items-center gap-2 px-4 py-2.5 bg-white/[0.03] border border-white/[0.08] rounded-lg"><span class="text-xs text-gray-500">Join:</span><code class="text-sm font-mono text-[#F59E0B] tracking-widest">${escapeHtml(tenant.joinCode)}</code></div>` : ''}
                <button id="add-student-btn" class="px-5 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4"></i> New Student</button>
              </div>
            </header>
            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div id="pending-section"></div>
              <div id="student-list" class="max-w-4xl mt-6"><div class="text-center py-20 text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i></div></div>
            </div>
          </main>
        </div>`);
      document.getElementById('add-student-btn').addEventListener('click', () => openCreateStudentModal(slug));

      const pendingUnsub = onSnapshot(query(collection(db, 'tenants', slug, 'students'), where('status', '==', 'pending')), (snap) => {
        const el = document.getElementById('pending-section');
        if (!el) return;
        if (snap.empty) { el.innerHTML = ''; return; }
        el.innerHTML = `<div class="bg-[#F59E0B]/5 border border-[#F59E0B]/20 rounded-xl overflow-hidden max-w-4xl">
          <div class="px-5 py-3 border-b border-[#F59E0B]/20 flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4 text-[#F59E0B]"></i><span class="text-sm text-[#F59E0B] font-medium">${snap.size} pending approval</span></div>
          <div class="divide-y divide-white/[0.04]">
            ${snap.docs.map(d => { const s = d.data(); const n = s.displayName || `${s.firstName||''} ${s.lastName||''}`.trim() || s.username;
              return `<div class="flex items-center px-5 py-3 gap-3">
                <div class="flex-1 min-w-0"><div class="text-sm text-white truncate">${escapeHtml(n)}</div><div class="text-xs text-gray-500 font-mono truncate">${escapeHtml(s.username||'')}</div></div>
                <button data-approve="${d.id}" class="px-3 py-1.5 bg-[#F59E0B] text-white text-xs font-medium rounded-lg hover:brightness-110 transition-all">Approve</button>
                <button data-reject="${d.id}" class="px-3 py-1.5 bg-white/[0.05] border border-white/10 text-gray-300 text-xs rounded-lg hover:bg-red-500/20 hover:text-red-400 hover:border-red-500/30 transition-all">Reject</button>
              </div>`;
            }).join('')}
          </div></div>`;
        refreshIcons();
        el.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
          await updateDoc(doc(db, 'tenants', slug, 'students', b.dataset.approve), { status: 'approved', approvedBy: currentUser.uid, approvedAt: serverTimestamp() });
        }));
        el.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
          if (confirm('Reject this student?')) await updateDoc(doc(db, 'tenants', slug, 'students', b.dataset.reject), { status: 'rejected', approvedBy: currentUser.uid, approvedAt: serverTimestamp() });
        }));
      });
      unsubs.push(pendingUnsub);

      const unsub = onSnapshot(query(collection(db, 'tenants', slug, 'students'), orderBy('createdAt', 'desc')), (snap) => {
        const list = document.getElementById('student-list');
        if (!list) return;
        const approved = snap.docs.filter(d => d.data().status !== 'pending');
        if (approved.length === 0) {
          list.innerHTML = `<div class="border border-dashed border-white/10 rounded-xl p-10 text-center"><i data-lucide="users" class="w-10 h-10 text-gray-600 mx-auto mb-4"></i><h3 class="font-serif text-xl text-white mb-2">No students yet</h3><p class="text-gray-500 text-sm">Click "New Student" to create accounts, or share your join code.</p></div>`;
          refreshIcons(); return;
        }
        list.innerHTML = `<div class="bg-[#141414] border border-white/[0.08] rounded-xl overflow-hidden">
          <div class="grid grid-cols-12 px-5 py-3 border-b border-white/[0.06] text-[10px] uppercase tracking-wider text-gray-500"><div class="col-span-4">Name</div><div class="col-span-3">Username</div><div class="col-span-2">Status</div><div class="col-span-2">Courses</div><div class="col-span-1"></div></div>
          <div class="divide-y divide-white/[0.04]">
            ${approved.map(d => { const s = d.data(); const name = s.displayName || `${s.firstName||''} ${s.lastName||''}`.trim() || s.username;
              const enrolled = (s.enrolledCourseIds || []).length; const status = s.status || 'approved';
              return `<div class="grid grid-cols-12 px-5 py-3 items-center hover:bg-white/[0.02] group transition-all">
                <div class="col-span-4 text-sm text-white truncate">${escapeHtml(name)}</div>
                <div class="col-span-3 text-sm text-gray-400 font-mono truncate">${escapeHtml(s.username || '')}</div>
                <div class="col-span-2 text-xs ${status === 'approved' ? 'text-green-400' : 'text-red-400'}">${escapeHtml(status)}</div>
                <div class="col-span-2 text-xs text-gray-500">${enrolled} course${enrolled === 1 ? '' : 's'}</div>
                <div class="col-span-1 flex justify-end gap-1">
                  <button data-copy-user data-user="${escapeHtml(s.username||'')}" title="Copy credentials" class="p-1.5 text-gray-500 hover:text-[#F59E0B] opacity-0 group-hover:opacity-100 transition-all"><i data-lucide="clipboard" class="w-3.5 h-3.5"></i></button>
                  <button data-delete-student data-id="${d.id}" data-name="${escapeHtml(name)}" title="Delete" class="p-1.5 text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
              </div>`;
            }).join('')}
          </div></div>`;
        refreshIcons();
        list.querySelectorAll('[data-delete-student]').forEach(btn => btn.addEventListener('click', async () => {
          if (confirm(`Delete student "${btn.dataset.name}"?`)) await deleteDoc(doc(db, 'tenants', slug, 'students', btn.dataset.id));
        }));
        list.querySelectorAll('[data-copy-user]').forEach(btn => btn.addEventListener('click', async () => {
          const studentDoc = snap.docs.find(d => d.data().username === btn.dataset.user);
          if (studentDoc) {
            const s = studentDoc.data();
            const text = `Ember LMS Login\nURL: ${window.location.origin}${buildUrl('/login?school=' + slug + '&as=student')}\nSchool: ${tenant.name}\nUsername: ${s.username}\nPassword: ${s.tempPassword || '(ask your teacher)'}`;
            try { await navigator.clipboard.writeText(text); alert('Credentials copied!'); } catch(e) { prompt('Copy:', text); }
          }
        }));
      });
      unsubs.push(unsub);
    }

    function openCreateStudentModal(slug) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
          <h3 class="font-serif text-2xl text-white mb-1">New Student</h3>
          <p class="text-gray-500 text-sm mb-6">Create a username and password for this student.</p>
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">First Name</label><input id="student-first" type="text" autocomplete="off" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /></div>
            <div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Last Name</label><input id="student-last" type="text" autocomplete="off" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /></div>
          </div>
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Username</label>
          <input id="student-user" type="text" autocomplete="off" placeholder="auto-generated" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all font-mono text-sm" />
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Password</label>
          <div class="flex gap-2 mb-6">
            <input id="student-pass" type="text" autocomplete="off" class="input-glow flex-1 bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all font-mono text-sm" />
            <button id="regen-pass" type="button" title="Regenerate" class="px-3 bg-white/[0.05] border border-white/10 text-gray-400 hover:text-[#F59E0B] rounded-lg transition-all"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button>
          </div>
          <p id="student-error" class="text-red-400 text-sm mb-4 hidden"></p>
          <div class="flex gap-3">
            <button id="student-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
            <button id="student-create" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60">Create Student</button>
          </div>
        </div>`;
      document.body.appendChild(ov);
      refreshIcons();
      const firstEl = ov.querySelector('#student-first');
      const lastEl = ov.querySelector('#student-last');
      const userEl = ov.querySelector('#student-user');
      const passEl = ov.querySelector('#student-pass');
      passEl.value = genPassword();
      const updateUser = async () => {
        if (userEl.dataset.touched) return;
        const f = firstEl.value.trim(); const l = lastEl.value.trim();
        if (!f) return;
        let existing = [];
        try { const snap = await getDocs(collection(db, 'tenants', slug, 'students')); existing = snap.docs.map(d => d.data().username); } catch(e){}
        userEl.value = genUsername(f, l, existing);
      };
      firstEl.addEventListener('input', updateUser);
      lastEl.addEventListener('input', updateUser);
      userEl.addEventListener('input', () => { userEl.dataset.touched = '1'; });
      ov.querySelector('#regen-pass').addEventListener('click', () => { passEl.value = genPassword(); });
      const close = () => ov.remove();
      ov.querySelector('#student-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelector('#student-create').addEventListener('click', async () => {
        const firstName = firstEl.value.trim();
        const lastName = lastEl.value.trim();
        const username = userEl.value.trim().toLowerCase();
        const password = passEl.value;
        const err = ov.querySelector('#student-error');
        const btn = ov.querySelector('#student-create');
        err.classList.add('hidden');
        if (!firstName) { err.textContent = 'Enter a first name.'; err.classList.remove('hidden'); return; }
        if (!/^[a-z0-9_]{3,20}$/.test(username)) { err.textContent = 'Username: 3–20 chars, lowercase, numbers, underscores.'; err.classList.remove('hidden'); return; }
        if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; err.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          const fakeEmail = `${username}@${slug}.emberlms.local`;
          const cred = await createUserWithEmailAndPassword(secondaryAuth, fakeEmail, password);
          await signOut(secondaryAuth);
          await setDoc(doc(db, 'tenants', slug, 'students', cred.user.uid), {
            username, firstName, lastName,
            displayName: `${firstName} ${lastName}`.trim(),
            email: fakeEmail, role: 'student', status: 'approved',
            tempPassword: password, enrolledCourseIds: [],
            approvedBy: currentUser.uid, approvedAt: serverTimestamp(),
            createdAt: serverTimestamp()
          });
          close();
        } catch (e) {
          console.error(e); btn.disabled = false; btn.textContent = 'Create Student';
          if (e.code === 'auth/email-already-in-use') err.textContent = 'That username is already taken.';
          else err.textContent = 'Failed: ' + (e.message || e.code);
          err.classList.remove('hidden');
        }
      });
      setTimeout(() => firstEl.focus(), 50);
    }

    // ═══════════════════════════════════════════════════════════════
    // DASHBOARD
    // ═══════════════════════════════════════════════════════════════
    function viewDashboard(slug, tenant, roleInfo) {
      const isRealTeacher = roleInfo.role === 'teacher' || roleInfo.role === 'admin';
      const isTeacherMode = isRealTeacher && !viewAsStudent;
      const isStudent = !isRealTeacher;
      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'dashboard')}
          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
            ${viewAsStudent ? renderPreviewBanner() : ''}
            <header class="p-8 pb-4 flex justify-between items-center z-10 relative">
              <div>
                <h2 class="font-serif text-3xl text-white mb-1">${isStudent ? 'My Courses' : 'Dashboard'}</h2>
                <p class="text-xs text-gray-500 tracking-wider uppercase font-medium">${escapeHtml(tenant.name)}</p>
              </div>
              <div class="flex items-center gap-3">
                ${isRealTeacher ? `<button id="toggle-preview-btn" class="px-4 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all flex items-center gap-2"><i data-lucide="${viewAsStudent ? 'eye-off' : 'eye'}" class="w-4 h-4"></i> ${viewAsStudent ? 'Exit Preview' : 'View as Student'}</button>` : ''}
                ${isTeacherMode ? `<button id="add-course-btn" class="px-5 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> New Course</button>` : ''}
              </div>
            </header>
            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-20 text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i></div>
              </div>
            </div>
          </main>
        </div>`);
      if (isRealTeacher) document.getElementById('toggle-preview-btn').addEventListener('click', () => setViewAsStudent(!viewAsStudent));
      if (isTeacherMode) document.getElementById('add-course-btn').addEventListener('click', () => openCourseModal(slug));
      if (isStudent) subscribeToEnrolledCourses(slug, roleInfo);
      else subscribeToOwnedCourses(slug, isTeacherMode);
    }

    function renderPreviewBanner() {
      return `<div class="relative z-20 bg-[#F59E0B]/10 border-b border-[#F59E0B]/20 px-8 py-2.5 flex items-center justify-between text-xs">
        <div class="flex items-center gap-2 text-[#F59E0B]"><i data-lucide="eye" class="w-3.5 h-3.5"></i> <span class="font-medium">Previewing as Student</span></div>
        <button id="exit-preview-banner" class="text-[#F59E0B] hover:text-white font-medium transition-colors">Exit Preview</button>
      </div>`;
    }
    function attachPreviewBannerHandler() {
      const btn = document.getElementById('exit-preview-banner');
      if (btn) btn.addEventListener('click', () => setViewAsStudent(false));
    }

    function subscribeToOwnedCourses(slug, showDelete) {
      clearSubs();
      const q = query(collection(db, 'tenants', slug, 'courses'), orderBy('createdAt', 'desc'));
      const unsub = onSnapshot(q, (snap) => {
        const grid = document.getElementById('course-grid');
        if (!grid) return;
        if (snap.empty) {
          grid.innerHTML = `<div class="col-span-full text-center py-20 border border-dashed border-white/10 rounded-xl"><i data-lucide="book-open" class="w-10 h-10 mx-auto mb-4 text-gray-600"></i><p class="text-lg text-white font-serif mb-1">No courses yet</p><p class="text-sm text-gray-500">${showDelete ? 'Click "New Course" to create your first one.' : ''}</p></div>`;
          refreshIcons(); return;
        }
        grid.innerHTML = snap.docs.map(d => renderCourseCard(slug, d.id, d.data(), showDelete)).join('');
        refreshIcons(); wireCourseGrid(slug, showDelete);
      });
      unsubs.push(unsub);
      attachPreviewBannerHandler();
    }

    async function subscribeToEnrolledCourses(slug, roleInfo) {
      clearSubs();
      const ids = roleInfo.data.enrolledCourseIds || [];
      const grid = document.getElementById('course-grid');
      if (!grid) return;
      if (ids.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-20 border border-dashed border-white/10 rounded-xl"><i data-lucide="book-open" class="w-10 h-10 mx-auto mb-4 text-gray-600"></i><p class="text-lg text-white font-serif mb-1">No courses yet</p></div>`;
        refreshIcons(); return;
      }
      try {
        const courses = await Promise.all(ids.map(async (id) => { const s = await getDoc(doc(db, 'tenants', slug, 'courses', id)); return s.exists() ? { id: s.id, ...s.data() } : null; }));
        const valid = courses.filter(Boolean);
        grid.innerHTML = valid.map(c => renderCourseCard(slug, c.id, c, false)).join('');
        refreshIcons(); wireCourseGrid(slug, false);
      } catch (e) { console.error(e); grid.innerHTML = `<div class="col-span-full text-red-400 text-sm p-6">Failed.</div>`; }
    }

    function wireCourseGrid(slug, showDelete) {
      const grid = document.getElementById('course-grid');
      if (showDelete) grid.querySelectorAll('[data-action="delete"]').forEach(btn => btn.addEventListener('click', async (e) => {
        e.stopPropagation(); e.preventDefault();
        if (confirm(`Delete "${btn.dataset.title}"?`)) await deleteCourse(slug, btn.dataset.id);
      }));
      grid.querySelectorAll('[data-course-link]').forEach(card => card.addEventListener('click', (e) => {
        if (e.target.closest('[data-action]')) return;
        navigate(`/${slug}/course/${card.dataset.courseLink}`);
      }));
    }

    function renderCourseCard(slug, id, course, showDelete) {
      const grad = course.gradient || pickGradient(course.title);
      return `
        <div data-course-link="${id}" class="bg-[#141414] border border-white/[0.08] rounded-xl overflow-hidden cursor-pointer hover:-translate-y-1 hover:border-white/20 transition-all group flex flex-col">
          <div class="${grad} h-24 relative">
            ${showDelete ? `<button data-action="delete" data-id="${id}" data-title="${escapeHtml(course.title || '')}" class="absolute top-2 right-2 p-1.5 bg-black/30 hover:bg-red-500/80 rounded text-white/80 hover:text-white opacity-0 group-hover:opacity-100 transition-all"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
          </div>
          <div class="p-5 flex-1 flex flex-col">
            <p class="text-xs text-gray-500 mb-1 truncate">${escapeHtml(course.code || '')}</p>
            <h4 class="font-serif text-lg text-white mb-1 truncate">${escapeHtml(course.title || 'Untitled')}</h4>
            <p class="text-xs text-gray-500 truncate mb-4">Created ${escapeHtml(formatDate(course.createdAt))}</p>
            <div class="mt-auto flex gap-4 text-gray-500">
              <i data-lucide="megaphone" class="w-4 h-4 hover:text-[#F59E0B] transition-colors"></i>
              <i data-lucide="file-text" class="w-4 h-4 hover:text-[#F59E0B] transition-colors"></i>
              <i data-lucide="message-square" class="w-4 h-4 hover:text-[#F59E0B] transition-colors"></i>
              <i data-lucide="folder" class="w-4 h-4 hover:text-[#F59E0B] transition-colors"></i>
            </div>
          </div>
        </div>`;
    }

    async function createCourse(slug, data) {
      const ref = await addDoc(collection(db, 'tenants', slug, 'courses'), {
        title: data.title, code: data.code || data.title,
        gradient: data.gradient || pickGradient(data.title),
        ownerUid: currentUser.uid, published: true, createdAt: serverTimestamp()
      });
      return ref.id;
    }
    async function deleteCourse(slug, id) { await deleteDoc(doc(db, 'tenants', slug, 'courses', id)); }

    function openCourseModal(slug) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
          <h3 class="font-serif text-2xl text-white mb-1">New Course</h3>
          <p class="text-gray-500 text-sm mb-6">Create a course for your students.</p>
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Course Name</label>
          <input id="course-title" type="text" placeholder="English 1" autocomplete="off" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Course Code</label>
          <input id="course-code" type="text" placeholder="01 - English 1" autocomplete="off" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Color</label>
          <div id="gradient-picker" class="grid grid-cols-6 gap-2 mb-6">
            ${GRADIENTS.map((g, i) => `<button type="button" data-grad="${g}" class="${g} h-9 rounded-lg border-2 ${i === 0 ? 'border-white' : 'border-transparent'} hover:border-white/50 transition-all"></button>`).join('')}
          </div>
          <p id="course-error" class="text-red-400 text-sm mb-4 hidden"></p>
          <div class="flex gap-3">
            <button id="course-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
            <button id="course-create" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all">Create</button>
          </div>
        </div>`;
      document.body.appendChild(ov);
      let grad = GRADIENTS[0];
      ov.querySelectorAll('[data-grad]').forEach(b => b.addEventListener('click', () => {
        grad = b.dataset.grad;
        ov.querySelectorAll('[data-grad]').forEach(x => x.classList.replace('border-white','border-transparent'));
        b.classList.replace('border-transparent','border-white');
      }));
      const close = () => ov.remove();
      ov.querySelector('#course-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelector('#course-create').addEventListener('click', async () => {
        const title = ov.querySelector('#course-title').value.trim();
        const code = ov.querySelector('#course-code').value.trim();
        const err = ov.querySelector('#course-error');
        const btn = ov.querySelector('#course-create');
        err.classList.add('hidden');
        if (!title) { err.textContent = 'Enter a course name.'; err.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Creating…';
        try { await createCourse(slug, { title, code, gradient: grad }); close(); }
        catch(e) { console.error(e); btn.disabled = false; btn.textContent = 'Create'; err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden'); }
      });
      setTimeout(() => ov.querySelector('#course-title').focus(), 50);
    }

    // ═══════════════════════════════════════════════════════════════
    // COURSE ROSTER
    // ═══════════════════════════════════════════════════════════════
    async function viewCourseRoster(slug, tenant, roleInfo, courseId) {
      if (roleInfo.role !== 'teacher' && roleInfo.role !== 'admin') return viewNotFound();
      const cSnap = await getDoc(doc(db, 'tenants', slug, 'courses', courseId));
      if (!cSnap.exists()) return viewNotFound();
      const course = { id: cSnap.id, ...cSnap.data() };
      const grad = course.gradient || pickGradient(course.title);
      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'roster', course)}
          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
            <header class="p-8 pb-4 z-10 relative">
              <a href="${buildUrl('/' + slug + '/course/' + courseId)}" class="text-xs text-gray-500 hover:text-[#F59E0B] transition-all inline-flex items-center gap-1 mb-3"><i data-lucide="arrow-left" class="w-3 h-3"></i> Back to ${escapeHtml(course.title)}</a>
              <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-4 min-w-0"><div class="${grad} w-12 h-12 rounded-xl shrink-0"></div><div class="min-w-0"><p class="text-xs text-gray-500 mb-0.5">Roster</p><h2 class="font-serif text-3xl text-white truncate">${escapeHtml(course.title || 'Untitled')}</h2></div></div>
                <button id="enroll-btn" class="px-5 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4"></i> Enroll Students</button>
              </div>
            </header>
            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div id="roster-list" class="max-w-4xl"><div class="text-center py-20 text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i></div></div>
            </div>
          </main>
        </div>`);
      document.getElementById('enroll-btn').addEventListener('click', () => openEnrollModal(slug, courseId));
      const unsub = onSnapshot(collection(db, 'tenants', slug, 'courses', courseId, 'enrollments'), (snap) => {
        const list = document.getElementById('roster-list');
        if (!list) return;
        if (snap.empty) { list.innerHTML = `<div class="border border-dashed border-white/10 rounded-xl p-10 text-center"><i data-lucide="users" class="w-10 h-10 text-gray-600 mx-auto mb-4"></i><h3 class="font-serif text-xl text-white mb-2">No students enrolled</h3></div>`; refreshIcons(); return; }
        list.innerHTML = `<div class="bg-[#141414] border border-white/[0.08] rounded-xl overflow-hidden">
          <div class="grid grid-cols-12 px-5 py-3 border-b border-white/[0.06] text-[10px] uppercase tracking-wider text-gray-500"><div class="col-span-5">Name</div><div class="col-span-4">Username</div><div class="col-span-2">Enrolled</div><div class="col-span-1"></div></div>
          <div class="divide-y divide-white/[0.04]">
            ${snap.docs.map(d => { const e = d.data();
              return `<div class="grid grid-cols-12 px-5 py-3 items-center hover:bg-white/[0.02] group transition-all">
                <div class="col-span-5 text-sm text-white truncate">${escapeHtml(e.studentName || '')}</div>
                <div class="col-span-4 text-sm text-gray-400 font-mono truncate">${escapeHtml(e.username || '')}</div>
                <div class="col-span-2 text-xs text-gray-500">${escapeHtml(formatDate(e.enrolledAt))}</div>
                <div class="col-span-1 flex justify-end"><button data-unenroll data-id="${d.id}" data-name="${escapeHtml(e.studentName||'')}" class="p-1.5 text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div>
              </div>`;
            }).join('')}
          </div></div>`;
        refreshIcons();
        list.querySelectorAll('[data-unenroll]').forEach(btn => btn.addEventListener('click', async () => {
          if (confirm(`Remove "${btn.dataset.name}"?`)) {
            await deleteDoc(doc(db, 'tenants', slug, 'courses', courseId, 'enrollments', btn.dataset.id));
            try { await updateDoc(doc(db, 'tenants', slug, 'students', btn.dataset.id), { enrolledCourseIds: arrayRemove(courseId) }); } catch(e) {}
          }
        }));
      });
      unsubs.push(unsub);
    }

    async function openEnrollModal(slug, courseId) {
      const [allSnap, enrolledSnap] = await Promise.all([
        getDocs(query(collection(db, 'tenants', slug, 'students'), where('status', '==', 'approved'))),
        getDocs(collection(db, 'tenants', slug, 'courses', courseId, 'enrollments'))
      ]);
      const enrolled = new Set(enrolledSnap.docs.map(d => d.id));
      const available = allSnap.docs.filter(d => !enrolled.has(d.id)).map(d => ({ id: d.id, ...d.data() }));
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `<div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full shadow-2xl flex flex-col max-h-[80vh]">
        <div class="p-6 border-b border-white/[0.06]"><h3 class="font-serif text-2xl text-white mb-1">Enroll Students</h3></div>
        <div class="flex-1 overflow-y-auto p-4">
          ${available.length === 0 ? `<div class="text-center py-8 px-4"><p class="text-gray-500 text-sm">${allSnap.empty ? 'No approved students yet.' : 'All students are enrolled.'}</p></div>`
            : available.map(s => `<label class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/[0.03] cursor-pointer transition-all">
                <input type="checkbox" data-student-id="${s.id}" data-name="${escapeHtml(s.displayName || s.username || '')}" data-username="${escapeHtml(s.username || '')}" class="w-4 h-4 accent-[#F59E0B]" />
                <div class="flex-1 min-w-0"><div class="text-sm text-white truncate">${escapeHtml(s.displayName || s.username || '')}</div><div class="text-xs text-gray-500 font-mono truncate">${escapeHtml(s.username || '')}</div></div>
              </label>`).join('')}
        </div>
        <div class="p-6 border-t border-white/[0.06] flex gap-3">
          <button id="enroll-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
          <button id="enroll-confirm" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60" ${available.length === 0 ? 'disabled' : ''}>Enroll Selected</button>
        </div></div>`;
      document.body.appendChild(ov);
      refreshIcons();
      const close = () => ov.remove();
      ov.querySelector('#enroll-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelector('#enroll-confirm').addEventListener('click', async () => {
        const checks = [...ov.querySelectorAll('input[type="checkbox"]:checked')];
        if (checks.length === 0) { close(); return; }
        const btn = ov.querySelector('#enroll-confirm');
        btn.disabled = true; btn.textContent = 'Enrolling…';
        try {
          await Promise.all(checks.map(c => (async () => {
            const sid = c.dataset.studentId;
            await setDoc(doc(db, 'tenants', slug, 'courses', courseId, 'enrollments', sid), { studentId: sid, studentName: c.dataset.name, username: c.dataset.username, enrolledAt: serverTimestamp() });
            await updateDoc(doc(db, 'tenants', slug, 'students', sid), { enrolledCourseIds: arrayUnion(courseId) });
          })()));
          close();
        } catch (e) { console.error(e); alert('Failed: ' + e.message); btn.disabled = false; btn.textContent = 'Enroll Selected'; }
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // COURSE VIEW
    // ═══════════════════════════════════════════════════════════════
    async function viewCourse(slug, tenant, roleInfo, courseId) {
      const cSnap = await getDoc(doc(db, 'tenants', slug, 'courses', courseId));
      if (!cSnap.exists()) return viewNotFound();
      const course = { id: cSnap.id, ...cSnap.data() };
      const grad = course.gradient || pickGradient(course.title);
      const isRealTeacher = roleInfo.role === 'teacher' || roleInfo.role === 'admin';
      const isTeacherMode = isRealTeacher && !viewAsStudent;
      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'course', course)}
          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
            ${viewAsStudent ? renderPreviewBanner() : ''}
            <header class="p-8 pb-4 z-10 relative">
              <a href="${buildUrl('/' + slug)}" class="text-xs text-gray-500 hover:text-[#F59E0B] transition-all inline-flex items-center gap-1 mb-3"><i data-lucide="arrow-left" class="w-3 h-3"></i> Back to Dashboard</a>
              <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-4 min-w-0"><div class="${grad} w-12 h-12 rounded-xl shrink-0"></div><div class="min-w-0"><p class="text-xs text-gray-500 mb-0.5 truncate">${escapeHtml(course.code || '')}</p><h2 class="font-serif text-3xl text-white truncate">${escapeHtml(course.title || 'Untitled')}</h2></div></div>
                <div class="flex items-center gap-3 shrink-0">
                  ${isRealTeacher ? `<button id="toggle-preview-btn" class="px-4 py-2 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all flex items-center gap-2"><i data-lucide="${viewAsStudent ? 'eye-off' : 'eye'}" class="w-4 h-4"></i> ${viewAsStudent ? 'Exit Preview' : 'View as Student'}</button>` : ''}
                  ${isTeacherMode ? `<button id="add-module-btn" class="px-4 py-2 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i> Add Module</button>` : ''}
                </div>
              </div>
            </header>
            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div id="modules-list" class="max-w-3xl space-y-4"><div class="text-center py-20 text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i></div></div>
            </div>
          </main>
        </div>`);
      attachPreviewBannerHandler();
      if (isRealTeacher) document.getElementById('toggle-preview-btn').addEventListener('click', () => setViewAsStudent(!viewAsStudent));
      if (isTeacherMode) document.getElementById('add-module-btn').addEventListener('click', () => openModuleModal(slug, courseId));
      subscribeToModules(slug, courseId, isTeacherMode);
    }

    function subscribeToModules(slug, courseId, isTeacher) {
      clearSubs();
      const q = query(collection(db, 'tenants', slug, 'courses', courseId, 'modules'), orderBy('position', 'asc'));
      const unsub = onSnapshot(q, async (snap) => {
        const list = document.getElementById('modules-list');
        if (!list) return;
        if (snap.empty) { list.innerHTML = `<div class="border border-dashed border-white/10 rounded-xl p-10 text-center"><i data-lucide="layers" class="w-10 h-10 text-[#F59E0B] mx-auto mb-4"></i><h3 class="font-serif text-xl text-white mb-2">No modules yet</h3></div>`; refreshIcons(); return; }
        const moduleEls = await Promise.all(snap.docs.map(async (md, idx) => {
          const mod = { id: md.id, ...md.data() };
          const itemsSnap = await new Promise((res) => { const u = onSnapshot(query(collection(db, 'tenants', slug, 'courses', courseId, 'modules', mod.id, 'items'), orderBy('position', 'asc')), res); unsubs.push(u); });
          const items = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          return renderModuleCard(slug, courseId, mod, items, isTeacher, idx + 1);
        }));
        list.innerHTML = moduleEls.join('');
        refreshIcons();
        list.querySelectorAll('[data-item-link]').forEach(el => el.addEventListener('click', (e) => { e.preventDefault(); navigate(`/${slug}/course/${courseId}/item/${el.dataset.moduleId}/${el.dataset.itemLink}`); }));
        if (isTeacher) {
          list.querySelectorAll('[data-module-delete]').forEach(btn => btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm(`Delete module?`)) await deleteDoc(doc(db, 'tenants', slug, 'courses', courseId, 'modules', btn.dataset.id));
          }));
          list.querySelectorAll('[data-item-delete]').forEach(btn => btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm('Delete this item?')) await deleteDoc(doc(db, 'tenants', slug, 'courses', courseId, 'modules', btn.dataset.moduleId, 'items', btn.dataset.id));
          }));
          list.querySelectorAll('[data-add-item]').forEach(btn => btn.addEventListener('click', () => openItemTypeModal(slug, courseId, btn.dataset.moduleId)));
        }
      });
      unsubs.push(unsub);
    }

    function renderModuleCard(slug, courseId, mod, items, isTeacher, idx) {
      const itemsHtml = items.length === 0 ? `<p class="text-xs text-gray-600 italic py-3 px-5">No items yet</p>`
        : items.map(it => renderItemRow(slug, courseId, mod.id, it, isTeacher)).join('');
      return `<div class="bg-[#141414] border border-white/[0.08] rounded-xl overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-white/[0.06]">
          <div class="flex items-center gap-3 min-w-0"><span class="text-[10px] font-mono text-gray-600 tracking-wider">${String(idx).padStart(2,'0')}</span><h3 class="font-serif text-lg text-white truncate">${escapeHtml(mod.title || 'Untitled')}</h3><span class="text-[10px] text-gray-600 shrink-0">${items.length} item${items.length === 1 ? '' : 's'}</span></div>
          ${isTeacher ? `<div class="flex items-center gap-1 shrink-0"><button data-add-item data-module-id="${mod.id}" class="p-1.5 text-gray-500 hover:text-[#F59E0B] hover:bg-white/[0.05] rounded transition-all"><i data-lucide="plus" class="w-4 h-4"></i></button><button data-module-delete data-id="${mod.id}" class="p-1.5 text-gray-500 hover:text-red-400 hover:bg-white/[0.05] rounded transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>` : ''}
        </div>
        <div class="divide-y divide-white/[0.04]">${itemsHtml}</div></div>`;
    }

    function renderItemRow(slug, courseId, moduleId, item, isTeacher) {
      const meta = ITEM_TYPES.find(t => t.type === item.type) || ITEM_TYPES[0];
      const extra = item.type === 'assignment' && item.data?.points ? `<span class="text-[10px] text-gray-600 ml-2">${item.data.points} pts</span>` : '';
      return `<div data-item-link="${item.id}" data-module-id="${moduleId}" class="flex items-center gap-3 px-5 py-3 hover:bg-white/[0.03] cursor-pointer group transition-all">
        <i data-lucide="${meta.icon}" class="w-4 h-4 text-gray-500 group-hover:text-[#F59E0B] transition-colors shrink-0"></i>
        <div class="flex-1 min-w-0"><span class="text-sm text-gray-200 truncate">${escapeHtml(item.title || 'Untitled')}</span><span class="text-[10px] uppercase tracking-wider text-gray-600 ml-3">${meta.label}</span>${extra}</div>
        ${isTeacher ? `<button data-item-delete data-id="${item.id}" data-module-id="${moduleId}" class="p-1 text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all shrink-0"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : `<i data-lucide="chevron-right" class="w-4 h-4 text-gray-700 shrink-0"></i>`}
      </div>`;
    }

    function openModuleModal(slug, courseId) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `<div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
        <h3 class="font-serif text-2xl text-white mb-1">New Module</h3>
        <p class="text-gray-500 text-sm mb-6">A section to group your content.</p>
        <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Module Title</label>
        <input id="module-title" type="text" placeholder="Week 1" autocomplete="off" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-6 transition-all" />
        <p id="module-error" class="text-red-400 text-sm mb-4 hidden"></p>
        <div class="flex gap-3"><button id="module-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button><button id="module-create" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all">Create</button></div>
      </div>`;
      document.body.appendChild(ov);
      const close = () => ov.remove();
      ov.querySelector('#module-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelector('#module-create').addEventListener('click', async () => {
        const title = ov.querySelector('#module-title').value.trim();
        const err = ov.querySelector('#module-error');
        const btn = ov.querySelector('#module-create');
        err.classList.add('hidden');
        if (!title) { err.textContent = 'Enter a title.'; err.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Creating…';
        try { await addDoc(collection(db, 'tenants', slug, 'courses', courseId, 'modules'), { title, position: Date.now(), createdAt: serverTimestamp() }); close(); }
        catch(e) { console.error(e); btn.disabled = false; btn.textContent = 'Create'; err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden'); }
      });
      setTimeout(() => ov.querySelector('#module-title').focus(), 50);
    }

    function openItemTypeModal(slug, courseId, moduleId) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `<div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
        <h3 class="font-serif text-2xl text-white mb-1">Add Item</h3>
        <p class="text-gray-500 text-sm mb-6">What kind of content?</p>
        <div class="space-y-2">
          ${ITEM_TYPES.map(t => `<button data-type="${t.type}" class="w-full flex items-center gap-4 px-4 py-3.5 bg-white/[0.03] border border-white/[0.08] rounded-lg hover:bg-white/[0.06] hover:border-[#F59E0B]/40 transition-all text-left group">
            <div class="w-9 h-9 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center shrink-0"><i data-lucide="${t.icon}" class="w-4 h-4 text-[#F59E0B]"></i></div>
            <div class="flex-1 min-w-0"><div class="text-sm text-white font-medium">${t.label}</div><div class="text-xs text-gray-500">${t.desc}</div></div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600 group-hover:text-[#F59E0B] transition-colors"></i>
          </button>`).join('')}
        </div>
        <button id="item-type-cancel" class="w-full mt-6 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
      </div>`;
      document.body.appendChild(ov);
      refreshIcons();
      const close = () => ov.remove();
      ov.querySelector('#item-type-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelectorAll('[data-type]').forEach(btn => btn.addEventListener('click', () => { close(); openItemEditor(slug, courseId, moduleId, null, btn.dataset.type); }));
    }

    function openItemEditor(slug, courseId, moduleId, existingItem, type) {
      const item = existingItem || { type, title: '', data: {} };
      const meta = ITEM_TYPES.find(t => t.type === item.type) || ITEM_TYPES[0];
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-start justify-center bg-black/60 modal-overlay px-6 py-10 overflow-y-auto';
      ov.innerHTML = `<div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-2xl w-full shadow-2xl my-8">
        <div class="p-8 pb-6 border-b border-white/[0.06] flex items-center justify-between">
          <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center"><i data-lucide="${meta.icon}" class="w-4 h-4 text-[#F59E0B]"></i></div><div><h3 class="font-serif text-2xl text-white">${existingItem ? 'Edit' : 'New'} ${meta.label}</h3></div></div>
          <button id="item-close" class="p-2 text-gray-500 hover:text-white rounded transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="p-8 space-y-5">
          <div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Title</label><input id="item-title" type="text" value="${escapeHtml(item.title || '')}" autocomplete="off" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /></div>
          ${item.type === 'page' ? `<div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Content</label><div class="bg-white/[0.02] border border-white/10 rounded-lg overflow-hidden"><div id="quill-toolbar"><span class="ql-formats"><select class="ql-header"><option value="1"></option><option value="2"></option><option value="3"></option><option selected></option></select></span><span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button></span><span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span><span class="ql-formats"><button class="ql-blockquote"></button><button class="ql-link"></button><button class="ql-image"></button></span><span class="ql-formats"><button class="ql-clean"></button></span></div><div id="quill-editor"></div></div></div>` : ''}
          ${item.type === 'assignment' ? `<div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Instructions</label><div class="bg-white/[0.02] border border-white/10 rounded-lg overflow-hidden"><div id="quill-toolbar"><span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button></span><span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span><span class="ql-formats"><button class="ql-link"></button><button class="ql-clean"></button></span></div><div id="quill-editor"></div></div></div>
          <div class="grid grid-cols-2 gap-4"><div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Points</label><input id="item-points" type="number" min="0" value="${item.data?.points ?? 100}" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /></div><div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Due Date</label><input id="item-due" type="date" value="${toDateInput(item.data?.dueDate)}" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /></div></div>` : ''}
          ${item.type === 'link' ? `<div><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">URL</label><input id="item-url" type="url" value="${escapeHtml(item.data?.url || '')}" placeholder="https://example.com" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /></div>` : ''}
          ${item.type === 'quiz' ? `<div class="text-sm text-gray-500 italic">Quiz builder arrives in a later phase.</div>` : ''}
          <p id="item-error" class="text-red-400 text-sm hidden"></p>
        </div>
        <div class="p-8 pt-0 flex gap-3"><button id="item-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button><button id="item-save" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60">${existingItem ? 'Save Changes' : 'Create'}</button></div>
      </div>`;
      document.body.appendChild(ov);
      refreshIcons();
      let quill = null;
      if (item.type === 'page' || item.type === 'assignment') {
        const initialHtml = item.type === 'page' ? (item.data?.content || '') : (item.data?.description || '');
        quill = new Quill(ov.querySelector('#quill-editor'), { theme: 'snow', modules: { toolbar: '#quill-toolbar' } });
        if (initialHtml) quill.clipboard.dangerouslyPasteHTML(initialHtml);
      }
      const close = () => ov.remove();
      ov.querySelector('#item-close').addEventListener('click', close);
      ov.querySelector('#item-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelector('#item-save').addEventListener('click', async () => {
        const title = ov.querySelector('#item-title').value.trim();
        const err = ov.querySelector('#item-error');
        const btn = ov.querySelector('#item-save');
        err.classList.add('hidden');
        if (!title) { err.textContent = 'Enter a title.'; err.classList.remove('hidden'); return; }
        const data = {};
        if (item.type === 'page') data.content = sanitize(quill.root.innerHTML);
        else if (item.type === 'assignment') {
          data.description = sanitize(quill.root.innerHTML);
          data.points = Number(ov.querySelector('#item-points').value) || 0;
          const due = ov.querySelector('#item-due').value;
          data.dueDate = due ? new Date(due + 'T23:59:00') : null;
        } else if (item.type === 'link') {
          const url = ov.querySelector('#item-url').value.trim();
          if (!url) { err.textContent = 'Enter a URL.'; err.classList.remove('hidden'); return; }
          data.url = url;
        }
        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          if (existingItem) await updateDoc(doc(db, 'tenants', slug, 'courses', courseId, 'modules', moduleId, 'items', item.id), { title, data, updatedAt: serverTimestamp() });
          else await addDoc(collection(db, 'tenants', slug, 'courses', courseId, 'modules', moduleId, 'items'), { type: item.type, title, data, position: Date.now(), createdAt: serverTimestamp() });
          close();
        } catch(e) { console.error(e); btn.disabled = false; btn.textContent = existingItem ? 'Save Changes' : 'Create'; err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden'); }
      });
      setTimeout(() => ov.querySelector('#item-title').focus(), 50);
    }

    // ═══════════════════════════════════════════════════════════════
    // ITEM VIEW
    // ═══════════════════════════════════════════════════════════════
    async function viewItem(slug, tenant, roleInfo, courseId, moduleId, itemId) {
      render(`<div class="min-h-screen flex items-center justify-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></div>`);
      const [cSnap, iSnap] = await Promise.all([
        getDoc(doc(db, 'tenants', slug, 'courses', courseId)),
        getDoc(doc(db, 'tenants', slug, 'courses', courseId, 'modules', moduleId, 'items', itemId))
      ]);
      if (!cSnap.exists() || !iSnap.exists()) return viewNotFound();
      const course = { id: cSnap.id, ...cSnap.data() };
      const item = { id: iSnap.id, ...iSnap.data() };
      const isRealTeacher = roleInfo.role === 'teacher' || roleInfo.role === 'admin';
      const isTeacherMode = isRealTeacher && !viewAsStudent;
      const meta = ITEM_TYPES.find(t => t.type === item.type) || ITEM_TYPES[0];
      if (item.type === 'link' && item.data?.url) { window.open(item.data.url, '_blank', 'noopener'); navigate(`/${slug}/course/${courseId}`); return; }
      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'course', course)}
          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
            ${viewAsStudent ? renderPreviewBanner() : ''}
            <header class="p-8 pb-4 z-10 relative">
              <a href="${buildUrl('/' + slug + '/course/' + courseId)}" class="text-xs text-gray-500 hover:text-[#F59E0B] transition-all inline-flex items-center gap-1 mb-3"><i data-lucide="arrow-left" class="w-3 h-3"></i> Back to ${escapeHtml(course.title)}</a>
              <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center shrink-0"><i data-lucide="${meta.icon}" class="w-5 h-5 text-[#F59E0B]"></i></div><div class="min-w-0"><p class="text-[10px] uppercase tracking-wider text-gray-500 mb-0.5">${meta.label}</p><h2 class="font-serif text-2xl text-white truncate">${escapeHtml(item.title || 'Untitled')}</h2></div></div>
                <div class="flex items-center gap-3 shrink-0">
                  ${isRealTeacher ? `<button id="toggle-preview-btn" class="px-4 py-2 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all flex items-center gap-2"><i data-lucide="${viewAsStudent ? 'eye-off' : 'eye'}" class="w-4 h-4"></i> ${viewAsStudent ? 'Exit Preview' : 'View as Student'}</button>` : ''}
                  ${isTeacherMode ? `<button id="edit-item-btn" class="px-4 py-2 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all flex items-center gap-2"><i data-lucide="pencil" class="w-3.5 h-3.5"></i> Edit</button>` : ''}
                </div>
              </div>
            </header>
            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative"><div id="item-content" class="max-w-3xl">${renderItemBody(item, isTeacherMode, courseId, moduleId)}</div></div>
          </main>
        </div>`);
      attachPreviewBannerHandler();
      if (isRealTeacher) document.getElementById('toggle-preview-btn').addEventListener('click', () => setViewAsStudent(!viewAsStudent));
      if (isTeacherMode) document.getElementById('edit-item-btn').addEventListener('click', () => openItemEditor(slug, courseId, moduleId, item, item.type));
      wireItemBody(slug, courseId, moduleId, itemId, item, isTeacherMode);
    }

    function renderItemBody(item, isTeacher, courseId, moduleId) {
      if (item.type === 'page') return `<div class="prose-ember">${sanitize(item.data?.content || '<p class="text-gray-500 italic">No content yet.</p>')}</div>`;
      if (item.type === 'assignment') {
        const due = item.data?.dueDate; const points = item.data?.points ?? 0;
        return `<div class="mb-8 flex flex-wrap gap-3"><div class="px-3 py-1.5 bg-[#F59E0B]/10 border border-[#F59E0B]/20 rounded-lg text-xs text-[#F59E0B] font-medium">${points} points</div>${due ? `<div class="px-3 py-1.5 bg-white/[0.05] border border-white/[0.08] rounded-lg text-xs text-gray-400">Due ${escapeHtml(formatDateTime(due))}</div>` : ''}</div>
        <div class="prose-ember mb-8">${sanitize(item.data?.description || '<p class="text-gray-500 italic">No instructions yet.</p>')}</div>
        <div id="assignment-area">${isTeacher ? `<div class="border border-dashed border-white/10 rounded-xl p-8 text-center"><i data-lucide="inbox" class="w-8 h-8 text-gray-600 mx-auto mb-3"></i><p class="text-gray-500 text-sm">Submissions appear here once students turn in work.</p></div>` : `<div class="bg-[#141414] border border-white/[0.08] rounded-xl p-6"><h3 class="font-serif text-lg text-white mb-4">Submit your work</h3><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Your Submission</label><textarea id="submission-text" rows="6" placeholder="Type your answer…" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all font-sans"></textarea><label class="block text-xs uppercase tracking-wider text-gray-500 mb-2 mt-4">Or a link</label><input id="submission-url" type="url" placeholder="https://…" class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" /><p id="submission-error" class="text-red-400 text-sm mt-3 hidden"></p><p id="submission-success" class="text-green-400 text-sm mt-3 hidden"></p><button id="submit-assignment-btn" class="mt-4 px-5 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all">Submit Assignment</button></div>`}</div>`;
      }
      if (item.type === 'quiz') return `<div class="border border-dashed border-white/10 rounded-xl p-10 text-center"><i data-lucide="check-square" class="w-10 h-10 text-[#F59E0B] mx-auto mb-4"></i><p class="text-gray-500 text-sm">Quiz builder arrives in a later phase.</p></div>`;
      return `<p class="text-gray-500 italic">Unknown item type.</p>`;
    }
    function wireItemBody(slug, courseId, moduleId, itemId, item, isTeacher) {
      if (item.type !== 'assignment' || isTeacher) return;
      const btn = document.getElementById('submit-assignment-btn');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const content = document.getElementById('submission-text').value.trim();
        const url = document.getElementById('submission-url').value.trim();
        const err = document.getElementById('submission-error');
        const ok = document.getElementById('submission-success');
        err.classList.add('hidden'); ok.classList.add('hidden');
        if (!content && !url) { err.textContent = 'Provide text or a link.'; err.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Submitting…';
        try {
          await addDoc(collection(db, 'tenants', slug, 'courses', courseId, 'submissions'), { itemId, moduleId, studentId: currentUser.uid, studentName: currentUser.displayName || 'Student', content, url, submittedAt: serverTimestamp(), grade: null, feedback: null });
          ok.textContent = 'Submitted!'; ok.classList.remove('hidden'); btn.textContent = 'Submitted ✓';
        } catch(e) { console.error(e); btn.disabled = false; btn.textContent = 'Submit Assignment'; err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden'); }
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // SIDEBAR
    // ═══════════════════════════════════════════════════════════════
    function renderSidebar(slug, tenant, roleInfo, active, course = null) {
      const isRealTeacher = roleInfo.role === 'teacher' || roleInfo.role === 'admin';
      const isAdmin = roleInfo.role === 'admin';
      const isPersonal = tenant.type === 'personal';
      const name = currentUser.displayName || roleInfo.data.displayName || currentUser.email || 'User';
      const roleLabel = isRealTeacher && viewAsStudent ? 'Student (preview)' : (isAdmin ? 'Admin' : (isRealTeacher ? 'Teacher' : 'Student'));

      const item = (href, icon, label, key, soon = false) => {
        const isActive = active === key;
        if (soon) return `<span class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600"><i data-lucide="${icon}" class="w-4 h-4"></i> ${label} <span class="ml-auto text-[10px]">Soon</span></span>`;
        return `<a href="${buildUrl(href)}" class="flex items-center gap-3 px-3 py-2 text-sm ${isActive ? 'text-white bg-white/[0.05] border-l-2 border-[#F59E0B] rounded-r' : 'text-gray-400 hover:text-white hover:bg-white/[0.03] border-l-2 border-transparent rounded-r'} transition-all"><i data-lucide="${icon}" class="w-4 h-4 ${isActive ? 'text-[#F59E0B]' : ''}"></i> ${label}</a>`;
      };

      let navContent = '';
      if (course) {
        navContent = `
          ${item('/' + slug + '/course/' + course.id, 'layers', 'Modules', 'course')}
          ${isRealTeacher ? item('/' + slug + '/course/' + course.id + '/roster', 'users', 'Roster', 'roster') : ''}
          <div class="pt-4 mt-4 border-t border-white/[0.06]"><a href="${buildUrl('/' + slug)}" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-500 hover:text-white transition-all"><i data-lucide="arrow-left" class="w-4 h-4"></i> ${isPersonal ? 'Dashboard' : 'All Courses'}</a></div>`;
      } else if (isAdmin && !isPersonal) {
        navContent = `
          <div class="text-[10px] text-gray-600 uppercase tracking-widest px-3 mb-2">School</div>
          ${item('/' + slug, 'layout-dashboard', 'Dashboard', 'dashboard')}
          ${item('/' + slug + '/admin', 'shield-check', 'Admin', 'admin-overview')}
          <div class="text-[10px] text-gray-600 uppercase tracking-widest px-3 mt-4 mb-2">Manage</div>
          ${item('/' + slug + '/admin/students', 'users', 'Students', 'admin-students')}
          ${item('/' + slug + '/admin/teachers', 'user-cog', 'Teachers', 'admin-teachers')}
          ${item('/' + slug + '/admin/courses', 'book-open', 'Courses', 'admin-courses')}
          <div class="text-[10px] text-gray-600 uppercase tracking-widest px-3 mt-4 mb-2">Insights</div>
          ${item('/' + slug + '/admin/planning', 'clipboard-check', 'Planning', 'admin-planning', true)}
          ${item('/' + slug + '/admin/attendance', 'calendar-check', 'Attendance', 'admin-attendance', true)}`;
      } else {
        navContent = `
          ${item('/' + slug, 'layout-dashboard', 'Dashboard', 'dashboard')}
          ${isRealTeacher ? item('/' + slug + '/students', 'users', 'Students', 'students') : ''}`;
      }

      return `<aside class="w-64 bg-[#050505] border-r border-white/[0.08] p-6 flex flex-col h-screen shrink-0">
        <a href="${buildUrl('/')}" class="font-serif text-xl mb-8 block"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></a>
        <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-2">${course ? 'Course' : (isPersonal ? 'Classroom' : 'School')}</div>
        <p class="text-white text-sm mb-6 truncate">${escapeHtml(course ? course.title : tenant.name)}</p>
        <nav class="space-y-1 overflow-y-auto flex-1 -mx-1 px-1">${navContent}</nav>
        <div class="mt-4 pt-4 border-t border-white/[0.08]">
          <div class="flex items-center gap-3 mb-3">
            ${currentUser.photoURL ? `<img src="${currentUser.photoURL}" class="w-8 h-8 rounded-full border border-white/20" alt="">` : `<div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-xs text-white">${escapeHtml((name[0]||'U').toUpperCase())}</div>`}
            <div class="flex-1 min-w-0"><p class="text-sm text-white truncate">${escapeHtml(name)}</p><p class="text-xs ${viewAsStudent && isRealTeacher ? 'text-[#F59E0B]' : 'text-gray-500'} truncate">${roleLabel}</p></div>
          </div>
          <button data-signout class="w-full text-left text-xs text-gray-400 hover:text-red-400 transition-colors flex items-center gap-2"><i data-lucide="log-out" class="w-3 h-3"></i> Sign Out</button>
        </div>
      </aside>`;
    }

    document.addEventListener('click', (e) => { if (e.target.closest('[data-signout]')) signOut(auth); });

    function viewNotFound() {
      render(`<div class="min-h-screen flex items-center justify-center text-center px-6"><div><h1 class="font-serif text-3xl text-white mb-2">404</h1><p class="text-gray-500">Page not found.</p><a href="${buildUrl('/')}" class="inline-block mt-6 text-sm text-[#F59E0B] hover:underline">← Back</a></div></div>`);
    }

    // ═══════════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════════
    async function renderRoute() {
      if (!authReady) return;
      clearSubs();
      const route = parseRoute();
      try {
        switch (route.type) {
          case 'landing': viewLanding(); break;
          case 'login':   viewLogin(); break;
          case 'signup':  viewSignup(); break;
          case 'district': await viewDistrict(route.segments[0], route.segments.slice(1)); break;
          case 'tenant':  await viewTenant(route.tenant, route.segments); break;
          default:        viewNotFound();
        }
      } catch (e) {
        console.error('Render failed:', e);
        render(`<div class="min-h-screen flex items-center justify-center text-red-400 p-6 text-center">Error:<br>${escapeHtml(e.message)}</div>`);
      }
    }

    render(`<div class="min-h-screen flex items-center justify-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></div>`);
    refreshIcons();

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      authReady = true;
      if (suppressAuthRouting) return;
      const route = parseRoute();
      if (user && route.type === 'landing') {
        try {
          const dest = await resolveDestinationForUser(user);
          if (dest && dest !== '/signup' && dest !== '/login' && dest !== '/') {
            navigate(dest); return;
          }
        } catch (e) { console.warn('Redirect check failed', e); }
      }
      renderRoute();
    });
  </script>
</body>
</html>
