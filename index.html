<body class="bg-[#0A0A0A] text-[#EDEDED] font-sans antialiased">
  <div id="app"></div>

  <script type="module">
    const BASE_PATH = '/emberlms';
    const RESERVED = ['login','signup','picker','onboard','api','assets','district'];
    const GRADIENTS = ['grad-amber','grad-violet','grad-teal','grad-rose','grad-blue','grad-emerald'];
    const ITEM_TYPES = [
      { type:'page',       label:'Page',       icon:'file-text',      desc:'Rich text content' },
      { type:'assignment', label:'Assignment', icon:'clipboard-list', desc:'Collect student work' },
      { type:'link',       label:'Link',       icon:'link',           desc:'External resource' },
      { type:'quiz',       label:'Quiz',       icon:'check-square',   desc:'Auto-graded questions' },
    ];

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup,
      signInWithEmailAndPassword, createUserWithEmailAndPassword,
      signOut, onAuthStateChanged, sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
      collection, collectionGroup, query, where, orderBy, limit,
      onSnapshot, getDocs, serverTimestamp, arrayUnion, arrayRemove
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHMgZklzO2Uu7v8Lm248DuU4QJ2RaCp44",
      authDomain: "ember-lms.firebaseapp.com",
      projectId: "ember-lms",
      storageBucket: "ember-lms.firebasestorage.app",
      messagingSenderId: "198763545245",
      appId: "1:198763545245:web:58b4d76df1181600fd0a74"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const secondaryApp = initializeApp(firebaseConfig, "Secondary");
    const secondaryAuth = getAuth(secondaryApp);

    function getAppSegments() {
      let p = decodeURIComponent(window.location.pathname);
      if (BASE_PATH && p.startsWith(BASE_PATH)) p = p.slice(BASE_PATH.length);
      return p.split('/').filter(Boolean);
    }
    function buildUrl(rel = '/') {
      const c = rel.startsWith('/') ? rel : '/' + rel;
      const j = (BASE_PATH + c).replace(/\/+/g, '/').replace(/\/$/, '');
      return j || '/';
    }
    function navigate(path) { window.location.href = buildUrl(path); }
    function parseRoute() {
      const sp = sessionStorage.getItem('ember_redirect_path');
      if (sp) { sessionStorage.removeItem('ember_redirect_path'); try { window.history.replaceState(null, '', sp); } catch(e){} }
      const segs = getAppSegments();
      if (segs.length === 0) return { type:'landing', tenant:null, segments:[] };
      const first = segs[0];
      if (RESERVED.includes(first)) return { type: first, tenant:null, segments: segs.slice(1) };
      return { type: 'tenant', tenant: first, segments: segs.slice(1) };
    }

    const appEl = document.getElementById('app');
    function refreshIcons() { if (window.lucide) window.lucide.createIcons(); }
    function render(html) { appEl.innerHTML = html; refreshIcons(); }
    function slugify(s) { return String(s||'').toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''); }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function pickGradient(seed) {
      const s = String(seed||''); let h = 0;
      for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))|0;
      return GRADIENTS[Math.abs(h) % GRADIENTS.length];
    }
    function formatDate(ts) { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
    function formatDateTime(ts) { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
    function toDateInput(ts) { if (!ts) return ''; const d = ts.toDate ? ts.toDate() : new Date(ts); if (isNaN(d)) return ''; const pad = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
    function sanitize(html) { return window.DOMPurify ? DOMPurify.sanitize(html || '') : (html || ''); }
    function genPassword() { const w = ['ember','flame','glow','spark','warm','light','sun','dusk','ash','coal','pine','river']; return w[Math.floor(Math.random()*w.length)] + Math.floor(Math.random()*9000 + 1000); }
    function genCode() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let o = ''; for (let i=0;i<6;i++) o += c[Math.floor(Math.random()*c.length)]; return o; }
    function genUsername(first, last, existing = []) {
      const base = (slugify(first + (last ? last[0] : '')) || 'student').replace(/-/g,'_').slice(0,18);
      let c = base, i = 1;
      while (existing.includes(c)) { c = base + i; i++; }
      return c;
    }
    function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
    function initials(name) { return String(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

    let currentUser = null;
    let authReady = false;
    let unsubs = [];
    let viewAsStudent = sessionStorage.getItem('ember_view_as_student') === '1';
    let signupWizard = null;
    let suppressAuthRouting = false;
    function clearSubs() { unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; }
    function setViewAsStudent(val) {
      viewAsStudent = val;
      sessionStorage.setItem('ember_view_as_student', val ? '1' : '0');
      renderRoute();
    }

    async function getTenant(slug) { const s = await getDoc(doc(db, 'tenants', slug)); return s.exists() ? { id: s.id, ...s.data() } : null; }
    async function getRoleInTenant(slug, uid) {
      if (!uid) return null;
      try {
        const t = await getDoc(doc(db, 'tenants', slug, 'users', uid));
        if (t.exists()) return { role: t.data().role === 'admin' ? 'admin' : 'teacher', data: t.data() };
        const s = await getDoc(doc(db, 'tenants', slug, 'students', uid));
        if (s.exists()) return { role: 'student', data: s.data() };
      } catch(e) { console.error(e); }
      return null;
    }
    async function searchSchools(q) {
      const schools = [];
      const snap = await getDocs(query(collection(db, 'tenants'), where('type', '==', 'school')));
      const ql = q.toLowerCase();
      snap.forEach(d => {
        const s = d.data();
        if (!ql || s.name.toLowerCase().includes(ql) || d.id.includes(ql)) {
          schools.push({ slug: d.id, name: s.name, districtId: s.districtId || null });
        }
      });
      return schools.slice(0, 20);
    }
    async function maybeMigrateTenant(tenantSnap, userDocId, userDocData) {
      const data = tenantSnap.data();
      const updates = {};
      if (!data.type) updates.type = 'school';
      if (!data.joinCode) updates.joinCode = genCode();
      if (Object.keys(updates).length) { try { await updateDoc(tenantSnap.ref, updates); } catch(e) {} }
      if (data.ownerUid === userDocId && userDocData.role !== 'admin') {
        try { await updateDoc(doc(db, 'tenants', tenantSnap.id, 'users', userDocId), { role: 'admin' }); } catch(e) {}
      }
    }

    async function resolveDestinationForUser(user) {
      if (!user) return null;
      try {
        const dSnap = await getDocs(query(collection(db, 'districts'), where('adminUids', 'array-contains', user.uid), limit(1)));
        if (!dSnap.empty) return `/district/${dSnap.docs[0].id}`;
      } catch(e) { console.warn('district lookup failed', e); }
      try {
        const tSnap = await getDocs(query(collectionGroup(db, 'users'), where('userId', '==', user.uid), limit(2)));
        if (!tSnap.empty) {
          const first = tSnap.docs[0];
          const tenantRef = first.ref.parent.parent;
          const tenantSnap = await getDoc(tenantRef);
          if (tenantSnap.exists()) await maybeMigrateTenant(tenantSnap, first.id, first.data());
          return `/${tenantRef.id}`;
        }
        if (user.email) {
          const byEmail = await getDocs(query(collectionGroup(db, 'users'), where('email', '==', user.email), limit(2)));
          if (!byEmail.empty) {
            const first = byEmail.docs[0];
            const tenantRef = first.ref.parent.parent;
            const tenantSnap = await getDoc(tenantRef);
            if (tenantSnap.exists()) await maybeMigrateTenant(tenantSnap, first.id, first.data());
            return `/${tenantRef.id}`;
          }
        }
      } catch(e) { console.warn('teacher lookup failed', e); }
      if (user.email) {
        try {
          const sSnap = await getDocs(query(collectionGroup(db, 'students'), where('email', '==', user.email), limit(1)));
          if (!sSnap.empty) {
            const first = sSnap.docs[0];
            const tenantRef = first.ref.parent.parent;
            const status = first.data().status;
            if (status === 'approved') return `/${tenantRef.id}`;
            if (status === 'pending')  return `/${tenantRef.id}/pending`;
            return `/${tenantRef.id}/rejected`;
          }
        } catch(e) { console.warn('student lookup failed', e); }
      }
      return null;
    }

    // ═══════════════════════════════════════════════════════════════

    // ═══════════════════════════════════════════════════════════════
    function viewLanding() {
      const signedIn = !!currentUser;
      render(`
        <div class="min-h-screen relative overflow-hidden">
          <nav class="relative z-20 max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
            <a href="${buildUrl('/')}" class="font-serif text-xl"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></a>
            <div class="flex items-center gap-3 text-sm">
              ${signedIn ? `
                <span class="hidden sm:inline text-xs text-gray-500 truncate max-w-[180px]">${escapeHtml(currentUser.email || '')}</span>
                <button id="landing-signout" class="px-4 py-2 text-gray-300 hover:text-white transition-all">Sign out</button>

              `}
            </div>
          </nav>
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[700px] rounded-full bg-[#F59E0B]/10 blur-[160px] pointer-events-none"></div>
          <div class="absolute top-40 right-0 w-[500px] h-[500px] rounded-full bg-[#8B5CF6]/10 blur-[140px] pointer-events-none"></div>
          <section class="relative z-10 max-w-5xl mx-auto px-6 pt-16 pb-24 text-center">
            <p class="text-xs text-[#F59E0B] uppercase tracking-[0.3em] mb-6">Built for teachers</p>
            <h1 class="font-serif text-6xl md:text-7xl text-white leading-[1.05] mb-6">Teaching,<br><span class="italic text-[#F59E0B]">refined.</span></h1>
            <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto mb-10 leading-relaxed">A modern learning platform for schools, districts, and independent teachers.</p>
            <div class="flex flex-wrap items-center justify-center gap-4">
              ${signedIn ? `
                <button id="landing-goto-2" class="px-6 py-3.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_25px_rgba(245,158,11,0.25)] hover:shadow-[0_0_40px_rgba(245,158,11,0.45)] hover:brightness-110 transition-all">Go to my account</button>
                <a href="${buildUrl('/signup')}" class="px-6 py-3.5 bg-white/[0.04] border border-white/10 text-white font-medium rounded-lg hover:bg-white/[0.08] transition-all">Create another account</a>
              ` : `
                <a href="${buildUrl('/signup')}" class="px-6 py-3.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_25px_rgba(245,158,11,0.25)] hover:shadow-[0_0_40px_rgba(245,158,11,0.45)] hover:brightness-110 transition-all">Get started — free</a>
                <a href="${buildUrl('/login')}" class="px-6 py-3.5 bg-white/[0.04] border border-white/10 text-white font-medium rounded-lg hover:bg-white/[0.08] transition-all">Sign in</a>
              `}
            </div>
            <p class="text-xs text-gray-600 mt-6">No credit card. No setup fees.</p>
          </section>
          <section class="relative z-10 max-w-6xl mx-auto px-6 pb-24">
            <div class="grid md:grid-cols-3 gap-6">
              ${[
                { icon:'layers', title:'Modules & Items', desc:'Pages, assignments, links, and quizzes — organized into clean modules.' },
                { icon:'users', title:'Student Accounts', desc:'Create usernames and passwords. No emails required.' },
                { icon:'building-2', title:'Schools & Districts', desc:'District admins oversee multiple schools. School admins oversee their teachers.' },
                { icon:'clipboard-check', title:'Planning Reviews', desc:'Teachers submit lesson plans. Admins review and comment.' },
                { icon:'calendar-check', title:'Attendance', desc:'Take attendance per course, per day. Admins see aggregated rates.' },
                { icon:'lock', title:'Yours, isolated', desc:'Each school gets its own URL. Data never crosses tenants.' }
              ].map(f => `
                <div class="bg-[#141414] border border-white/[0.08] rounded-xl p-6 hover:border-white/20 hover:-translate-y-0.5 transition-all">
                  <div class="w-10 h-10 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center mb-4"><i data-lucide="${f.icon}" class="w-5 h-5 text-[#F59E0B]"></i></div>
                  <h3 class="font-serif text-xl text-white mb-2">${f.title}</h3>
                  <p class="text-sm text-gray-500 leading-relaxed">${f.desc}</p>
                </div>`).join('')}
            </div>
          </section>
          <footer class="relative z-10 border-t border-white/[0.06] py-8">
            <div class="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-gray-600">
              <div class="font-serif"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></div>
              <div>© ${new Date().getFullYear()} Ember LMS</div>
            </div>
          </footer>
        </div>`);
      const goto = async () => {
        if (!currentUser) return navigate('/login');
        const dest = await resolveDestinationForUser(currentUser);
        if (dest && dest !== '/signup' && dest !== '/login') navigate(dest);
        else navigate('/signup');
      };
      ['landing-goto','landing-goto-2'].forEach(id => {
        const b = document.getElementById(id);
        if (b) b.addEventListener('click', goto);
      });
      const so = document.getElementById('landing-signout');
      if (so) so.addEventListener('click', () => signOut(auth));
    }

        function viewLogin() {
      const params = new URLSearchParams(window.location.search);
      let mode = params.get('as') === 'student' ? 'student' : 'staff';
      const preselectFromUrl = params.get('school');

      // These live OUTSIDE renderLogin so they survive re-renders.

      let preselectedLoaded = false;

                  <p class="text-xs text-[#F59E0B] uppercase tracking-widest mb-4">Welcome back</p>
                  <h1 class="font-serif text-5xl text-white leading-tight mb-4">Teaching,<br><span class="italic text-[#F59E0B]">refined.</span></h1>
                  <p class="text-gray-500 text-base max-w-md">Sign in to your school, district, or personal classroom.</p>
                </div>
                <div class="text-xs text-gray-700">© ${new Date().getFullYear()} Ember LMS</div>
              </div>
            </div>
            <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12 bg-[#0A0A0A] overflow-y-auto">
              <div class="max-w-sm w-full py-8">
                <div class="lg:hidden mb-8 text-center">
                  <a href="${buildUrl('/')}" class="font-serif text-2xl"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></a>

                <h2 class="font-serif text-3xl text-white mb-1">Sign in</h2>
                <p class="text-gray-500 text-sm mb-6">Choose how you'd like to sign in.</p>
                ${currentUser ? `
                  <div class="mb-6 p-4 bg-[#F59E0B]/10 border border-[#F59E0B]/20 rounded-lg">
                    <p class="text-[10px] text-[#F59E0B] uppercase tracking-wider mb-1">Already signed in</p>
                    <p class="text-sm text-white mb-1 truncate">${escapeHtml(currentUser.email || currentUser.displayName || '')}</p>

    async function viewDistrict(districtId, segs = []) {
      const dSnap = await getDoc(doc(db, 'districts', districtId));
      if (!dSnap.exists()) return viewNotFound();
      const district = { id: dSnap.id, ...dSnap.data() };

      if (!currentUser) return navigate('/login');
      if (!(district.adminUids || []).includes(currentUser.uid)) {
        return render(`<div class="min-h-screen flex items-center justify-center text-center px-6"><div class="max-w-md">
          <h1 class="font-serif text-3xl text-white mb-2">Access denied</h1>
          <p class="text-gray-500 mb-8">You are not a district administrator for this district.</p>
          <button data-signout class="px-5 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Sign out</button>
        </div></div>`);
      }

      const sub = segs[0] || 'overview';
      if (sub === 'schools') return viewDistrictSchools(districtId, district);
      if (sub === 'teachers') return viewDistrictTeachers(districtId, district);
      if (sub === 'planning') return viewDistrictStub(districtId, district, 'planning');
      if (sub === 'attendance') return viewDistrictStub(districtId, district, 'attendance');
      return viewDistrictOverview(districtId, district);
    }

    // Fetch all schools in a district + aggregate counts
    async function getDistrictSchools(districtId) {
      const snap = await getDocs(query(collection(db, 'tenants'), where('districtId', '==', districtId)));
      const schools = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      // Fetch counts per school in parallel
      await Promise.all(schools.map(async (s) => {
        try {
          const [teachersSnap, studentsSnap, coursesSnap] = await Promise.all([
            getDocs(collection(db, 'tenants', s.id, 'users')),
            getDocs(query(collection(db, 'tenants', s.id, 'students'), where('status', '==', 'approved'))),
            getDocs(collection(db, 'tenants', s.id, 'courses'))
          ]);
          s._teacherCount = teachersSnap.size;
          s._studentCount = studentsSnap.size;
          s._courseCount = coursesSnap.size;
        } catch(e) {
          s._teacherCount = 0; s._studentCount = 0; s._courseCount = 0;
        }
      }));
      return schools;
    }

    function openCreateSchoolModal(districtId, district) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">

          <div class="flex items-center bg-white/[0.03] border border-white/10 rounded-lg mb-4 focus-within:border-[#8B5CF6] transition-all">
            <span class="text-gray-500 text-xs pl-4 select-none">/${escapeHtml(BASE_PATH.replace(/^\//, ''))}/</span>
            <input id="school-slug" type="text" placeholder="lincoln-high" autocomplete="off" class="flex-1 bg-transparent px-2 py-3 text-white focus:outline-none" />
          </div>
          <div class="mb-6 p-3 bg-[#8B5CF6]/5 border border-[#8B5CF6]/20 rounded-lg">
            <p class="text-xs text-gray-400 leading-relaxed">You will automatically become the school admin of this school. A join code will be generated for teachers to join.</p>
          </div>
          <p id="create-error" class="text-red-400 text-sm mb-4 hidden"></p>
          <div class="flex gap-3">
            <button id="create-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
            <button id="create-submit" class="flex-1 py-2.5 bg-gradient-to-r from-[#8B5CF6] to-[#7C3AED] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60">Create School</button>
          </div>
        </div>`;
      document.body.appendChild(ov);
      refreshIcons();

      const nameEl = ov.querySelector('#school-name');
      const slugEl = ov.querySelector('#school-slug');
      nameEl.addEventListener('input', () => { if (!slugEl.dataset.touched) slugEl.value = slugify(nameEl.value); });
      slugEl.addEventListener('input', () => { slugEl.dataset.touched = '1'; });
      setTimeout(() => nameEl.focus(), 50);

      const close = () => ov.remove();
      ov.querySelector('#create-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });

      ov.querySelector('#create-submit').addEventListener('click', async () => {
        const name = nameEl.value.trim();
        const slug = slugEl.value.trim().toLowerCase();
        const err = ov.querySelector('#create-error');
        const btn = ov.querySelector('#create-submit');
        err.classList.add('hidden');
        if (!name) { err.textContent = 'Enter a school name.'; err.classList.remove('hidden'); return; }
        if (!/^[a-z0-9-]{3,30}$/.test(slug)) { err.textContent = 'URL must be 3–30 chars: lowercase, numbers, hyphens.'; err.classList.remove('hidden'); return; }
        if (RESERVED.includes(slug)) { err.textContent = 'That URL is reserved.'; err.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          const ex = await getDoc(doc(db, 'tenants', slug));
          if (ex.exists()) { btn.disabled = false; btn.textContent = 'Create School'; err.textContent = 'That URL is already taken.'; err.classList.remove('hidden'); return; }
          await setDoc(doc(db, 'tenants', slug), {
            type: 'school', name, slug,
            districtId,
            joinCode: genCode(),
            ownerUid: currentUser.uid,
            createdAt: serverTimestamp()
          });
          await setDoc(doc(db, 'tenants', slug, 'users', currentUser.uid), {
            userId: currentUser.uid, role: 'admin',
            email: currentUser.email || '',
            displayName: currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : 'Admin'),
            photoURL: currentUser.photoURL || null,
            createdAt: serverTimestamp()
          });
          close();
          renderRoute();
        } catch (e) {
          console.error(e); btn.disabled = false; btn.textContent = 'Create School';
          err.textContent = 'Failed: ' + (e.message || e.code); err.classList.remove('hidden');
        }
      });
    }

    async function viewTenant(slug, segs) {
      render(`<div class="min-h-screen flex items-center justify-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></div>`);
      const tenant = await getTenant(slug);
      if (!tenant) return viewTenantNotFound(slug);
      if (!currentUser) { navigate('/login?school=' + slug + '&as=student'); return; }
      const roleInfo = await getRoleInTenant(slug, currentUser.uid);
      if (roleInfo && roleInfo.role === 'student') {
        if (roleInfo.data.status === 'pending') return viewPending(slug, tenant);
        if (roleInfo.data.status === 'rejected') return viewRejected(slug, tenant);
      }
      if (!roleInfo) return viewNoAccess(slug, tenant);

      const sub = segs[0] || 'dashboard';
      if (sub === 'pending') return viewPending(slug, tenant);
      if (sub === 'rejected') return viewRejected(slug, tenant);
      if (sub === 'admin') {
        const adminSub = segs[1];
        if (adminSub === 'teachers') return viewAdminTeachers(slug, tenant, roleInfo);
        if (adminSub === 'students') return viewStudents(slug, tenant, roleInfo);
        if (adminSub === 'courses') return viewAdminCourses(slug, tenant, roleInfo);
        if (adminSub === 'planning') return viewAdminStubPage(slug, tenant, roleInfo, 'planning');
        if (adminSub === 'attendance') return viewAdminStubPage(slug, tenant, roleInfo, 'attendance');
        return viewAdminOverview(slug, tenant, roleInfo);
      }
      if (sub === 'students') return viewStudents(slug, tenant, roleInfo);
      if (sub === 'course' && segs[1]) {
        if (segs[2] === 'roster') return viewCourseRoster(slug, tenant, roleInfo, segs[1]);
        if (segs[2] === 'item' && segs[3] && segs[4]) return viewItem(slug, tenant, roleInfo, segs[1], segs[3], segs[4]);
        return viewCourse(slug, tenant, roleInfo, segs[1]);
      }
      return viewDashboard(slug, tenant, roleInfo);
    }

    async function viewAdminTeachers(slug, tenant, roleInfo) {
      if (roleInfo.role !== 'admin') return viewNotFound();
      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'admin-teachers')}
          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>

                <h2 class="font-serif text-3xl text-white mb-1">Teachers</h2>
                <p class="text-xs text-gray-500">${escapeHtml(tenant.name)}</p>

              </div>
            </div>
          </main>
        </div>`);

      document.getElementById('invite-teacher-btn').addEventListener('click', () => openInviteTeacherModal(slug, tenant));

      try {
        const [teachersSnap, coursesSnap] = await Promise.all([
          getDocs(collection(db, 'tenants', slug, 'users')),
          getDocs(collection(db, 'tenants', slug, 'courses'))
        ]);
        const courses = coursesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        const el = document.getElementById('teachers-list');

        if (teachersSnap.empty) {
          el.innerHTML = `<div class="border border-dashed border-white/10 rounded-xl p-10 text-center">
            <i data-lucide="user-cog" class="w-10 h-10 text-gray-600 mx-auto mb-4"></i>
            <h3 class="font-serif text-xl text-white mb-2">No teachers yet</h3>
            <p class="text-gray-500 text-sm">Share your join code or invite teachers individually.</p>
          </div>`;
          refreshIcons(); return;
        }

        el.innerHTML = `
          <div class="bg-[#141414] border border-white/[0.08] rounded-xl overflow-hidden">
            <div class="grid grid-cols-12 px-5 py-3 border-b border-white/[0.06] text-[10px] uppercase tracking-wider text-gray-500">
              <div class="col-span-5">Name</div>
              <div class="col-span-3">Role</div>
              <div class="col-span-2">Courses</div>
              <div class="col-span-2 text-right">Actions</div>
            </div>
            <div class="divide-y divide-white/[0.04]">
              ${teachersSnap.docs.map(d => {
                const t = d.data();
                const uid = d.id;
                const isAdmin = t.role === 'admin';
                const ownCourses = courses.filter(c => c.ownerUid === uid).length;
                const name = t.displayName || (t.email ? t.email.split('@')[0] : 'Teacher');
                const email = t.email || '';
                const isSelf = uid === currentUser.uid;
                return `<div class="grid grid-cols-12 px-5 py-3 items-center hover:bg-white/[0.02] group transition-all">
                  <div class="col-span-5 flex items-center gap-3 min-w-0">
                    ${t.photoURL
                      ? `<img src="${t.photoURL}" class="w-8 h-8 rounded-full border border-white/20 shrink-0" alt="">`
                      : `<div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-[10px] text-white shrink-0">${escapeHtml(initials(name))}</div>`}
                    <div class="min-w-0">
                      <div class="text-sm text-white truncate">${escapeHtml(name)} ${isSelf ? '<span class="text-[10px] text-[#F59E0B] ml-1">You</span>' : ''}</div>
                      <div class="text-xs text-gray-500 truncate">${escapeHtml(email)}</div>
                    </div>
                  </div>
                  <div class="col-span-3">
                    <span class="px-2 py-1 text-[10px] uppercase tracking-wider rounded ${isAdmin ? 'bg-[#8B5CF6]/15 text-[#8B5CF6] border border-[#8B5CF6]/30' : 'bg-white/[0.04] text-gray-400 border border-white/10'}">${isAdmin ? 'Admin' : 'Teacher'}</span>
                  </div>
                  <div class="col-span-2 text-xs text-gray-500">${ownCourses} course${ownCourses === 1 ? '' : 's'}</div>
                  <div class="col-span-2 flex justify-end gap-1">
                    ${!isSelf ? `
                      <button data-toggle-role data-id="${uid}" data-role="${isAdmin ? 'admin' : 'teacher'}" data-name="${escapeHtml(name)}" title="${isAdmin ? 'Demote to Teacher' : 'Promote to Admin'}"
                        class="p-1.5 text-gray-500 hover:text-[#F59E0B] opacity-0 group-hover:opacity-100 transition-all">
                        <i data-lucide="${isAdmin ? 'shield-off' : 'shield-check'}" class="w-3.5 h-3.5"></i>
                      </button>
                      <button data-remove-teacher data-id="${uid}" data-name="${escapeHtml(name)}" title="Remove from school"
                        class="p-1.5 text-gray-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    ` : `<span class="text-[10px] text-gray-600">—</span>`}
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>`;
        refreshIcons();

        el.querySelectorAll('[data-toggle-role]').forEach(btn => btn.addEventListener('click', async () => {
          const uid = btn.dataset.id;
          const currentRole = btn.dataset.role;
          const name = btn.dataset.name;
          const newRole = currentRole === 'admin' ? 'teacher' : 'admin';
          const verb = newRole === 'admin' ? 'promote' : 'demote';
          if (!confirm(`${verb.charAt(0).toUpperCase() + verb.slice(1)} ${name} to ${newRole}?`)) return;
          try {
            await updateDoc(doc(db, 'tenants', slug, 'users', uid), { role: newRole });
            renderRoute();
          } catch (e) { alert('Failed: ' + e.message); }
        }));

        el.querySelectorAll('[data-remove-teacher]').forEach(btn => btn.addEventListener('click', async () => {
          const uid = btn.dataset.id;
          const name = btn.dataset.name;
          if (!confirm(`Remove ${name} from this school? Their courses will remain but they will lose access.`)) return;
          try {
            await deleteDoc(doc(db, 'tenants', slug, 'users', uid));
            renderRoute();
          } catch (e) { alert('Failed: ' + e.message); }
        }));
      } catch (e) {
        console.error(e);
        const el = document.getElementById('teachers-list');
        if (el) el.innerHTML = `<div class="text-red-400 text-sm p-6">Failed to load teachers: ${escapeHtml(e.message)}</div>`;
      }
    }

    function openInviteTeacherModal(slug, tenant) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
          <h3 class="font-serif text-2xl text-white mb-1">Invite Teachers</h3>
          <p class="text-gray-500 text-sm mb-6">Share this code with teachers so they can join <span class="text-white">${escapeHtml(tenant.name)}</span>.</p>

          <div class="bg-[#0A0A0A] border border-white/[0.08] rounded-xl p-5 mb-6 text-center">
            <p class="text-[10px] uppercase tracking-wider text-gray-500 mb-3">Join Code</p>
            <code id="invite-code" class="text-3xl font-mono text-[#F59E0B] tracking-[0.3em] block">${escapeHtml(tenant.joinCode || '——')}</code>
          </div>

          <div class="space-y-2 mb-6">
            <p class="text-xs text-gray-500 leading-relaxed">Teachers visit <span class="text-[#F59E0B]">${escapeHtml(window.location.origin + buildUrl('/signup'))}</span>, choose <span class="text-white">Teacher</span> → <span class="text-white">Join my school</span>, and enter the code above.</p>
          </div>

          <div class="flex gap-3">
            <button id="invite-copy" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all flex items-center justify-center gap-2">
              <i data-lucide="copy" class="w-4 h-4"></i> Copy code
            </button>
            <button id="invite-close" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all">Done</button>
          </div>
        </div>`;
      document.body.appendChild(ov);
      refreshIcons();
      const close = () => ov.remove();
      ov.querySelector('#invite-close').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelector('#invite-copy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(tenant.joinCode || '');
          ov.querySelector('#invite-copy').innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Copied!';
          refreshIcons();
          setTimeout(() => {
            ov.querySelector('#invite-copy').innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i> Copy code';
            refreshIcons();
          }, 2000);
        } catch(e) { prompt('Copy:', tenant.joinCode || ''); }
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // ADMIN — COURSES
    // ═══════════════════════════════════════════════════════════════
    async function viewAdminCourses(slug, tenant, roleInfo) {
      if (roleInfo.role !== 'admin') return viewNotFound();
      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'admin-courses')}
          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
            <header class="p-8 pb-4 z-10 relative">
              <p class="text-xs text-[#F59E0B] uppercase tracking-widest mb-2">Admin</p>
              <h2 class="font-serif text-3xl text-white mb-1">Courses</h2>
              <p class="text-xs text-gray-500">All courses in ${escapeHtml(tenant.name)}</p>
            </header>
            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div id="courses-list" class="max-w-5xl">
                <div class="text-center py-20 text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i></div>
              </div>
            </div>
          </main>
        </div>`);

      try {
        const [coursesSnap, teachersSnap] = await Promise.all([
          getDocs(query(collection(db, 'tenants', slug, 'courses'), orderBy('createdAt', 'desc'))),
          getDocs(collection(db, 'tenants', slug, 'users'))
        ]);
        const teachersByUid = {};
        teachersSnap.docs.forEach(d => { teachersByUid[d.id] = d.data(); });
        const el = document.getElementById('courses-list');

        if (coursesSnap.empty) {
          el.innerHTML = `<div class="border border-dashed border-white/10 rounded-xl p-10 text-center">
            <i data-lucide="book-open" class="w-10 h-10 text-gray-600 mx-auto mb-4"></i>
            <h3 class="font-serif text-xl text-white mb-2">No courses yet</h3>
            <p class="text-gray-500 text-sm">Teachers create courses from their dashboard.</p>
          </div>`;
          refreshIcons(); return;
        }

        // Compute enrollment counts per course
        const enrollCounts = {};
        await Promise.all(coursesSnap.docs.map(async d => {
          try {
            const enr = await getDocs(collection(db, 'tenants', slug, 'courses', d.id, 'enrollments'));
            enrollCounts[d.id] = enr.size;
          } catch(e) { enrollCounts[d.id] = 0; }
        }));

        el.innerHTML = `
          <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
            ${coursesSnap.docs.map(d => {
              const c = d.data();
              const grad = c.gradient || pickGradient(c.title);
              const teacher = teachersByUid[c.ownerUid];
              const teacherName = teacher ? (teacher.displayName || (teacher.email ? teacher.email.split('@')[0] : 'Teacher')) : 'Unknown';
              const enrolled = enrollCounts[d.id] || 0;
              return `<div class="bg-[#141414] border border-white/[0.08] rounded-xl overflow-hidden hover:border-white/20 hover:-translate-y-0.5 transition-all group">
                <div class="${grad} h-20 relative">
                  <a href="${buildUrl('/' + slug + '/course/' + d.id)}" class="absolute inset-0" aria-label="Open course"></a>
                </div>
                <div class="p-5">
                  <p class="text-xs text-gray-500 mb-1 truncate">${escapeHtml(c.code || '')}</p>
                  <a href="${buildUrl('/' + slug + '/course/' + d.id)}" class="block font-serif text-lg text-white mb-3 hover:text-[#F59E0B] transition-colors truncate">${escapeHtml(c.title || 'Untitled')}</a>
                  <div class="flex items-center gap-2 mb-3">
                    <div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-[10px] text-white shrink-0">${escapeHtml(initials(teacherName))}</div>
                    <span class="text-xs text-gray-400 truncate">${escapeHtml(teacherName)}</span>
                  </div>
                  <div class="flex justify-between items-center text-xs text-gray-500">
                    <span>${enrolled} student${enrolled === 1 ? '' : 's'}</span>
                    <a href="${buildUrl('/' + slug + '/course/' + d.id + '/roster')}" class="hover:text-[#F59E0B] transition-colors">Roster →</a>
                  </div>
                </div>
              </div>`;
            }).join('')}
          </div>`;
        refreshIcons();
      } catch (e) {
        console.error(e);
        const el = document.getElementById('courses-list');
        if (el) el.innerHTML = `<div class="text-red-400 text-sm p-6">Failed to load courses: ${escapeHtml(e.message)}</div>`;
      }
    }
