<!DOCTYPE html>
<html lang="en">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
    .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4,0,0.2,1); transition-duration: 200ms; }
    .input-glow:focus { outline: none; border-color: #8B5CF6; box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }

    .grad-amber  { background: linear-gradient(135deg, #F59E0B, #EA580C); }
    .grad-violet { background: linear-gradient(135deg, #8B5CF6, #7C3AED); }
    .grad-teal   { background: linear-gradient(135deg, #14B8A6, #0891B2); }
    .grad-rose   { background: linear-gradient(135deg, #F43F5E, #DB2777); }
    .grad-blue   { background: linear-gradient(135deg, #3B82F6, #4F46E5); }
    .grad-emerald{ background: linear-gradient(135deg, #10B981, #059669); }
    .modal-overlay { backdrop-filter: blur(6px); }

    /* Quill dark theme overrides */
    .ql-toolbar.ql-snow { border: none !important; border-bottom: 1px solid rgba(255,255,255,0.08) !important; padding: 8px 0 !important; }

    .ql-editor { color: #EDEDED !important; min-height: 200px; padding: 16px 0 !important; line-height: 1.7; }

    .ql-snow .ql-stroke { stroke: #888 !important; }
    .ql-snow .ql-fill { fill: #888 !important; }
    .ql-snow .ql-picker { color: #888 !important; }
    .ql-snow .ql-picker-options { background: #141414 !important; border-color: rgba(255,255,255,0.08) !important; }
    .ql-snow .ql-picker-item { color: #888 !important; }
    .ql-snow .ql-active .ql-stroke, .ql-snow .ql-active .ql-fill { stroke: #F59E0B !important; fill: #F59E0B !important; }
    .ql-snow .ql-active .ql-picker-label { color: #F59E0B !important; }
    .ql-snow .ql-picker-label:hover, .ql-snow .ql-picker-item:hover { color: #F59E0B !important; }
    .ql-snow .ql-tooltip { background: #141414 !important; border-color: rgba(255,255,255,0.08) !important; color: #EDEDED !important; }
    .ql-snow .ql-tooltip input[type=text] { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; color: #EDEDED !important; }
    .ql-snow .ql-tooltip a { color: #F59E0B !important; }

    /* Rendered content (student reading view) */
    .prose-ember h1 { font-family: 'Playfair Display', serif; font-size: 1.75rem; color: #fff; margin: 1rem 0 0.5rem; }
    .prose-ember h2 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #fff; margin: 1rem 0 0.5rem; }
    .prose-ember h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: #fff; margin: 0.75rem 0 0.4rem; }
    .prose-ember p { margin: 0.5rem 0; line-height: 1.75; color: #D4D4D4; }
    .prose-ember a { color: #F59E0B; text-decoration: underline; }
    .prose-ember ul, .prose-ember ol { margin: 0.5rem 0; padding-left: 1.5rem; color: #D4D4D4; }
    .prose-ember li { margin: 0.25rem 0; }
    .prose-ember blockquote { border-left: 3px solid #F59E0B; padding-left: 1rem; margin: 0.75rem 0; color: #A3A3A3; font-style: italic; }
    .prose-ember code { background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; font-size: 0.9em; color: #F59E0B; }
    .prose-ember img { max-width: 100%; border-radius: 8px; margin: 1rem 0; }
  </style>
</head>
<body class="bg-[#0A0A0A] text-[#EDEDED] font-sans antialiased">
  <div id="app"></div>

  <script type="module">
    // ═══════════════════════════════════════════════════════════════════
    // ⚙️  CONFIG
    // ═══════════════════════════════════════════════════════════════════
    const BASE_PATH = '/emberlms';
    const RESERVED = ['onboard', 'login', 'signup', 'api', 'assets'];
    const GRADIENTS = ['grad-amber','grad-violet','grad-teal','grad-rose','grad-blue','grad-emerald'];
    const ITEM_TYPES = [
      { type: 'page',       label: 'Page',       icon: 'file-text',       desc: 'Rich text content' },
      { type: 'assignment', label: 'Assignment', icon: 'clipboard-list',  desc: 'Collect student work' },
      { type: 'link',       label: 'Link',       icon: 'link',            desc: 'External resource' },
      { type: 'quiz',       label: 'Quiz',       icon: 'check-square',    desc: 'Auto-graded questions' },
    ];

    // ═══════════════════════════════════════════════════════════════════
    // 🔥 FIREBASE
    // ═══════════════════════════════════════════════════════════════════
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup,
      signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import {
      getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
      collection, query, where, orderBy, onSnapshot, serverTimestamp,
      arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHMgZklzO2Uu7v8Lm248DuU4QJ2RaCp44",
      authDomain: "ember-lms.firebaseapp.com",
      projectId: "ember-lms",
      storageBucket: "ember-lms.firebasestorage.app",
      messagingSenderId: "198763545245",
      appId: "1:198763545245:web:58b4d76df1181600fd0a74"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const secondaryApp = initializeApp(firebaseConfig, "Secondary");
    const secondaryAuth = getAuth(secondaryApp);

    // ═══════════════════════════════════════════════════════════════════
    // 🧭 ROUTER
    // ═══════════════════════════════════════════════════════════════════
    function getAppSegments() {
      let p = decodeURIComponent(window.location.pathname);
      if (BASE_PATH && p.startsWith(BASE_PATH)) p = p.slice(BASE_PATH.length);
      return p.split('/').filter(Boolean);
    }
    function buildUrl(rel = '/') {
      const c = rel.startsWith('/') ? rel : '/' + rel;
      const j = (BASE_PATH + c).replace(/\/+/g, '/').replace(/\/$/, '');
      return j || '/';
    }
    function navigate(path) { window.location.href = buildUrl(path); }
    function parseRoute() {
      const sp = sessionStorage.getItem('ember_redirect_path');
      if (sp) {
        sessionStorage.removeItem('ember_redirect_path');
        try { window.history.replaceState(null, '', sp); } catch (e) {}
      }
      const segs = getAppSegments();
      if (segs.length === 0) return { type: 'landing', tenant: null, segments: [] };
      const first = segs[0];
      if (RESERVED.includes(first)) return { type: first, tenant: null, segments: segs.slice(1) };
      return { type: 'tenant', tenant: first, segments: segs.slice(1) };
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🎨 HELPERS
    // ═══════════════════════════════════════════════════════════════════
    const appEl = document.getElementById('app');
    function refreshIcons() { if (window.lucide) window.lucide.createIcons(); }
    function render(html) { appEl.innerHTML = html; refreshIcons(); }
    function slugify(s) { return String(s||'').toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,''); }
    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function pickGradient(seed) {
      const s = String(seed||'');
      let h = 0;
      for (let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i))|0;
      return GRADIENTS[Math.abs(h) % GRADIENTS.length];
    }
    function formatDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
    }
    function formatDateTime(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      return d.toLocaleString(undefined, { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
    }
    function toDateInput(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      if (isNaN(d)) return '';
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }
    function sanitize(html) { return window.DOMPurify ? DOMPurify.sanitize(html || '') : (html || ''); }

    // ═══════════════════════════════════════════════════════════════════
    // 🔐 STATE
    // ═══════════════════════════════════════════════════════════════════
    let currentUser = null;
    let authReady = false;
    let unsubs = [];
    function clearSubs() { unsubs.forEach(u => { try { u(); } catch(e){} }); unsubs = []; }

    // ═══════════════════════════════════════════════════════════════════
    // 🧩 DATA
    // ═══════════════════════════════════════════════════════════════════
    async function getTenant(slug) {
      const s = await getDoc(doc(db, 'tenants', slug));
      return s.exists() ? { id: s.id, ...s.data() } : null;
    }
    async function getRoleInTenant(slug, uid) {
      if (!uid) return null;
      try {
        const t = await getDoc(doc(db, 'tenants', slug, 'users', uid));
        if (t.exists()) return { role: 'teacher', data: t.data() };
        const s = await getDoc(doc(db, 'tenants', slug, 'students', uid));
        if (s.exists()) return { role: 'student', data: s.data() };
      } catch(e) { console.error(e); }
      return null;
    }
    async function createCourse(slug, data) {
      const ref = await addDoc(collection(db, 'tenants', slug, 'courses'), {
        title: data.title, code: data.code || data.title,
        gradient: data.gradient || pickGradient(data.title),
        ownerUid: currentUser.uid, published: true, createdAt: serverTimestamp()
      });
      return ref.id;
    }
    async function deleteCourse(slug, id) { await deleteDoc(doc(db, 'tenants', slug, 'courses', id)); }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ VIEW: LANDING
    // ═══════════════════════════════════════════════════════════════════
    function viewLanding() {
      render(`
        <div class="min-h-screen relative overflow-hidden">
          <!-- Nav -->
          <nav class="relative z-20 max-w-6xl mx-auto px-6 py-6 flex justify-between items-center">
            <div class="font-serif text-xl">
              <span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span>
            </div>
            <div class="flex items-center gap-6 text-sm">
              <a href="${buildUrl('/onboard')}" class="text-gray-400 hover:text-white transition-all">Sign in</a>
              <a href="${buildUrl('/onboard')}"
                 class="px-4 py-2 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg hover:brightness-110 transition-all">
                Get started
              </a>
            </div>
          </nav>

          <!-- Hero glow -->
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[900px] h-[700px] rounded-full bg-[#F59E0B]/10 blur-[160px] pointer-events-none"></div>
          <div class="absolute top-40 right-0 w-[500px] h-[500px] rounded-full bg-[#8B5CF6]/10 blur-[140px] pointer-events-none"></div>

          <!-- Hero -->
          <section class="relative z-10 max-w-5xl mx-auto px-6 pt-16 pb-24 text-center">
            <p class="text-xs text-[#F59E0B] uppercase tracking-[0.3em] mb-6">Built for teachers</p>
            <h1 class="font-serif text-6xl md:text-7xl text-white leading-[1.05] mb-6">
              Teaching,<br><span class="italic text-[#F59E0B]">refined.</span>
            </h1>
            <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto mb-10 leading-relaxed">
              Ember is a modern learning platform with the focus of a notebook and the polish of a studio tool. Give your classroom the software it deserves.
            </p>
            <div class="flex flex-wrap items-center justify-center gap-4">
              <a href="${buildUrl('/onboard')}"
                 class="px-6 py-3.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_25px_rgba(245,158,11,0.25)] hover:shadow-[0_0_40px_rgba(245,158,11,0.45)] hover:brightness-110 transition-all">
                Create your school — free
              </a>
              <a href="${buildUrl('/onboard')}"
                 class="px-6 py-3.5 bg-white/[0.04] border border-white/10 text-white font-medium rounded-lg hover:bg-white/[0.08] transition-all">
                Sign in
              </a>
            </div>
            <p class="text-xs text-gray-600 mt-6">No credit card. No setup fees. Just sign in with Google.</p>
          </section>

          <!-- Dashboard preview -->
          <section class="relative z-10 max-w-6xl mx-auto px-6 pb-24">
            <div class="relative rounded-2xl border border-white/[0.08] bg-[#0D0D0D] overflow-hidden shadow-2xl">
              <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-[#F59E0B]/50 to-transparent"></div>
              <div class="flex items-center gap-2 px-4 py-3 border-b border-white/[0.08] bg-[#0A0A0A]">
                <div class="w-3 h-3 rounded-full bg-white/10"></div>
                <div class="w-3 h-3 rounded-full bg-white/10"></div>
                <div class="w-3 h-3 rounded-full bg-white/10"></div>
                <div class="ml-4 text-xs text-gray-600 font-mono">emberlms.com/your-school</div>
              </div>
              <div class="grid grid-cols-12 min-h-[400px]">
                <div class="col-span-3 border-r border-white/[0.06] p-5 space-y-3">
                  <div class="font-serif text-sm"><span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span></div>
                  <div class="pt-4 space-y-1.5">
                    <div class="flex items-center gap-2 px-2.5 py-1.5 rounded bg-white/[0.05] border-l-2 border-[#F59E0B] text-xs text-white"><div class="w-3 h-3 rounded bg-[#F59E0B]/60"></div>Dashboard</div>
                    <div class="flex items-center gap-2 px-2.5 py-1.5 rounded text-xs text-gray-500"><div class="w-3 h-3 rounded bg-white/10"></div>Courses</div>
                    <div class="flex items-center gap-2 px-2.5 py-1.5 rounded text-xs text-gray-500"><div class="w-3 h-3 rounded bg-white/10"></div>Students</div>
                  </div>
                </div>
                <div class="col-span-9 p-6 bg-[#0A0A0A]">
                  <div class="font-serif text-xl text-white mb-4">Dashboard</div>
                  <div class="grid grid-cols-3 gap-3">
                    ${[['grad-amber','English 1'],['grad-violet','Geometry'],['grad-teal','Spanish 1']].map(([g,t]) => `
                      <div class="bg-[#141414] border border-white/[0.08] rounded-lg overflow-hidden">
                        <div class="${g} h-12"></div>
                        <div class="p-3">
                          <div class="text-xs text-gray-500 mb-0.5">01 - ${t}</div>
                          <div class="font-serif text-sm text-white">${t}</div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>
          </section>

          <!-- Features -->
          <section class="relative z-10 max-w-6xl mx-auto px-6 pb-24">
            <div class="text-center mb-14">
              <p class="text-xs text-[#F59E0B] uppercase tracking-[0.3em] mb-3">Everything in one place</p>
              <h2 class="font-serif text-4xl text-white">A complete teaching workspace</h2>
            </div>
            <div class="grid md:grid-cols-3 gap-6">
              ${[
                { icon:'layers',        title:'Modules & Items',   desc:'Organize content into modules. Pages, assignments, links, and quizzes — all in one flow.' },
                { icon:'users',         title:'Student Accounts',  desc:'Create usernames and passwords for your students. No emails required. Works for any age.' },
                { icon:'clipboard-list',title:'Grading Built-in',  desc:'Collect submissions, grade inline, and leave feedback — all without leaving the platform.' },
                { icon:'palette',       title:'Designed to focus', desc:'A dark, editorial interface that puts content first and distractions last.' },
                { icon:'lock',          title:'Yours, isolated',   desc:'Each school gets its own URL and its own space. Your data never touches another tenant.' },
                { icon:'zap',           title:'Real-time updates', desc:'Grades, submissions, and content sync across devices the moment they change.' }
              ].map(f => `
                <div class="bg-[#141414] border border-white/[0.08] rounded-xl p-6 hover:border-white/20 hover:-translate-y-0.5 transition-all">

                  <p class="text-sm text-gray-500 leading-relaxed">${f.desc}</p>

          <!-- How it works -->

            </div>
            <div class="space-y-4">
              ${[
                { n:'01', title:'Sign in with Google', desc:'Your school, your URL. Pick a slug like "example" and your space is live at emberlms.com/example.' },
                { n:'02', title:'Create courses & students', desc:'Add courses with a click. Generate student accounts with usernames and passwords — no emails needed.' },
                { n:'03', title:'Teach', desc:'Build modules, add assignments, and watch submissions roll in. Everything lives in one clean dashboard.' }
              ].map((s,i) => `
                <div class="flex items-start gap-6 bg-[#141414] border border-white/[0.08] rounded-xl p-6">
                  <div class="font-serif text-3xl text-[#F59E0B] leading-none">${s.n}</div>
                  <div>
                    <h3 class="font-serif text-lg text-white mb-1">${s.title}</h3>
                    <p class="text-sm text-gray-500 leading-relaxed">${s.desc}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- CTA -->
          <section class="relative z-10 max-w-4xl mx-auto px-6 pb-24">
            <div class="relative rounded-2xl border border-white/[0.08] bg-gradient-to-br from-[#141414] to-[#0A0A0A] p-12 text-center overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-b from-[#F59E0B]/5 to-transparent"></div>
              <div class="relative z-10">
                <h2 class="font-serif text-4xl text-white mb-4">Bring your classroom to Ember.</h2>
                <p class="text-gray-400 mb-8 max-w-lg mx-auto">Free to start. Yours in seconds.</p>
                <a href="${buildUrl('/onboard')}"
                   class="inline-block px-8 py-3.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_25px_rgba(245,158,11,0.25)] hover:shadow-[0_0_40px_rgba(245,158,11,0.45)] hover:brightness-110 transition-all">

    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ VIEW: ONBOARD (unchanged from Phase 2/3)
    // ═══════════════════════════════════════════════════════════════════
    function viewOnboard() {
      if (!currentUser) {
        render(`
          <div class="min-h-screen flex items-center justify-center px-6 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
            <div class="max-w-md w-full text-center z-10">
              <h1 class="font-serif text-4xl text-white mb-3">Create your school</h1>
              <p class="text-gray-500 mb-8">Sign in with Google to get started.</p>
              <button id="google-signin-btn"
                class="w-full flex items-center justify-center gap-3 bg-white text-gray-900 font-medium py-3 px-4 rounded-lg hover:bg-gray-100 transition-all">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>

            <button id="onboard-submit"
              class="w-full py-3 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white font-medium rounded-lg shadow-[0_0_15px_rgba(245,158,11,0.2)] hover:shadow-[0_0_25px_rgba(245,158,11,0.4)] hover:brightness-110 transition-all disabled:opacity-60">

            </button>

              <button id="signout-btn" class="hover:text-gray-400">Sign out</button>
            </p>
          </div>
        </div>
      `);

      const ni = document.getElementById('school-name');
      const si = document.getElementById('school-slug');
      ni.addEventListener('input', () => { if (!si.dataset.touched) si.value = slugify(ni.value); });
      si.addEventListener('input', () => { si.dataset.touched = '1'; });
      document.getElementById('onboard-submit').addEventListener('click', createSchool);
      document.getElementById('signout-btn').addEventListener('click', () => signOut(auth));

    async function createSchool() {
      const name = document.getElementById('school-name').value.trim();
      const slug = document.getElementById('school-slug').value.trim().toLowerCase();
      const err = document.getElementById('onboard-error');
      const btn = document.getElementById('onboard-submit');
      const showError = (m) => { err.textContent = m; err.classList.remove('hidden'); };
      err.classList.add('hidden');
      if (!name) return showError('Please enter a school name.');
      if (!/^[a-z0-9-]{3,30}$/.test(slug)) return showError('URL must be 3–30 characters: lowercase, numbers, hyphens.');
      if (RESERVED.includes(slug)) return showError('That URL is reserved.');
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const ex = await getDoc(doc(db, 'tenants', slug));
        if (ex.exists()) { btn.disabled = false; btn.textContent = 'Create School'; return showError('That URL is already taken.'); }
        await setDoc(doc(db, 'tenants', slug), { name, slug, ownerUid: currentUser.uid, createdAt: serverTimestamp() });
        await setDoc(doc(db, 'tenants', slug, 'users', currentUser.uid), {
          role: 'teacher', email: currentUser.email,
          displayName: currentUser.displayName, photoURL: currentUser.photoURL, createdAt: serverTimestamp()
        });
        navigate('/' + slug);
      } catch (e) {
        console.error(e); btn.disabled = false; btn.textContent = 'Create School';
        showError('Something went wrong: ' + e.message);
      }
    }

    async function viewTenant(slug, segs) {
      render(`<div class="min-h-screen flex items-center justify-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></div>`);
      const tenant = await getTenant(slug);
      if (!tenant) return viewTenantNotFound(slug);
      if (!currentUser) return viewTenantLogin(slug, tenant);
      const roleInfo = await getRoleInTenant(slug, currentUser.uid);
      if (!roleInfo) return viewNoAccess(slug, tenant);

      const sub = segs[0] || 'dashboard';
      if (sub === 'course' && segs[1]) {
        if (segs[2] === 'item' && segs[3] && segs[4]) return viewItem(slug, tenant, roleInfo, segs[1], segs[3], segs[4]);
        return viewCourse(slug, tenant, roleInfo, segs[1]);
      }
      return viewDashboard(slug, tenant, roleInfo);
    }

                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

    async function studentLogin(slug) {
      const u = document.getElementById('student-username').value.trim().toLowerCase();
      const p = document.getElementById('student-password').value;
      const err = document.getElementById('login-error');
      const btn = document.getElementById('student-login-btn');
      const showError = m => { err.textContent = m; err.classList.remove('hidden'); };
      err.classList.add('hidden');
      if (!u || !p) return showError('Enter both username and password.');
      if (!/^[a-z0-9_]{3,20}$/.test(u)) return showError('Invalid username format.');
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        await signInWithEmailAndPassword(auth, `${u}@${slug}.emberlms.local`, p);
      } catch (e) {
        console.error(e); btn.disabled = false; btn.textContent = 'Sign in as Student';

      render(`

    function subscribeToCourses(slug, isTeacher) {
      clearSubs();
      const q = query(collection(db, 'tenants', slug, 'courses'), orderBy('createdAt', 'desc'));
      const unsub = onSnapshot(q, (snap) => {
        const grid = document.getElementById('course-grid');
        if (!grid) return;
        if (snap.empty) {
          grid.innerHTML = `<div class="col-span-full text-center py-20 border border-dashed border-white/10 rounded-xl">
            <i data-lucide="book-open" class="w-10 h-10 mx-auto mb-4 text-gray-600"></i>
            <p class="text-lg text-white font-serif mb-1">No courses yet</p>
            <p class="text-sm text-gray-500">${isTeacher ? 'Click "New Course" to create your first one.' : 'You are not enrolled in any courses yet.'}</p>
          </div>`;
          refreshIcons(); return;
        }
        grid.innerHTML = snap.docs.map(d => renderCourseCard(slug, d.id, d.data(), isTeacher)).join('');
        refreshIcons();
        grid.querySelectorAll('[data-action="delete"]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation(); e.preventDefault();
            if (confirm(`Delete "${btn.dataset.title}"? This cannot be undone.`)) {
              await deleteCourse(slug, btn.dataset.id);
            }
          });
        });
        grid.querySelectorAll('[data-course-link]').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('[data-action]')) return;
            navigate(`/${slug}/course/${card.dataset.courseLink}`);
          });
        });
      }, (err) => {
        console.error(err);
        const grid = document.getElementById('course-grid');
        if (grid) grid.innerHTML = `<div class="col-span-full text-red-400 text-sm p-6">Failed to load courses: ${escapeHtml(err.message)}</div>`;
      });
      unsubs.push(unsub);
    }

          <div class="${grad} h-24 relative">
            ${isTeacher ? `<button data-action="delete" data-id="${id}" data-title="${escapeHtml(course.title || '')}"
              class="absolute top-2 right-2 p-1.5 bg-black/30 hover:bg-red-500/80 rounded text-white/80 hover:text-white opacity-0 group-hover:opacity-100 transition-all">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}

          <div class="p-5 flex-1 flex flex-col">
            <p class="text-xs text-gray-500 mb-1 truncate">${escapeHtml(course.code || '')}</p>
            <h4 class="font-serif text-lg text-white mb-1 truncate">${escapeHtml(course.title || 'Untitled')}</h4>

    function openCourseModal(slug) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
          <h3 class="font-serif text-2xl text-white mb-1">New Course</h3>
          <p class="text-gray-500 text-sm mb-6">Create a course for your students.</p>
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Course Name</label>
          <input id="course-title" type="text" placeholder="English 1" autocomplete="off"
            class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Course Code <span class="text-gray-600 normal-case tracking-normal">(optional)</span></label>
          <input id="course-code" type="text" placeholder="01 - English 1 - Santiago" autocomplete="off"
            class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-4 transition-all" />
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Color</label>
          <div id="gradient-picker" class="grid grid-cols-6 gap-2 mb-6">
            ${GRADIENTS.map((g, i) => `<button type="button" data-grad="${g}" class="${g} h-9 rounded-lg border-2 ${i === 0 ? 'border-white' : 'border-transparent'} hover:border-white/50 transition-all"></button>`).join('')}
          </div>
          <p id="course-error" class="text-red-400 text-sm mb-4 hidden"></p>
          <div class="flex gap-3">
            <button id="course-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
            <button id="course-create" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all">Create</button>
          </div>
        </div>`;
      document.body.appendChild(ov);
      let grad = GRADIENTS[0];
      ov.querySelectorAll('[data-grad]').forEach(b => b.addEventListener('click', () => {
        grad = b.dataset.grad;
        ov.querySelectorAll('[data-grad]').forEach(x => x.classList.replace('border-white','border-transparent'));
        b.classList.replace('border-transparent','border-white');
      }));
      const close = () => ov.remove();
      ov.querySelector('#course-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelector('#course-create').addEventListener('click', async () => {
        const title = ov.querySelector('#course-title').value.trim();
        const code = ov.querySelector('#course-code').value.trim();
        const err = ov.querySelector('#course-error');
        const btn = ov.querySelector('#course-create');
        err.classList.add('hidden');
        if (!title) { err.textContent = 'Please enter a course name.'; err.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Creating…';
        try { await createCourse(slug, { title, code, gradient: grad }); close(); }
        catch(e) { console.error(e); btn.disabled = false; btn.textContent = 'Create'; err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden'); }
      });
      setTimeout(() => ov.querySelector('#course-title').focus(), 50);
    }

                  <button id="add-module-btn"
                    class="px-4 py-2 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all flex items-center gap-2 shrink-0">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Module
                  </button>` : ''}
              </div>
            </header>
            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div id="modules-list" class="max-w-3xl space-y-4">
                <div class="text-center py-20 text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin mx-auto"></i></div>
              </div>
            </div>
          </main>
        </div>
      `);

      if (isTeacher) document.getElementById('add-module-btn').addEventListener('click', () => openModuleModal(slug, courseId));
      subscribeToModules(slug, courseId, isTeacher);
    }

    function subscribeToModules(slug, courseId, isTeacher) {
      clearSubs();
      const q = query(collection(db, 'tenants', slug, 'courses', courseId, 'modules'), orderBy('position', 'asc'));
      const unsub = onSnapshot(q, async (snap) => {
        const list = document.getElementById('modules-list');
        if (!list) return;

        if (snap.empty) {
          list.innerHTML = `<div class="border border-dashed border-white/10 rounded-xl p-10 text-center">
            <i data-lucide="layers" class="w-10 h-10 text-[#F59E0B] mx-auto mb-4"></i>
            <h3 class="font-serif text-xl text-white mb-2">No modules yet</h3>
            <p class="text-gray-500 text-sm">${isTeacher ? 'Click "Add Module" to build your course content.' : 'Your teacher hasn\'t added any content yet.'}</p>
          </div>`;
          refreshIcons(); return;
        }

        // For each module, fetch items
        const moduleEls = await Promise.all(snap.docs.map(async (md, idx) => {
          const mod = { id: md.id, ...md.data() };
          const itemsSnap = await new Promise((res) => {
            const u = onSnapshot(query(collection(db, 'tenants', slug, 'courses', courseId, 'modules', mod.id, 'items'), orderBy('position', 'asc')), res);
            unsubs.push(u);
          });
          const items = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
          return renderModuleCard(slug, courseId, mod, items, isTeacher, idx + 1);
        }));

        list.innerHTML = moduleEls.join('');
        refreshIcons();

        // Wire item clicks
        list.querySelectorAll('[data-item-link]').forEach(el => {
          el.addEventListener('click', (e) => {
            e.preventDefault();
            navigate(`/${slug}/course/${courseId}/item/${el.dataset.moduleId}/${el.dataset.itemLink}`);
          });
        });

        // Wire module delete
        list.querySelectorAll('[data-module-delete]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm(`Delete module "${btn.dataset.title}"? All items inside will be removed.`)) {
              await deleteDoc(doc(db, 'tenants', slug, 'courses', courseId, 'modules', btn.dataset.id));
            }
          });
        });

        // Wire item delete
        list.querySelectorAll('[data-item-delete]').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (confirm('Delete this item?')) {
              await deleteDoc(doc(db, 'tenants', slug, 'courses', courseId, 'modules', btn.dataset.moduleId, 'items', btn.dataset.id));
            }
          });
        });

        // Wire "add item" button per module
        list.querySelectorAll('[data-add-item]').forEach(btn => {
          btn.addEventListener('click', () => openItemTypeModal(slug, courseId, btn.dataset.moduleId));
        });
      });
      unsubs.push(unsub);
    }

    function renderModuleCard(slug, courseId, mod, items, isTeacher, idx) {
      const itemsHtml = items.length === 0
        ? `<p class="text-xs text-gray-600 italic py-3">No items yet</p>`
        : items.map(it => renderItemRow(slug, courseId, mod.id, it, isTeacher)).join('');

      return `
        <div class="bg-[#141414] border border-white/[0.08] rounded-xl overflow-hidden">
          <div class="flex items-center justify-between px-5 py-4 border-b border-white/[0.06]">
            <div class="flex items-center gap-3 min-w-0">
              <span class="text-[10px] font-mono text-gray-600 tracking-wider">${String(idx).padStart(2,'0')}</span>
              <h3 class="font-serif text-lg text-white truncate">${escapeHtml(mod.title || 'Untitled Module')}</h3>
              <span class="text-[10px] text-gray-600 shrink-0">${items.length} item${items.length === 1 ? '' : 's'}</span>
            </div>
            ${isTeacher ? `
              <div class="flex items-center gap-1 shrink-0">
                <button data-add-item data-module-id="${mod.id}" title="Add item"
                  class="p-1.5 text-gray-500 hover:text-[#F59E0B] hover:bg-white/[0.05] rounded transition-all">
                  <i data-lucide="plus" class="w-4 h-4"></i></button>
                <button data-module-delete data-id="${mod.id}" data-title="${escapeHtml(mod.title||'')}" title="Delete module"
                  class="p-1.5 text-gray-500 hover:text-red-400 hover:bg-white/[0.05] rounded transition-all">
                  <i data-lucide="trash-2" class="w-4 h-4"></i></button>
              </div>` : ''}
          </div>
          <div class="divide-y divide-white/[0.04]">${itemsHtml}</div>
        </div>
      `;
    }

    function renderItemRow(slug, courseId, moduleId, item, isTeacher) {
      const meta = ITEM_TYPES.find(t => t.type === item.type) || ITEM_TYPES[0];
      const extra = item.type === 'assignment' && item.points
        ? `<span class="text-[10px] text-gray-600 ml-2">${item.points} pts${item.dueDate ? ' · Due ' + escapeHtml(formatDate(item.dueDate)) : ''}</span>`
        : '';
      return `
        <div data-item-link="${item.id}" data-module-id="${moduleId}"
          class="flex items-center gap-3 px-5 py-3 hover:bg-white/[0.03] cursor-pointer group transition-all">
          <i data-lucide="${meta.icon}" class="w-4 h-4 text-gray-500 group-hover:text-[#F59E0B] transition-colors shrink-0"></i>
          <div class="flex-1 min-w-0">
            <span class="text-sm text-gray-200 truncate">${escapeHtml(item.title || 'Untitled')}</span>
            <span class="text-[10px] uppercase tracking-wider text-gray-600 ml-3">${meta.label}</span>
            ${extra}
          </div>
          ${isTeacher ? `<button data-item-delete data-id="${item.id}" data-module-id="${moduleId}" title="Delete item"
            class="p-1 text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-all shrink-0">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : `<i data-lucide="chevron-right" class="w-4 h-4 text-gray-700 shrink-0"></i>`}
        </div>
      `;
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ MODULE MODAL
    // ═══════════════════════════════════════════════════════════════════
    function openModuleModal(slug, courseId) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
          <h3 class="font-serif text-2xl text-white mb-1">New Module</h3>
          <p class="text-gray-500 text-sm mb-6">A section to group your course content.</p>
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Module Title</label>
          <input id="module-title" type="text" placeholder="Week 1: Introduction" autocomplete="off"
            class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white mb-6 transition-all" />
          <p id="module-error" class="text-red-400 text-sm mb-4 hidden"></p>
          <div class="flex gap-3">
            <button id="module-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
            <button id="module-create" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all">Create</button>
          </div>
        </div>`;
      document.body.appendChild(ov);
      const close = () => ov.remove();
      ov.querySelector('#module-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelector('#module-title').addEventListener('keydown', e => { if (e.key === 'Enter') ov.querySelector('#module-create').click(); });
      ov.querySelector('#module-create').addEventListener('click', async () => {
        const title = ov.querySelector('#module-title').value.trim();
        const err = ov.querySelector('#module-error');
        const btn = ov.querySelector('#module-create');
        err.classList.add('hidden');
        if (!title) { err.textContent = 'Please enter a title.'; err.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Creating…';
        try {
          // Determine next position by fetching count (approximate via timestamp)
          await addDoc(collection(db, 'tenants', slug, 'courses', courseId, 'modules'), {
            title, position: Date.now(), createdAt: serverTimestamp()
          });
          close();
        } catch(e) { console.error(e); btn.disabled = false; btn.textContent = 'Create'; err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden'); }
      });
      setTimeout(() => ov.querySelector('#module-title').focus(), 50);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ ITEM TYPE PICKER
    // ═══════════════════════════════════════════════════════════════════
    function openItemTypeModal(slug, courseId, moduleId) {
      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-overlay px-6';
      ov.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-md w-full p-8 shadow-2xl">
          <h3 class="font-serif text-2xl text-white mb-1">Add Item</h3>
          <p class="text-gray-500 text-sm mb-6">What kind of content?</p>
          <div class="space-y-2">
            ${ITEM_TYPES.map(t => `
              <button data-type="${t.type}"
                class="w-full flex items-center gap-4 px-4 py-3.5 bg-white/[0.03] border border-white/[0.08] rounded-lg hover:bg-white/[0.06] hover:border-[#F59E0B]/40 transition-all text-left group">
                <div class="w-9 h-9 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center shrink-0">
                  <i data-lucide="${t.icon}" class="w-4 h-4 text-[#F59E0B]"></i>
                </div>
                <div class="flex-1 min-w-0">
                  <div class="text-sm text-white font-medium">${t.label}</div>
                  <div class="text-xs text-gray-500">${t.desc}</div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-600 group-hover:text-[#F59E0B] transition-colors"></i>
              </button>
            `).join('')}
          </div>
          <button id="item-type-cancel" class="w-full mt-6 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
        </div>`;
      document.body.appendChild(ov);
      refreshIcons();
      const close = () => ov.remove();
      ov.querySelector('#item-type-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      ov.querySelectorAll('[data-type]').forEach(btn => {
        btn.addEventListener('click', () => {
          close();
          openItemEditor(slug, courseId, moduleId, null, btn.dataset.type);
        });
      });
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ ITEM EDITOR (create/edit)
    // ═══════════════════════════════════════════════════════════════════
    function openItemEditor(slug, courseId, moduleId, existingItem, type) {
      const item = existingItem || { type, title: '', data: {} };
      const meta = ITEM_TYPES.find(t => t.type === item.type) || ITEM_TYPES[0];

      const ov = document.createElement('div');
      ov.className = 'fixed inset-0 z-50 flex items-start justify-center bg-black/60 modal-overlay px-6 py-10 overflow-y-auto';
      ov.innerHTML = `
        <div class="bg-[#141414] border border-white/[0.08] rounded-2xl max-w-2xl w-full shadow-2xl my-8">
          <div class="p-8 pb-6 border-b border-white/[0.06] flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center">
                <i data-lucide="${meta.icon}" class="w-4 h-4 text-[#F59E0B]"></i>
              </div>
              <div>
                <h3 class="font-serif text-2xl text-white">${existingItem ? 'Edit' : 'New'} ${meta.label}</h3>
                <p class="text-gray-500 text-xs">${meta.desc}</p>
              </div>
            </div>
            <button id="item-close" class="p-2 text-gray-500 hover:text-white rounded transition-all"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>

          <div class="p-8 space-y-5">
            <div>
              <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Title</label>
              <input id="item-title" type="text" value="${escapeHtml(item.title || '')}" autocomplete="off"
                class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" />
            </div>

            ${item.type === 'page' ? `
              <div>
                <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Content</label>
                <div class="bg-white/[0.02] border border-white/10 rounded-lg overflow-hidden">
                  <div id="quill-toolbar">
                    <span class="ql-formats">
                      <select class="ql-header"><option value="1"></option><option value="2"></option><option value="3"></option><option selected></option></select>
                    </span>
                    <span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button></span>
                    <span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span>
                    <span class="ql-formats"><button class="ql-blockquote"></button><button class="ql-link"></button><button class="ql-image"></button></span>
                    <span class="ql-formats"><button class="ql-clean"></button></span>
                  </div>
                  <div id="quill-editor"></div>
                </div>
              </div>
            ` : ''}

            ${item.type === 'assignment' ? `
              <div>
                <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Instructions</label>
                <div class="bg-white/[0.02] border border-white/10 rounded-lg overflow-hidden">
                  <div id="quill-toolbar">
                    <span class="ql-formats"><button class="ql-bold"></button><button class="ql-italic"></button><button class="ql-underline"></button></span>
                    <span class="ql-formats"><button class="ql-list" value="ordered"></button><button class="ql-list" value="bullet"></button></span>
                    <span class="ql-formats"><button class="ql-link"></button><button class="ql-clean"></button></span>
                  </div>
                  <div id="quill-editor"></div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Points</label>
                  <input id="item-points" type="number" min="0" value="${item.data?.points ?? 100}"
                    class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" />
                </div>
                <div>
                  <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Due Date</label>
                  <input id="item-due" type="date" value="${toDateInput(item.data?.dueDate)}"
                    class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" />
                </div>
              </div>
            ` : ''}

            ${item.type === 'link' ? `
              <div>
                <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">URL</label>
                <input id="item-url" type="url" value="${escapeHtml(item.data?.url || '')}" placeholder="https://example.com" autocomplete="off"
                  class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" />
              </div>
            ` : ''}

            ${item.type === 'quiz' ? `
              <div class="text-sm text-gray-500 italic">Quiz builder arrives in Phase 5. For now, you can create an empty quiz.</div>
            ` : ''}

            <p id="item-error" class="text-red-400 text-sm hidden"></p>
          </div>

          <div class="p-8 pt-0 flex gap-3">
            <button id="item-cancel" class="flex-1 py-2.5 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all">Cancel</button>
            <button id="item-save" class="flex-1 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all disabled:opacity-60">
              ${existingItem ? 'Save Changes' : 'Create'}
            </button>
          </div>
        </div>`;

      document.body.appendChild(ov);
      refreshIcons();

      // Quill setup
      let quill = null;
      if (item.type === 'page' || item.type === 'assignment') {
        const initialHtml = item.type === 'page' ? (item.data?.content || '') : (item.data?.description || '');
        quill = new Quill(ov.querySelector('#quill-editor'), {
          theme: 'snow',
          modules: { toolbar: '#quill-toolbar' }
        });
        if (initialHtml) quill.clipboard.dangerouslyPasteHTML(initialHtml);
      }

      const close = () => ov.remove();
      ov.querySelector('#item-close').addEventListener('click', close);
      ov.querySelector('#item-cancel').addEventListener('click', close);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });

      ov.querySelector('#item-save').addEventListener('click', async () => {
        const title = ov.querySelector('#item-title').value.trim();
        const err = ov.querySelector('#item-error');
        const btn = ov.querySelector('#item-save');
        err.classList.add('hidden');

        if (!title) { err.textContent = 'Please enter a title.'; err.classList.remove('hidden'); return; }

        const data = {};
        if (item.type === 'page') {
          data.content = sanitize(quill.root.innerHTML);
        } else if (item.type === 'assignment') {
          data.description = sanitize(quill.root.innerHTML);
          data.points = Number(ov.querySelector('#item-points').value) || 0;
          const due = ov.querySelector('#item-due').value;
          data.dueDate = due ? new Date(due + 'T23:59:00') : null;
        } else if (item.type === 'link') {
          const url = ov.querySelector('#item-url').value.trim();
          if (!url) { err.textContent = 'Please enter a URL.'; err.classList.remove('hidden'); return; }
          data.url = url;
        }

        btn.disabled = true; btn.textContent = 'Saving…';
        try {
          if (existingItem) {
            await updateDoc(doc(db, 'tenants', slug, 'courses', courseId, 'modules', moduleId, 'items', item.id), {
              title, data, updatedAt: serverTimestamp()
            });
          } else {
            await addDoc(collection(db, 'tenants', slug, 'courses', courseId, 'modules', moduleId, 'items'), {
              type: item.type, title, data, position: Date.now(), createdAt: serverTimestamp()
            });
          }
          close();
        } catch(e) { console.error(e); btn.disabled = false; btn.textContent = existingItem ? 'Save Changes' : 'Create'; err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden'); }
      });

      setTimeout(() => ov.querySelector('#item-title').focus(), 50);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ VIEW: ITEM (page / assignment / link / quiz)
    // ═══════════════════════════════════════════════════════════════════
    async function viewItem(slug, tenant, roleInfo, courseId, moduleId, itemId) {
      render(`<div class="min-h-screen flex items-center justify-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></div>`);

      const [cSnap, iSnap] = await Promise.all([
        getDoc(doc(db, 'tenants', slug, 'courses', courseId)),
        getDoc(doc(db, 'tenants', slug, 'courses', courseId, 'modules', moduleId, 'items', itemId))
      ]);
      if (!cSnap.exists() || !iSnap.exists()) return viewNotFound();

      const course = { id: cSnap.id, ...cSnap.data() };
      const item = { id: iSnap.id, ...iSnap.data() };
      const isTeacher = roleInfo.role === 'teacher';
      const meta = ITEM_TYPES.find(t => t.type === item.type) || ITEM_TYPES[0];

      // Link type: redirect immediately
      if (item.type === 'link' && item.data?.url) {
        window.open(item.data.url, '_blank', 'noopener');
        navigate(`/${slug}/course/${courseId}`);
        return;
      }

      render(`
        <div class="min-h-screen flex">
          ${renderSidebar(slug, tenant, roleInfo, 'course', course)}
          <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-[#F59E0B]/5 to-transparent pointer-events-none"></div>
            <header class="p-8 pb-4 z-10 relative">
              <a href="${buildUrl('/' + slug + '/course/' + courseId)}" class="text-xs text-gray-500 hover:text-[#F59E0B] transition-all inline-flex items-center gap-1 mb-3">
                <i data-lucide="arrow-left" class="w-3 h-3"></i> Back to ${escapeHtml(course.title)}
              </a>
              <div class="flex items-center justify-between gap-4">
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-10 h-10 rounded-lg bg-[#F59E0B]/10 border border-[#F59E0B]/20 flex items-center justify-center shrink-0">
                    <i data-lucide="${meta.icon}" class="w-5 h-5 text-[#F59E0B]"></i>
                  </div>
                  <div class="min-w-0">
                    <p class="text-[10px] uppercase tracking-wider text-gray-500 mb-0.5">${meta.label}</p>
                    <h2 class="font-serif text-2xl text-white truncate">${escapeHtml(item.title || 'Untitled')}</h2>
                  </div>
                </div>
                ${isTeacher ? `<button id="edit-item-btn"
                  class="px-4 py-2 bg-white/[0.05] border border-white/10 text-white text-sm rounded-lg hover:bg-white/[0.08] transition-all flex items-center gap-2 shrink-0">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Edit</button>` : ''}
              </div>
            </header>
            <div class="flex-1 p-8 pt-4 overflow-y-auto z-10 relative">
              <div id="item-content" class="max-w-3xl">
                ${renderItemBody(item, isTeacher, courseId, moduleId)}
              </div>
            </div>
          </main>
        </div>
      `);

      if (isTeacher) {
        document.getElementById('edit-item-btn').addEventListener('click', () => openItemEditor(slug, courseId, moduleId, item, item.type));
      }
      wireItemBody(slug, courseId, moduleId, itemId, item, isTeacher);
    }

    function renderItemBody(item, isTeacher, courseId, moduleId) {
      if (item.type === 'page') {
        return `<div class="prose-ember">${sanitize(item.data?.content || '<p class="text-gray-500 italic">No content yet.</p>')}</div>`;
      }

      if (item.type === 'assignment') {
        const due = item.data?.dueDate;
        const points = item.data?.points ?? 0;
        return `
          <div class="mb-8 flex flex-wrap gap-3">
            <div class="px-3 py-1.5 bg-[#F59E0B]/10 border border-[#F59E0B]/20 rounded-lg text-xs text-[#F59E0B] font-medium">
              ${points} points
            </div>
            ${due ? `<div class="px-3 py-1.5 bg-white/[0.05] border border-white/[0.08] rounded-lg text-xs text-gray-400">
              Due ${escapeHtml(formatDateTime(due))}
            </div>` : ''}
          </div>
          <div class="prose-ember mb-8">${sanitize(item.data?.description || '<p class="text-gray-500 italic">No instructions yet.</p>')}</div>
          <div id="assignment-area">
            ${isTeacher ? `
              <div class="border border-dashed border-white/10 rounded-xl p-8 text-center">
                <i data-lucide="inbox" class="w-8 h-8 text-gray-600 mx-auto mb-3"></i>
                <p class="text-gray-500 text-sm">Submissions will appear here once students turn in their work.</p>
              </div>
            ` : `
              <div class="bg-[#141414] border border-white/[0.08] rounded-xl p-6">
                <h3 class="font-serif text-lg text-white mb-4">Submit your work</h3>
                <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Your Submission</label>
                <textarea id="submission-text" rows="6" placeholder="Type your answer here…"
                  class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all font-sans"></textarea>
                <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2 mt-4">Or a link (URL)</label>
                <input id="submission-url" type="url" placeholder="https://docs.google.com/…"
                  class="input-glow w-full bg-white/[0.03] border border-white/10 rounded-lg px-4 py-3 text-white transition-all" />
                <p id="submission-error" class="text-red-400 text-sm mt-3 hidden"></p>
                <p id="submission-success" class="text-green-400 text-sm mt-3 hidden"></p>
                <button id="submit-assignment-btn"
                  class="mt-4 px-5 py-2.5 bg-gradient-to-r from-[#F59E0B] to-[#EA580C] text-white text-sm font-medium rounded-lg hover:brightness-110 transition-all">
                  Submit Assignment
                </button>
              </div>
            `}
          </div>
        `;
      }

      if (item.type === 'quiz') {
        return `<div class="border border-dashed border-white/10 rounded-xl p-10 text-center">
          <i data-lucide="check-square" class="w-10 h-10 text-[#F59E0B] mx-auto mb-4"></i>
          <p class="text-gray-500 text-sm">Quiz builder arrives in Phase 5.</p>
        </div>`;
      }

      return `<p class="text-gray-500 italic">Unknown item type.</p>`;
    }

    function wireItemBody(slug, courseId, moduleId, itemId, item, isTeacher) {
      if (item.type !== 'assignment' || isTeacher) return;
      const btn = document.getElementById('submit-assignment-btn');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const content = document.getElementById('submission-text').value.trim();
        const url = document.getElementById('submission-url').value.trim();
        const err = document.getElementById('submission-error');
        const ok = document.getElementById('submission-success');
        err.classList.add('hidden'); ok.classList.add('hidden');
        if (!content && !url) { err.textContent = 'Please provide text or a link.'; err.classList.remove('hidden'); return; }
        btn.disabled = true; btn.textContent = 'Submitting…';
        try {
          await addDoc(collection(db, 'tenants', slug, 'courses', courseId, 'submissions'), {
            itemId, moduleId, studentId: currentUser.uid,
            studentName: currentUser.displayName || 'Student',
            content, url, submittedAt: serverTimestamp(),
            grade: null, feedback: null
          });
          ok.textContent = 'Submitted! Your teacher will review it soon.';
          ok.classList.remove('hidden');
          btn.textContent = 'Submitted ✓';
        } catch(e) {
          console.error(e); btn.disabled = false; btn.textContent = 'Submit Assignment';
          err.textContent = 'Failed: ' + e.message; err.classList.remove('hidden');
        }
      });
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🖼️ SIDEBAR
    // ═══════════════════════════════════════════════════════════════════
    function renderSidebar(slug, tenant, roleInfo, active, course = null) {
      const isTeacher = roleInfo.role === 'teacher';
      const name = currentUser.displayName || roleInfo.data.displayName || currentUser.email || 'User';

      const item = (href, icon, label, key, soon = false) => {
        const isActive = active === key;
        if (soon) return `<span class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600">
          <i data-lucide="${icon}" class="w-4 h-4"></i> ${label}
          <span class="ml-auto text-[10px]">Soon</span>
        </span>`;
        return `<a href="${buildUrl(href)}"
          class="flex items-center gap-3 px-3 py-2 text-sm ${isActive ? 'text-white bg-white/[0.05] border-l-2 border-[#F59E0B] rounded-r' : 'text-gray-400 hover:text-white hover:bg-white/[0.03] border-l-2 border-transparent rounded-r'} transition-all">
          <i data-lucide="${icon}" class="w-4 h-4 ${isActive ? 'text-[#F59E0B]' : ''}"></i> ${label}
        </a>`;
      };

      return `
        <aside class="w-64 bg-[#050505] border-r border-white/[0.08] p-6 flex flex-col h-screen shrink-0">
          <h1 class="font-serif text-xl mb-8">
            <span class="text-[#F59E0B]">Ember</span> <span class="text-white">LMS</span>
          </h1>
          <div class="text-[10px] text-gray-500 uppercase tracking-widest mb-2">${course ? 'Course' : 'School'}</div>
          <p class="text-white text-sm mb-8 truncate">${escapeHtml(course ? course.title : tenant.name)}</p>
          <nav class="space-y-1">
            ${course ? `
              ${item('/' + slug + '/course/' + course.id, 'layers', 'Modules', 'course')}
              ${isTeacher ? `<span class="flex items-center gap-3 px-3 py-2 text-sm text-gray-600">
                <i data-lucide="users" class="w-4 h-4"></i> Roster <span class="ml-auto text-[10px]">Soon</span></span>` : ''}
              <div class="pt-4 mt-4 border-t border-white/[0.06]">
                <a href="${buildUrl('/' + slug)}" class="flex items-center gap-3 px-3 py-2 text-sm text-gray-500 hover:text-white transition-all">
                  <i data-lucide="arrow-left" class="w-4 h-4"></i> All Courses
                </a>
              </div>
            ` : `
              ${item('/' + slug, 'layout-dashboard', 'Dashboard', 'dashboard')}
              ${item('/' + slug + '/courses', 'book-open', 'Courses', 'courses', true)}
              ${isTeacher ? item('/' + slug + '/students', 'users', 'Students', 'students', true) : ''}
            `}
          </nav>
          <div class="mt-auto pt-6 border-t border-white/[0.08]">
            <div class="flex items-center gap-3 mb-3">
              ${currentUser.photoURL
                ? `<img src="${currentUser.photoURL}" class="w-8 h-8 rounded-full border border-white/20" alt="">`
                : `<div class="w-8 h-8 rounded-full bg-white/10"></div>`}
              <div class="flex-1 min-w-0">
                <p class="text-sm text-white truncate">${escapeHtml(name)}</p>
                <p class="text-xs text-gray-500 truncate">${isTeacher ? 'Teacher' : 'Student'}</p>
              </div>
            </div>
            <button data-signout class="w-full text-left text-xs text-gray-400 hover:text-red-400 transition-colors flex items-center gap-2">
              <i data-lucide="log-out" class="w-3 h-3"></i> Sign Out
            </button>
          </div>
        </aside>
      `;
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('[data-signout]')) signOut(auth);
    });

    function viewNotFound() {
      render(`<div class="min-h-screen flex items-center justify-center text-center px-6"><div>
        <h1 class="font-serif text-3xl text-white mb-2">404</h1>
        <p class="text-gray-500">Page not found.</p>
        <a href="${buildUrl('/')}" class="inline-block mt-6 text-sm text-[#F59E0B] hover:underline">← Back</a>
      </div></div>`);
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🔑 AUTH
    // ═══════════════════════════════════════════════════════════════════
    async function handleGoogleSignIn() {
      try {
        await signInWithPopup(auth, new GoogleAuthProvider());
      } catch (e) {
        console.error(e);
        if (['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)) return;
        alert('Sign-in failed: ' + e.message);
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    // 🚀 RENDER
    // ═══════════════════════════════════════════════════════════════════
    async function renderRoute() {
      if (!authReady) return;
      clearSubs();
      const route = parseRoute();
      try {
        switch (route.type) {
          case 'landing': viewLanding(); break;
          case 'onboard': viewOnboard(); break;
          case 'tenant':  await viewTenant(route.tenant, route.segments); break;
          default:        viewNotFound();
        }
      } catch (e) {
        console.error('Render failed:', e);
        render(`<div class="min-h-screen flex items-center justify-center text-red-400 p-6 text-center">Error:<br>${escapeHtml(e.message)}</div>`);
      }
    }

    render(`<div class="min-h-screen flex items-center justify-center text-gray-500"><i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i></div>`);
    refreshIcons();

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      authReady = true;
      renderRoute();
    });
  </script>
</body>
</html>
